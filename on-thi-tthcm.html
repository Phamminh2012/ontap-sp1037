<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi TTHCM</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--acc:#b3261e;--acc2:#8c1d17;
--ok:#1e7d3a;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fce8e6;--sel:#fff4d6;--shadow:0 1px 3px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e21;--ink:#ececee;--mute:#a1a1a8;
--line:#333338;--acc:#f2766b;--acc2:#ff9b92;--ok:#6fcf8a;--okbg:#17321f;--bad:#f2766b;--badbg:#3a1a18;--sel:#3a3320;--shadow:none}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e21;--ink:#ececee;--mute:#a1a1a8;--line:#333338;--acc:#f2766b;--acc2:#ff9b92;
--ok:#6fcf8a;--okbg:#17321f;--bad:#f2766b;--badbg:#3a1a18;--sel:#3a3320;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:16px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;flex:1 1 300px;font-size:14px}
.chip input{margin-top:3px;accent-color:var(--acc)}
.chip b{white-space:nowrap}
.chip .n{color:var(--mute);margin-left:auto;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:var(--acc2)}
button:disabled{opacity:.45;cursor:default}
.opt:disabled{opacity:1}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ghost{border:none;background:none;color:var(--mute);padding:6px 8px}
label.opt-line{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);gap:8px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.q{font-size:18px;font-weight:600;margin:6px 0 14px;line-height:1.45}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;line-height:1.45}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.opt.sel{background:var(--sel);border-color:#d9a400}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.exp{margin-top:12px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--bg);border-radius:6px;font-size:14px;color:var(--mute)}
.exp b{color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.grid button{width:38px;height:34px;padding:0;font-size:13px;border-radius:8px}
.grid .done{background:var(--sel)}.grid .g-ok{background:var(--okbg);border-color:var(--ok)}.grid .g-bad{background:var(--badbg);border-color:var(--bad)}
.grid .cur{outline:2px solid var(--acc)}
.big{font-size:44px;font-weight:700;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums}
.center{text-align:center}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-right:6px}
input[type=search]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.li{border-top:1px solid var(--line);padding:12px 0}
.li .a{color:var(--ok);font-weight:600}
mark{background:var(--sel);color:inherit}
.hidden{display:none!important}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:480px){.q{font-size:17px}.big{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Ôn thi Tư tưởng Hồ Chí Minh<small>SP1037 · Bách Khoa · Giáo trình Bộ GD&ĐT</small></h1>
  <button class="ghost" id="themeBtn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">◐</button>
</header>

<section id="home">
  <div class="card">
    <h2>Chọn chương</h2>
    <div class="chips" id="chapters"></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="allCh">Chọn tất cả</button><button class="ghost" id="noneCh">Bỏ chọn</button>
      <label class="opt-line" style="margin-left:auto"><input type="checkbox" id="onlyExam"> Chỉ câu có trong đề thi / quiz</label>
    </div>
  </div>
  <div class="card">
    <h2>Chế độ</h2>
    <div class="row">
      <button class="pri" id="startPractice">Luyện tập</button>
      <button id="startExam">Thi thử 40 câu · 50 phút</button>
      <button id="startWrong">Ôn câu đã sai (<span id="wrongN">0</span>)</button>
      <button id="startBrowse">Xem toàn bộ đáp án</button>
    </div>
    <p class="mute" style="margin:10px 0 0">Luyện tập: chọn là biết đúng sai ngay, có giải thích. Thi thử: giống đề thật, chấm điểm cuối bài.
    Phím tắt: <kbd>1</kbd>–<kbd>4</kbd> chọn, <kbd>Enter</kbd>/<kbd>→</kbd> câu tiếp, <kbd>←</kbd> câu trước.</p>
  </div>
  <div class="card">
    <h2>Tiến độ của bạn</h2>
    <div class="stats">
      <div><b id="stSeen">0</b><span>câu đã làm</span></div>
      <div><b id="stAcc">–</b><span>tỉ lệ đúng</span></div>
      <div><b id="stTotal">0</b><span>tổng số câu</span></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="resetBtn">Xoá tiến độ</button></div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="meta"><span id="qPos"></span><span id="qTag"></span><span class="timer" id="timer"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="q" id="qText"></div>
    <div id="opts"></div>
    <div id="exp" class="exp hidden"></div>
    <div class="nav">
      <button id="prevBtn">← Trước</button>
      <button class="ghost" id="quitBtn">Thoát</button>
      <button class="pri" id="nextBtn">Tiếp →</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card center">
    <div class="mute" id="rTitle"></div>
    <div class="big" id="rScore"></div>
    <div class="mute" id="rDetail"></div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="pri" id="reviewBtn">Xem lại bài</button>
      <button id="retryWrongBtn">Làm lại câu sai</button>
      <button id="homeBtn">Về trang chính</button>
    </div>
  </div>
  <div class="card" id="rByCh"></div>
</section>

<section id="browse" class="hidden">
  <div class="card">
    <div class="row" style="margin-bottom:10px"><button id="browseBack">← Về</button><span class="mute" id="browseN"></span></div>
    <input type="search" id="search" placeholder="Tìm từ khoá trong câu hỏi / đáp án…">
    <div id="list"></div>
  </div>
</section>
</div>

<script>
const DATA = {"ch":[{"n":1,"t":"Khái niệm, đối tượng, phương pháp nghiên cứu và ý nghĩa học tập môn TTHCM"},{"n":2,"t":"Cơ sở, quá trình hình thành và phát triển TTHCM"},{"n":3,"t":"TTHCM về độc lập dân tộc và chủ nghĩa xã hội"},{"n":4,"t":"TTHCM về Đảng Cộng sản Việt Nam và Nhà nước của nhân dân, do nhân dân, vì nhân dân"},{"n":5,"t":"TTHCM về đại đoàn kết toàn dân tộc và đoàn kết quốc tế"},{"n":6,"t":"TTHCM về văn hóa, đạo đức, con người"}],"qs":[{"c":1,"q":"Khái niệm \"Tư tưởng Hồ Chí Minh\" được nêu đầy đủ nhất (có thêm ý \"là tài sản tinh thần vô cùng to lớn... mãi mãi soi đường\") tại Đại hội nào của Đảng?","o":["Đại hội XI (2011)","Đại hội VII (1991)","Đại hội IX (2001)","Đại hội X (2006)"],"e":"Giáo trình mở đầu chương I bằng khái niệm của ĐH XI (2011). ĐH IX (2001) đã nêu khái niệm khá đầy đủ nhưng chưa có vế \"tài sản tinh thần... soi đường\"."},{"c":1,"q":"Nội dung \"Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam\" trong khái niệm TTHCM thể hiện điều gì?","o":["Bản chất khoa học, cách mạng và nội dung cơ bản của TTHCM","Cơ sở hình thành và nguồn gốc lý luận của TTHCM","Ý nghĩa, giá trị và sức sống lâu bền của TTHCM","Quá trình nhận thức của Đảng về tư tưởng Hồ Chí Minh"],"e":"Quiz BKEL chương 1. Khái niệm gồm 3 ý: (1) bản chất khoa học, cách mạng & nội dung; (2) cơ sở hình thành; (3) ý nghĩa."},{"c":1,"q":"Nội dung \"kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin..., kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hoá nhân loại\" trong khái niệm TTHCM phản ánh điều gì?","o":["Cơ sở (nguồn gốc tư tưởng, lý luận) hình thành TTHCM","Bản chất khoa học, cách mạng của TTHCM","Ý nghĩa, giá trị của TTHCM","Đối tượng nghiên cứu của môn học"],"e":"Ý thứ hai của khái niệm: nêu cơ sở hình thành, trong đó chủ nghĩa Mác - Lênin là giá trị cơ bản nhất."},{"c":1,"q":"Nhận định nào phản ánh giá trị, ý nghĩa, sức hấp dẫn và sức sống lâu bền của TTHCM?","o":["TTHCM là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc, mãi mãi soi đường cho nhân dân ta giành thắng lợi","TTHCM là kết quả của sự vận dụng sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể nước ta","TTHCM là sự kế thừa và phát triển các giá trị truyền thống dân tộc, tiếp thu tinh hoa văn hóa nhân loại","TTHCM là hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam"],"e":"Câu hỏi BKEL."},{"c":1,"q":"Theo khái niệm TTHCM, trong quá trình hình thành tư tưởng đó, giá trị nào là \"cơ bản nhất\"?","o":["Chủ nghĩa Mác - Lênin","Chủ nghĩa yêu nước Việt Nam","Tinh hoa văn hóa phương Đông","Tinh hoa văn hóa phương Tây"],"e":"GT: \"cơ sở hình thành TTHCM là chủ nghĩa Mác-Lênin — giá trị cơ bản nhất trong quá trình hình thành và phát triển của tư tưởng đó\"."},{"c":1,"q":"Theo khái niệm TTHCM, con đường phát triển của dân tộc Việt Nam để đạt mục tiêu \"nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh\" là","o":["độc lập dân tộc gắn liền với chủ nghĩa xã hội","độc lập dân tộc gắn liền với dân chủ","đại đoàn kết dân tộc gắn với đoàn kết quốc tế","công nghiệp hóa, hiện đại hóa đất nước"],"e":""},{"c":1,"q":"Đảng Cộng sản Việt Nam khẳng định \"Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động\" lần đầu tiên vào năm nào?","o":["1991 (Đại hội VII)","1986 (Đại hội VI)","2001 (Đại hội IX)","2006 (Đại hội X)"],"e":"Quiz BKEL chương 1. ĐH VII là \"một mốc lớn khi nêu cao tư tưởng Hồ Chí Minh\"."},{"c":1,"q":"Tại thời điểm diễn ra Đại hội VII (1991), Hồ Chí Minh đã qua đời bao nhiêu năm và sự nghiệp đổi mới đã diễn ra bao nhiêu năm?","o":["22 năm và 5 năm","20 năm và 5 năm","22 năm và 10 năm","25 năm và 6 năm"],"e":""},{"c":1,"q":"Lời khẳng định \"Đảng phải đặc biệt coi trọng việc tổ chức học tập một cách có hệ thống tư tưởng, đạo đức, tác phong của Chủ tịch Hồ Chí Minh trong toàn Đảng\" thuộc văn kiện nào?","o":["Đại hội V (3-1982)","Đại hội IV (12-1976)","Đại hội VI (12-1986)","Đại hội III (9-1960)"],"e":"Quiz BKEL chương 1."},{"c":1,"q":"Đại hội nào của Đảng nêu: \"Đường lối chính trị, nền nếp làm việc và đạo đức cách mạng của Đảng ta hiện nay là đường lối, tác phong và đạo đức Hồ Chủ tịch\"?","o":["Đại hội II (2-1951)","Đại hội III (9-1960)","Đại hội IV (12-1976)","Đại hội V (3-1982)"],"e":"ĐH II còn nói sự học tập ấy \"là điều kiện tiên quyết làm cho Đảng mạnh và làm cho cách mạng đi mau đến thắng lợi hoàn toàn\"."},{"c":1,"q":"Câu \"Dân tộc ta, nhân dân ta, non sông đất nước ta đã sinh ra Hồ Chủ tịch, người anh hùng dân tộc vĩ đại, và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta\" nằm trong văn kiện nào?","o":["Điếu văn của Ban Chấp hành Trung ương Đảng","Di chúc của Chủ tịch Hồ Chí Minh để lại","Văn kiện Đại hội IV của Đảng (12-1976)","Nghị quyết của UNESCO tại Pari năm 1987"],"e":""},{"c":1,"q":"Đại hội nào của Đảng (12-1976) đánh giá Hồ Chí Minh là \"người sáng lập và rèn luyện Đảng ta, người khai sinh nền Cộng hoà Dân chủ Việt Nam, người vun trồng khối đại đoàn kết dân tộc...\"?","o":["Đại hội IV","Đại hội III","Đại hội V","Đại hội VI"],"e":""},{"c":1,"q":"Đại hội VI (12-1986) khi đề ra đường lối đổi mới đã nhấn mạnh Đảng phải","o":["nắm vững bản chất cách mạng và khoa học của chủ nghĩa Mác - Lênin, kế thừa di sản quý báu về tư tưởng và lý luận cách mạng của Chủ tịch Hồ Chí Minh","lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động","kiên định chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, vận dụng sáng tạo và phát triển phù hợp với thực tiễn Việt Nam","đặc biệt coi trọng việc học tập tư tưởng, đạo đức, tác phong Hồ Chí Minh"],"e":"Phương án 2 là ĐH VII, phương án 3 là ĐH XII, phương án 4 là ĐH V."},{"c":1,"q":"Việc khẳng định lấy chủ nghĩa Mác - Lênin, TTHCM làm nền tảng tư tưởng còn được ghi nhận trong những văn kiện quan trọng nào?","o":["Cương lĩnh năm 1991 (bổ sung, phát triển 2011) và Hiến pháp năm 1992, 2013","Cương lĩnh chính trị đầu tiên năm 1930 và Hiến pháp năm 1946","Luận cương chính trị 1930 và Hiến pháp năm 1959","Chính cương Đảng Lao động 1951 và Hiến pháp năm 1980"],"e":""},{"c":1,"q":"Đại hội IX (4-2001) có ý nghĩa gì trong quá trình nhận thức của Đảng về TTHCM?","o":["Nhận thức về TTHCM đầy đủ hơn Đại hội VII, nêu khái niệm TTHCM khá toàn diện","Lần đầu tiên khẳng định TTHCM là nền tảng tư tưởng, kim chỉ nam của Đảng","Lần đầu tiên tôn vinh Hồ Chí Minh là \"Anh hùng dân tộc vĩ đại\" của Việt Nam","Lần đầu tiên đề ra đường lối đổi mới toàn diện theo tư tưởng Hồ Chí Minh"],"e":""},{"c":1,"q":"Đại hội XII (2016) nhấn mạnh yêu cầu gì đối với chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh?","o":["Kiên định chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, vận dụng sáng tạo và phát triển phù hợp với thực tiễn Việt Nam","Lấy chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động","Nắm vững bản chất cách mạng và khoa học của chủ nghĩa Mác - Lênin, kế thừa di sản Hồ Chí Minh","Đặc biệt coi trọng tổ chức học tập có hệ thống tư tưởng, đạo đức, tác phong Hồ Chí Minh"],"e":""},{"c":1,"q":"UNESCO ra nghị quyết ghi nhận Hồ Chí Minh là \"anh hùng giải phóng dân tộc và nhà văn hoá kiệt xuất của Việt Nam\" tại khóa họp nào?","o":["Khóa họp Đại hội đồng lần thứ 24 tại Pari năm 1987","Khóa họp Đại hội đồng lần thứ 18 tại Pari năm 1985","Khóa họp Đại hội đồng lần thứ 24 tại Niu Oóc năm 1990","Khóa họp Đại hội đồng lần thứ 25 tại Pari năm 1989"],"e":"Nghị quyết 24C/18.6.5 (20-10 đến 20-11-1987), kỷ niệm 100 năm ngày sinh (1990)."},{"c":1,"q":"Đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh là","o":["toàn bộ những quan điểm của Hồ Chí Minh thể hiện trong di sản của Người","toàn bộ những bài viết của Hồ Chí Minh thể hiện trong di sản của Người","toàn bộ những bài nói của Hồ Chí Minh thể hiện trong di sản của Người","toàn bộ những hoạt động cách mạng của Hồ Chí Minh trong suốt tiến trình cách mạng"],"e":"Quiz BKEL chương 1. Đối tượng còn là quá trình hệ thống quan điểm đó \"vận động trong thực tiễn\" (hiện thực hóa)."},{"c":1,"q":"Ngoài hệ thống quan điểm của Hồ Chí Minh, đối tượng nghiên cứu môn học TTHCM còn là","o":["quá trình \"hiện thực hóa\" hệ thống quan điểm đó trong quá trình phát triển của dân tộc Việt Nam","lịch sử hình thành, phát triển và lãnh đạo cách mạng của Đảng Cộng sản Việt Nam","quá trình phát triển của lịch sử dân tộc Việt Nam từ thời dựng nước đến nay","toàn bộ di sản văn học, nghệ thuật và báo chí mà Hồ Chí Minh để lại"],"e":""},{"c":1,"q":"Môn học Tư tưởng Hồ Chí Minh là một nội dung của chuyên ngành nào?","o":["Hồ Chí Minh học (thuộc ngành Khoa học chính trị)","Lịch sử Đảng (thuộc ngành Lịch sử)","Triết học Mác - Lênin (thuộc ngành Triết học)","Chủ nghĩa xã hội khoa học (thuộc ngành Triết học)"],"e":""},{"c":1,"q":"Nội dung nào KHÔNG phải nhiệm vụ nghiên cứu của môn học Tư tưởng Hồ Chí Minh?","o":["Quá trình phát triển của lịch sử dân tộc Việt Nam","Cơ sở khách quan và chủ quan hình thành TTHCM","Các giai đoạn hình thành và phát triển TTHCM","Các giá trị tư tưởng, lý luận của Hồ Chí Minh đối với kho tàng lý luận cách mạng thế giới"],"e":"Câu hỏi BKEL."},{"c":1,"q":"Nghiên cứu TTHCM phải đứng trên lập trường giai cấp công nhân, quan điểm của chủ nghĩa Mác - Lênin, quán triệt đường lối của Đảng, đồng thời bảo đảm tính khách quan. Đó là nội dung của nguyên tắc phương pháp luận nào?","o":["Thống nhất tính đảng và tính khoa học","Thống nhất lý luận và thực tiễn","Quan điểm lịch sử - cụ thể","Quan điểm toàn diện và hệ thống"],"e":"Quiz BKEL chương 1."},{"c":1,"q":"Chọn phương án SAI khi nói về các nguyên tắc phương pháp luận nghiên cứu TTHCM","o":["Quan điểm bộ phận và hệ thống","Quan điểm lịch sử - cụ thể","Quan điểm kế thừa và phát triển","Thống nhất tính đảng và tính khoa học"],"e":"5 nguyên tắc: tính đảng & tính khoa học; lý luận & thực tiễn; lịch sử - cụ thể; toàn diện và hệ thống; kế thừa và phát triển."},{"c":1,"q":"Để đảm bảo tính khoa học, khi nghiên cứu TTHCM phải đứng trên lập trường, quan điểm, phương pháp luận của","o":["chủ nghĩa Mác - Lênin","giai cấp vô sản","giai cấp công nhân","tầng lớp trí thức"],"e":"Câu hỏi BKEL."},{"c":1,"q":"Theo phương pháp luận Hồ Chí Minh, thước đo duy nhất để nhận rõ hiệu quả tư duy và hành động của người cách mạng, của tổ chức cách mạng là","o":["tư duy và hành động đó có đưa lại quyền lợi chính đáng cho nhân dân hay không","tư duy và hành động đó có đúng với chủ nghĩa Mác - Lênin hay không","tư duy và hành động đó có phù hợp với đường lối của Đảng hay không","tư duy và hành động đó có đem lại thắng lợi cho cách mạng hay không"],"e":"GT, mục \"Thống nhất tính đảng và tính khoa học\": mục tiêu cuối cùng và cao cả nhất là giải phóng con người toàn diện."},{"c":1,"q":"Theo Hồ Chí Minh, \"Lý luận như cái ..., nó chỉ phương hướng cho chúng ta trong công việc thực tế. Không có lý luận thì lúng túng như nhắm mắt mà đi\"","o":["kim chỉ nam","ngọn đuốc","la bàn","bó đuốc soi đường"],"e":""},{"c":1,"q":"Hồ Chí Minh ví người \"có kinh nghiệm mà không có lý luận\" giống như","o":["một mắt sáng, một mắt mờ","nhắm mắt mà đi","cái hòm đựng sách","có tên mà không bắn"],"e":""},{"c":1,"q":"Theo Hồ Chí Minh, người xem hàng vạn quyển lý luận mà không biết đem ra thực hành thì \"khác nào ...\"","o":["một cái hòm đựng sách","một mắt sáng, một mắt mờ","nhắm mắt mà đi","người đầu ngược xuống đất"],"e":"Đó là căn bệnh \"lý luận suông\". \"Lý luận cũng như cái tên (hoặc viên đạn). Thực hành cũng như cái đích để bắn\"."},{"c":1,"q":"Trong quan điểm toàn diện và hệ thống, hạt nhân cốt lõi của hệ thống TTHCM là","o":["tư tưởng độc lập, tự do, dân chủ và chủ nghĩa xã hội","tư tưởng đại đoàn kết toàn dân tộc gắn với đoàn kết quốc tế","tư tưởng về Đảng Cộng sản cầm quyền và Nhà nước của dân","tư tưởng về đạo đức cách mạng, văn hóa và con người"],"e":""},{"c":1,"q":"Khi nghiên cứu, học tập TTHCM, ngoài việc biết kế thừa, vận dụng thì còn phải","o":["phát triển sáng tạo tư tưởng của Hồ Chí Minh trong điều kiện lịch sử mới","bảo đảm tính nguyên vẹn của tư tưởng Hồ Chí Minh trong điều kiện lịch sử mới","phát triển hình thức tư tưởng của Hồ Chí Minh trong điều kiện lịch sử mới","bảo tồn toàn bộ các giá trị tư tưởng của Hồ Chí Minh"],"e":"Câu hỏi BKEL (quan điểm kế thừa và phát triển)."},{"c":1,"q":"Phương pháp nghiên cứu sự vật, hiện tượng theo trình tự thời gian, đi từ phát sinh, phát triển đến hệ quả là","o":["phương pháp lịch sử","phương pháp lôgíc","phương pháp phân tích văn bản","phương pháp liên ngành"],"e":""},{"c":1,"q":"Phương pháp nghiên cứu một cách tổng quát nhằm tìm ra bản chất vốn có của sự vật, hiện tượng và khái quát thành lý luận là","o":["phương pháp lôgíc","phương pháp lịch sử","phương pháp so sánh","phương pháp điều tra xã hội học"],"e":""},{"c":1,"q":"Vì sao nghiên cứu TTHCM phải kết hợp phân tích văn bản với nghiên cứu hoạt động thực tiễn của Hồ Chí Minh?","o":["Vì nhiều nội dung tư tưởng Hồ Chí Minh không nằm trong văn bản mà ở trong chỉ đạo thực tiễn của Người","Vì các tác phẩm của Hồ Chí Minh chưa được sưu tầm, công bố đầy đủ cho đến nay","Vì Hồ Chí Minh không viết tác phẩm lý luận chuyên sâu nào về cách mạng Việt Nam","Vì trong tư tưởng Hồ Chí Minh, thực tiễn luôn quan trọng hơn lý luận"],"e":""},{"c":1,"q":"Bộ sách Hồ Chí Minh Toàn tập (Nxb Chính trị quốc gia, 2011) gồm bao nhiêu tập?","o":["15 tập","12 tập","10 tập","20 tập"],"e":""},{"c":1,"q":"Ý nghĩa nào sau đây KHÔNG thuộc ý nghĩa của việc học tập môn TTHCM được nêu trong giáo trình?","o":["Trang bị kiến thức chuyên môn kỹ thuật cho sinh viên","Góp phần nâng cao năng lực tư duy lý luận","Giáo dục và thực hành đạo đức cách mạng, củng cố niềm tin khoa học, bồi dưỡng lòng yêu nước","Xây dựng, rèn luyện phương pháp và phong cách công tác"],"e":""},{"c":1,"q":"Phương châm Hồ Chí Minh đã nêu mà người học có thể vận dụng trong xây dựng phong cách tư duy, làm việc, ứng xử phù hợp với từng lúc, từng nơi là","o":["Dĩ bất biến, ứng vạn biến","Học đi đôi với hành","Nói đi đôi với làm","Cần, kiệm, liêm, chính"],"e":""},{"c":1,"q":"Điều mong muốn cuối cùng Hồ Chí Minh ghi trong Di chúc là: \"Toàn Đảng, toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam ..., và góp phần xứng đáng vào sự nghiệp cách mạng thế giới\"","o":["hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh","độc lập, tự do, hạnh phúc, dân chủ và giàu mạnh","dân giàu, nước mạnh, dân chủ, công bằng, văn minh","hòa bình, độc lập, thống nhất, tự do và hạnh phúc"],"e":""},{"c":1,"q":"Chọn phương án SAI khi diễn đạt ý nghĩa của khái niệm \"tư tưởng\" trong thuật ngữ \"tư tưởng Hồ Chí Minh\". Tư tưởng ở đây được hiểu là:","o":["Tinh thần - tư tưởng, ý thức tư tưởng của một cá nhân, một cộng đồng","Hệ thống những quan điểm, quan niệm, luận điểm xây dựng trên một nền tảng triết học nhất quán","Đại biểu cho ý chí, nguyện vọng của cả một giai cấp, một dân tộc","Được hình thành trên cơ sở thực tiễn và chỉ đạo thực tiễn"],"e":"Câu hỏi BKEL. \"Tư tưởng\" ở đây mang tầm khái quát triết học, không phải ý thức tư tưởng thông thường."},{"c":1,"q":"Chọn câu trả lời đúng nhất về vai trò của chủ nghĩa Mác - Lênin đối với TTHCM","o":["Là cơ sở thế giới quan, phương pháp luận, nguồn gốc tư tưởng, lý luận trực tiếp quyết định bản chất cách mạng, khoa học của TTHCM","Là cơ sở thế giới quan, phương pháp luận, nguồn gốc chủ quan, quyết định bản chất cách mạng, khoa học của TTHCM","Là cơ sở chủ quan, nguồn gốc tư tưởng, lý luận trực tiếp quyết định bản chất cách mạng, khoa học của TTHCM","Là cơ sở thế giới quan, phương pháp luận, trang bị cho Hồ Chí Minh phẩm chất đạo đức và năng lực hoạt động thực tiễn"],"e":"Câu hỏi BKEL."},{"c":2,"q":"Thực dân Pháp bắt đầu tiến hành xâm lược Việt Nam từ năm nào?","o":["1858","1862","1884","1897"],"e":""},{"c":2,"q":"Ở miền Nam, cuối thế kỷ XIX có các cuộc khởi nghĩa chống Pháp tiêu biểu của","o":["Trương Định, Nguyễn Trung Trực","Trần Tấn, Đặng Như Mai","Phan Đình Phùng, Nguyễn Thiện Thuật","Hoàng Hoa Thám, Nguyễn Quang Bích"],"e":"Miền Trung: Trần Tấn, Đặng Như Mai, Phan Đình Phùng. Miền Bắc: Nguyễn Thiện Thuật, Phạm Bành - Đinh Công Tráng, Nguyễn Quang Bích, Hoàng Hoa Thám."},{"c":2,"q":"Điểm giống nhau ở các cuộc khởi nghĩa của Trương Định, Nguyễn Trung Trực, Nguyễn Thiện Thuật cuối thế kỷ XIX là","o":["đều là khởi nghĩa vũ trang","đều diễn ra ở miền Nam","đều diễn ra ở miền Trung","đều mang bản chất nông dân"],"e":"Đề thi HK232. Trương Định, Nguyễn Trung Trực ở miền Nam; Nguyễn Thiện Thuật ở miền Bắc."},{"c":2,"q":"Tìm phương án SAI: Điểm giống nhau ở các cuộc khởi nghĩa vũ trang của Nguyễn Thiện Thuật, Đinh Công Tráng, Nguyễn Quang Bích cuối thế kỷ XIX là","o":["đều diễn ra ở miền Trung","đều do sĩ phu lãnh đạo","đều bị thực dân đàn áp","đều diễn ra ở miền Bắc"],"e":"Đề thi HK222. Cả ba đều thuộc nhóm khởi nghĩa ở miền Bắc."},{"c":2,"q":"Các cuộc khởi nghĩa dưới ngọn cờ \"Cần Vương\" cuối thế kỷ XIX đều thất bại, điều đó chứng tỏ","o":["giai cấp phong kiến và hệ tư tưởng của nó đã suy tàn, bất lực trước nhiệm vụ bảo vệ độc lập dân tộc","nhân dân ta chưa thật sự yêu nước và chưa đoàn kết chống thực dân Pháp","giai cấp nông dân chưa được tập hợp và phát huy sức mạnh của mình","triều đình nhà Nguyễn đã hoàn toàn đầu hàng và làm tay sai cho thực dân Pháp"],"e":"\"Cần Vương\" nghĩa là giúp vua cứu nước."},{"c":2,"q":"Thực dân Pháp bắt tay vào khai thác thuộc địa Việt Nam một cách mạnh mẽ sau khi","o":["hoàn thành căn bản việc bình định Việt Nam về mặt quân sự","biến Việt Nam thành nước nửa thuộc địa nửa phong kiến","biến Việt Nam thành nước thuộc địa và phong kiến","hoàn thành việc đàn áp các cuộc khởi nghĩa nông dân"],"e":"Đề thi HK232."},{"c":2,"q":"Thuật ngữ \"thuộc địa và phong kiến\" để chỉ tính chất xã hội Việt Nam dưới ách Pháp được Hồ Chí Minh nêu trong tác phẩm nào?","o":["Thường thức chính trị","Đường cách mệnh","Bản án chế độ thực dân Pháp","Chánh cương vắn tắt của Đảng"],"e":""},{"c":2,"q":"Sự khai thác thuộc địa một cách mạnh mẽ của thực dân Pháp đã khiến xã hội Việt Nam xuất hiện điều gì?","o":["Sự biến đổi về cơ cấu giai cấp, tầng lớp xã hội","Sự mâu thuẫn sâu sắc giữa địa chủ và nông dân","Sự phát triển vượt bậc của nền kinh tế nông nghiệp","Sự hình thành lớp thợ thủ công, tiểu thương mới"],"e":""},{"c":2,"q":"Điểm mới của nền nông nghiệp Việt Nam dưới ách cai trị của thực dân Pháp là","o":["giai cấp địa chủ gia tăng về số lượng (bổ sung thêm điền chủ người Pháp)","nông nghiệp được ứng dụng khoa học kỹ thuật tiên tiến của phương Tây","lần đầu xuất hiện mâu thuẫn giữa giai cấp nông dân và địa chủ","nền kinh tế thị trường nông nghiệp tăng trưởng mạnh mẽ"],"e":"Đề thi HK222, HK232. Pháp vẫn duy trì nền nông nghiệp lạc hậu (~95% dân số là nông dân)."},{"c":2,"q":"Dưới chính sách khai thác thuộc địa của Pháp, trong xã hội Việt Nam xuất hiện những giai tầng mới nào?","o":["Giai cấp công nhân, giai cấp tư sản và tầng lớp tiểu tư sản ở thành thị","Giai cấp địa chủ, giai cấp tư sản và tầng lớp tiểu tư sản","Giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức","Tầng lớp thợ thủ công, tiểu thương và tư sản mại bản"],"e":""},{"c":2,"q":"Bên cạnh mâu thuẫn cơ bản nông dân - địa chủ phong kiến, xã hội Việt Nam đầu thế kỷ XX xuất hiện những mâu thuẫn mới nào?","o":["Công nhân với tư sản; toàn thể nhân dân Việt Nam với chủ nghĩa đế quốc Pháp","Địa chủ với tư sản; nông dân với công nhân","Tư sản dân tộc với tư sản mại bản; công nhân với địa chủ","Tiểu tư sản với tư sản; nông dân với thực dân Pháp"],"e":""},{"c":2,"q":"Phong trào Đông Du (1905-1909) do ai khởi xướng?","o":["Phan Bội Châu","Phan Châu Trinh","Lương Văn Can","Nguyễn Quyền"],"e":""},{"c":2,"q":"Phong trào Duy Tân (1906-1908) do ai phát động?","o":["Phan Châu Trinh","Phan Bội Châu","Lương Văn Can","Huỳnh Thúc Kháng"],"e":""},{"c":2,"q":"Nhân vật nào sau đây KHÔNG phải là thủ lĩnh của phong trào yêu nước theo khuynh hướng dân chủ tư sản?","o":["Hoàng Hoa Thám","Phan Bội Châu","Phan Châu Trinh","Lương Văn Can"],"e":"Quiz thầy PDA. Hoàng Hoa Thám lãnh đạo khởi nghĩa nông dân Yên Thế."},{"c":2,"q":"Phong trào Đông Du, Duy Tân và Đông Kinh Nghĩa Thục có điểm chung là","o":["đều theo khuynh hướng dân chủ tư sản","đều do giai cấp tư sản dân tộc lãnh đạo","đều thu hút sự tham gia của giai cấp nông dân","đều nổ ra mạnh mẽ ở khu vực Nam Bộ"],"e":"Các phong trào này do các sĩ phu yêu nước có tinh thần cải cách dẫn dắt."},{"c":2,"q":"Nguyên nhân SÂU XA khiến các phong trào yêu nước theo khuynh hướng dân chủ tư sản đầu thế kỷ XX thất bại là","o":["giai cấp tư sản Việt Nam còn non yếu","các tổ chức và người lãnh đạo chưa có đường lối và phương pháp cách mạng đúng đắn","không phát huy được vai trò của giai cấp công nhân","thực dân Pháp đàn áp quá khốc liệt"],"e":"Nguyên nhân trực tiếp: chưa có đường lối và phương pháp cách mạng đúng đắn."},{"c":2,"q":"Nguyên nhân TRỰC TIẾP khiến các phong trào yêu nước theo khuynh hướng dân chủ tư sản đầu thế kỷ XX thất bại là","o":["các tổ chức và người lãnh đạo chưa có đường lối và phương pháp cách mạng đúng đắn","giai cấp tư sản Việt Nam còn non yếu cả về kinh tế lẫn chính trị","giai cấp phong kiến và hệ tư tưởng phong kiến đã suy tàn, lỗi thời","thiếu sự ủng hộ của quốc tế và bị thực dân đàn áp khốc liệt"],"e":""},{"c":2,"q":"Sự thất bại của các phong trào yêu nước cuối thế kỷ XIX - đầu thế kỷ XX thể hiện điều gì?","o":["Sự khủng hoảng về đường lối cứu nước","Sự bạc nhược của triều đình phong kiến","Sự cần thiết phải có chính đảng","Sự thiếu vắng vai trò của giai cấp công nhân"],"e":"Quiz thầy PDA."},{"c":2,"q":"Hoàn cảnh của giai cấp công nhân Việt Nam cuối thế kỷ XIX là","o":["lực lượng ít ỏi, không ổn định","đã được giác ngộ chủ nghĩa Mác - Lênin","có ý thức kỷ luật, tinh thần đoàn kết cao","nhiều phong trào công nhân đã nổ ra"],"e":"Quiz thầy PDA. Đầu thế kỷ XX công nhân mới trở thành một giai cấp (ngay trước CTTG thứ nhất)."},{"c":2,"q":"Công nhân Việt Nam chịu mấy tầng áp bức, bóc lột?","o":["Ba tầng: thực dân, tư bản, phong kiến","Hai tầng: thực dân và phong kiến","Hai tầng: đế quốc và tư bản","Ba tầng: đế quốc, địa chủ, tư sản mại bản"],"e":""},{"c":2,"q":"Hình thức đấu tranh ban đầu (thô sơ) của giai cấp công nhân Việt Nam chống lại giới chủ là","o":["bỏ trốn tập thể, đốt lán trại","đình công tập thể","bãi công tập thể","gửi truyền đơn"],"e":"Đề thi HK232. Sau đó công nhân nhanh chóng tiến tới đình công, bãi công."},{"c":2,"q":"Theo Hồ Chí Minh, \"Chỉ có giai cấp ... là dũng cảm nhất, cách mạng nhất, luôn luôn gan góc đương đầu với bọn đế quốc thực dân\"","o":["công nhân","nông dân","tiểu tư sản","trí thức"],"e":""},{"c":2,"q":"Những phong trào đấu tranh nào đã tạo điều kiện thuận lợi để chủ nghĩa Mác - Lênin xâm nhập, truyền bá vào Việt Nam đầu thế kỷ XX?","o":["Phong trào công nhân và các phong trào yêu nước","Phong trào công nhân và phong trào trí thức","Phong trào nông dân và các phong trào yêu nước","Phong trào tiểu tư sản và phong trào nông dân"],"e":""},{"c":2,"q":"TTHCM được hình thành trong bối cảnh lịch sử thế giới nào?","o":["Chủ nghĩa tư bản chuyển từ tự do cạnh tranh sang giai đoạn đế quốc chủ nghĩa","Chủ nghĩa tư bản đang ở đỉnh cao của giai đoạn tự do cạnh tranh","Chủ nghĩa tư bản đang trong giai đoạn hình thành và tích lũy ban đầu","Chủ nghĩa xã hội đã trở thành hệ thống thế giới và đang phát triển"],"e":"Quiz BKEL chương 2."},{"c":2,"q":"Đầu thế kỷ XX, mâu thuẫn nào KHÔNG thuộc các mâu thuẫn vốn có trong lòng chủ nghĩa tư bản được giáo trình nêu?","o":["Mâu thuẫn giữa nông dân với địa chủ phong kiến ở các nước thuộc địa","Mâu thuẫn giữa giai cấp tư sản với giai cấp vô sản ở các nước tư bản","Mâu thuẫn giữa các nước đế quốc với nhau","Mâu thuẫn giữa các dân tộc thuộc địa và phụ thuộc với chủ nghĩa đế quốc"],"e":""},{"c":2,"q":"Sự kiện nào mở ra con đường giải phóng cho các dân tộc bị áp bức trên thế giới?","o":["Cách mạng Tháng Mười Nga thành công năm 1917","Sự ra đời của Quốc tế Cộng sản ở Mátxcơva năm 1919","Sự ra đời của Quốc tế II ở Pari năm 1889","Tuyên ngôn của Đảng Cộng sản được công bố năm 1848"],"e":"Đề thi HK232. CM Tháng Mười mở ra thời đại mới: quá độ từ CNTB lên CNXH trên phạm vi toàn thế giới."},{"c":2,"q":"Cách mạng Tháng Mười Nga thành công đã mở ra thời đại mới trong lịch sử loài người, đó là","o":["thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới","thời đại đế quốc chủ nghĩa và chiến tranh giành giật thuộc địa trên thế giới","thời đại cách mạng dân chủ tư sản lan rộng ra toàn thế giới","thời đại sụp đổ của hệ thống thuộc địa kiểu cũ trên phạm vi toàn cầu"],"e":""},{"c":2,"q":"Quốc tế Cộng sản (Quốc tế III) ra đời vào thời gian và địa điểm nào?","o":["2-3-1919 tại Mátxcơva","3-2-1919 tại Mátxcơva","2-3-1920 tại Pêtơrôgrát","7-11-1917 tại Pêtơrôgrát"],"e":"Quiz thầy PDA. QTCS là \"Bộ tham mưu\", lãnh đạo phong trào cách mạng thế giới."},{"c":2,"q":"Một trong những nguyên nhân thúc đẩy sự ra đời của các đảng cộng sản ở nhiều nước trên thế giới đầu thế kỷ XX là","o":["Quốc tế Cộng sản đẩy mạnh truyền bá chủ nghĩa Mác - Lênin và kinh nghiệm Cách mạng Tháng Mười","Liên Xô thành lập nhà nước Xôviết và bắt đầu xây dựng chủ nghĩa xã hội","giai cấp công nhân thế giới phát triển vượt bậc về mặt số lượng và tổ chức","Cách mạng Tháng Mười Nga và phong trào công nhân châu Âu cùng thành công"],"e":"Đề thi HK222."},{"c":2,"q":"Giá trị xuyên suốt trong những truyền thống tốt đẹp của dân tộc Việt Nam, là nền tảng tư tưởng, điểm xuất phát và động lực thúc đẩy Hồ Chí Minh ra đi tìm đường cứu nước là","o":["chủ nghĩa yêu nước","lòng nhân ái","tinh thần hiếu học","cần cù lao động"],"e":"Quiz BKEL chương 2."},{"c":2,"q":"Câu \"Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mệnh và của cải để giữ vững quyền tự do và độc lập ấy\" nằm trong văn kiện nào?","o":["Tuyên ngôn Độc lập (1945)","Lời kêu gọi toàn quốc kháng chiến (1946)","Thư gửi đồng bào Nam Bộ (1946)","Lời kêu gọi đồng bào và chiến sĩ cả nước (1966)"],"e":""},{"c":2,"q":"Theo Hồ Chí Minh, truyền thống yêu nước, đấu tranh chống giặc ngoại xâm là","o":["giá trị tinh thần thiêng liêng, bất hủ của dân tộc Việt Nam","giá trị tinh thần, nét đẹp tâm hồn của người dân Việt Nam","giá trị tinh thần, thể hiện sự gắn kết của dân tộc Việt Nam","giá trị tinh thần, ý chí chiến đấu của người dân Việt Nam"],"e":"Đề thi HK231."},{"c":2,"q":"Trong tư tưởng Hồ Chí Minh, một nguyên tắc chiến lược quyết định thắng lợi của cách mạng Việt Nam là","o":["đoàn kết dân tộc gắn liền với đoàn kết quốc tế","chủ nghĩa yêu nước là sức mạnh của cách mạng","không có gì quý hơn độc lập, tự do, hạnh phúc","khoan dung và hòa hiếu với các dân tộc lân bang"],"e":"Đề thi HK222."},{"c":2,"q":"Tinh hoa văn hóa, tư tưởng phương Đông mà Hồ Chí Minh tiếp thu kết tinh trong ba học thuyết lớn nào?","o":["Nho giáo, Phật giáo, Lão giáo","Nho giáo, Phật giáo, Thiên Chúa giáo","Nho giáo, Pháp gia, Mặc gia","Phật giáo, Lão giáo, Ấn Độ giáo"],"e":""},{"c":2,"q":"\"Chỉ có những người cách mạng chân chính mới thu hái được những điều hiểu biết quý báu của các đời trước để lại\" là lời dạy của ai (được Hồ Chí Minh dẫn khi nói về Khổng Tử)?","o":["Lênin","C. Mác","Ph. Ăngghen","Hồ Chí Minh"],"e":"Đề thi HK222."},{"c":2,"q":"Đối với Nho giáo, Hồ Chí Minh đặc biệt chú ý kế thừa, đổi mới, phát triển điều gì?","o":["Tinh thần trọng đạo đức trong việc tu dưỡng, rèn luyện đạo đức con người","Tư tưởng từ bi, vị tha, cứu khổ cứu nạn, khuyến khích làm việc thiện","Tư tưởng sống gắn bó, hòa đồng với thiên nhiên, bảo vệ môi trường sống","Tư tưởng quản lý xã hội bằng pháp luật nghiêm minh, thưởng phạt rõ ràng"],"e":""},{"c":2,"q":"Khát vọng đi đến một thế giới đại đồng với hòa bình, không có chiến tranh, các dân tộc quan hệ hữu nghị được Hồ Chí Minh kế thừa từ","o":["Nho giáo (Khổng Tử)","Lão Tử","Mặc Tử","Hàn Phi Tử"],"e":""},{"c":2,"q":"Theo Hồ Chí Minh, ưu điểm lớn nhất của học thuyết Khổng Tử là","o":["sự tu dưỡng đạo đức cá nhân","tinh thần hiếu học","quản lý xã hội bằng đạo đức","quản lý xã hội bằng pháp luật"],"e":"Quiz BKEL chương 2."},{"c":2,"q":"Theo Hồ Chí Minh, tôn giáo Giêxu có ưu điểm là","o":["lòng nhân ái cao cả","sự tu dưỡng đạo đức cá nhân","phương pháp làm việc biện chứng","chính sách phù hợp với điều kiện nước ta"],"e":"Đề HK241 (tham khảo)."},{"c":2,"q":"Theo Hồ Chí Minh, ưu điểm của chủ nghĩa Mác là","o":["phương pháp làm việc biện chứng","bản chất khoa học","chủ nghĩa nhân đạo triệt để","lòng nhân ái cao cả"],"e":"Đề HK241 (tham khảo)."},{"c":2,"q":"Theo Hồ Chí Minh, chủ nghĩa Tôn Dật Tiên có ưu điểm là","o":["chính sách của nó phù hợp với điều kiện nước ta","tư tưởng hòa bình, hữu nghị giữa các dân tộc","đấu tranh triệt để vì tự do, dân chủ cho nhân dân","chủ trương chống phong kiến, chia ruộng cho dân cày"],"e":""},{"c":2,"q":"Hồ Chí Minh đánh giá điểm chung của Khổng Tử, Giêxu, Mác, Tôn Dật Tiên là","o":["đều muốn mưu hạnh phúc cho loài người, mưu phúc lợi cho xã hội","đều là những nhà tư tưởng vĩ đại nhất của nhân loại","đều là các nhà đạo đức đề cao phép biện chứng duy vật","đều nêu cao sự tu dưỡng, rèn luyện đạo đức cá nhân"],"e":"Đề thi HK232. \"Tôi cố gắng làm học trò nhỏ của các vị ấy\"."},{"c":2,"q":"Đối với Phật giáo, Hồ Chí Minh chú ý kế thừa, phát triển những tư tưởng nào?","o":["Từ bi, vị tha, yêu thương con người, làm việc thiện, chống điều ác, đề cao quyền bình đẳng","Sống gắn bó, hòa đồng với thiên nhiên, biết bảo vệ môi trường sống của con người","Nhân trị, đức trị, xây dựng một xã hội lý tưởng đại đồng, hòa bình, không chiến tranh","Thoát khỏi mọi ràng buộc của vòng danh lợi, hành động theo đạo lý tự nhiên"],"e":""},{"c":2,"q":"Quan điểm nào sau đây thể hiện Hồ Chí Minh đã tiếp thu tư tưởng Phật giáo?","o":["\"Đồng bào ta đại đoàn kết, hy sinh của cải xương máu, kháng chiến đến cùng, để đánh tan thực dân phản động, để cứu quốc dân ra khỏi khổ nạn\"","\"Mỗi đảng viên và cán bộ phải thực sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư\"","\"Con người nên sống gắn bó với thiên nhiên, hòa đồng với thiên nhiên, phải biết bảo vệ môi trường\"","\"Đảng phải vui vẻ làm trâu ngựa, làm tôi tớ trung thành của nhân dân\""],"e":"Đề thi HK222. Trích thư gửi Hội Phật tử (1947): \"Thế là chúng ta làm theo lòng đại từ đại bi của Đức Phật Thích Ca\"."},{"c":2,"q":"Tinh thần sống gắn bó với thiên nhiên, hòa đồng với thiên nhiên và biết bảo vệ môi trường sống được Hồ Chí Minh tiếp thu từ","o":["Lão Tử (Lão giáo)","Khổng Tử","Trang Tử","Mặc Tử"],"e":"Hồ Chí Minh phát động \"Tết trồng cây\"."},{"c":2,"q":"Đâu là minh chứng cho việc Hồ Chí Minh chịu ảnh hưởng bởi tư tưởng của Lão Tử?","o":["Người khuyên cán bộ ít lòng tham muốn vật chất, thực hiện cần, kiệm, liêm, chính","Người đề cao quyền bình đẳng của con người và tôn trọng chân lý","Người có lý tưởng cao cả, hoài bão lớn cứu nước, cứu dân","Người chú trọng tu dưỡng, rèn luyện đạo đức cá nhân như người quân tử"],"e":"Đề thi HK232. Lão giáo: thoát khỏi ràng buộc vòng danh lợi. Đề cao bình đẳng là của Phật giáo; tu dưỡng đạo đức là Nho giáo."},{"c":2,"q":"Hồ Chí Minh đã phát triển sáng tạo các quan điểm dân tộc, dân quyền, dân sinh của chủ nghĩa Tam dân (Tôn Trung Sơn) thành","o":["tư tưởng đấu tranh cho Độc lập - Tự do - Hạnh phúc theo con đường cách mạng vô sản","tư tưởng xây dựng Nhà nước pháp quyền theo mô hình tam quyền phân lập","tư tưởng đại đoàn kết toàn dân tộc trên nền tảng liên minh công nông","tư tưởng về chế độ dân chủ tư sản kiểu phương Tây cho Việt Nam"],"e":""},{"c":2,"q":"Hồ Chí Minh bắt đầu quan tâm tới khẩu hiệu \"Tự do - Bình đẳng - Bác ái\" của Đại Cách mạng Pháp 1789 từ khi nào?","o":["Khi học ở Trường tiểu học Pháp - bản xứ ở thành phố Vinh (1905)","Khi học ở Trường Quốc học Huế (1907)","Khi dạy học ở Trường Dục Thanh, Phan Thiết (1910)","Khi sang Pháp năm 1911"],"e":""},{"c":2,"q":"Hồ Chí Minh kế thừa, phát triển những quan điểm nhân quyền, dân quyền trong những văn kiện nào của phương Tây?","o":["Tuyên ngôn Độc lập 1776 của Mỹ và Tuyên ngôn Nhân quyền và Dân quyền 1791 của Pháp","Tuyên ngôn của Đảng Cộng sản năm 1848 và Hiến pháp Mỹ năm 1787","Đại Hiến chương Anh năm 1215 và Tuyên ngôn Độc lập Mỹ năm 1776","Bộ luật dân sự Napôlêông năm 1804 và Tuyên ngôn Nhân quyền năm 1948"],"e":""},{"c":2,"q":"Hồ Chí Minh trực tiếp nghiên cứu tư tưởng nhân văn, dân chủ và nhà nước pháp quyền của các nhà khai sáng phương Tây nào?","o":["Vônte, Rútxô, Môngtétxkiơ","Hêghen, Phoiơbắc, Cantơ","Mác, Ăngghen, Lênin","Shakespeare, Hugo, Zola"],"e":""},{"c":2,"q":"Ai được Hồ Chí Minh xem như \"người đỡ đầu văn học\" của mình?","o":["Léon Tolstoi","Lỗ Tấn","William Shakespeare","Victor Hugo"],"e":"Đề thi HK232. Hồ Chí Minh thích đọc Shakespeare (tiếng Anh), Lỗ Tấn (tiếng Trung), Hugo, Zola (tiếng Pháp)."},{"c":2,"q":"Cơ sở lý luận quyết định bước phát triển mới về chất trong tư tưởng Hồ Chí Minh, khiến Người vượt hẳn lên phía trước so với những người yêu nước cùng thời là","o":["Cách mạng Tháng Mười Nga, thời đại mới và chủ nghĩa Mác - Lênin","Chủ nghĩa yêu nước và truyền thống văn hóa Việt Nam","Tư tưởng dân chủ, tiến bộ của các nhà khai sáng phương Tây","Chủ nghĩa Tam dân của Tôn Trung Sơn và cách mạng Tân Hợi"],"e":""},{"c":2,"q":"Tiền đề lý luận quan trọng nhất, có vai trò quyết định trong việc hình thành TTHCM là","o":["chủ nghĩa Mác - Lênin","chủ nghĩa yêu nước Việt Nam","tinh hoa văn hóa phương Đông","tinh hoa văn hóa phương Tây"],"e":""},{"c":2,"q":"Hồ Chí Minh đánh giá chủ nghĩa Lênin là chủ nghĩa","o":["chân chính nhất, chắc chắn nhất, cách mạng nhất","chân chính nhất, tiến bộ nhất, cách mạng nhất","cách mạng nhất, chắc chắn nhất, khoa học nhất","cách mạng nhất, tiến bộ nhất, chắc chắn nhất"],"e":"Đề thi HK231. \"Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mệnh nhất là chủ nghĩa Lênin\" (Đường cách mệnh)."},{"c":2,"q":"Theo Hồ Chí Minh, chúng ta giành được thắng lợi trước hết là nhờ cái vũ khí không gì thay thế được, đó là","o":["chủ nghĩa Mác - Lênin","khối đại đoàn kết toàn dân tộc","chủ nghĩa yêu nước Việt Nam","sự giúp đỡ của các nước xã hội chủ nghĩa"],"e":""},{"c":2,"q":"Hồ Chí Minh trở thành người cộng sản dựa trên cơ sở nào?","o":["Hiểu biết sâu sắc kho tàng tri thức của nhân loại từ cổ chí kim, từ Đông sang Tây","Hiểu biết sâu sắc, bổ sung, phát triển các giá trị truyền thống tốt đẹp Việt Nam","Hiểu biết sâu sắc, nắm vững nguyên lý cách mạng của chủ nghĩa Mác - Lênin","Hiểu biết sâu sắc, vận dụng sáng tạo nhiều lý thuyết cách mạng của thế giới"],"e":"Lênin: \"Người ta chỉ có thể trở thành người cộng sản khi biết làm giàu trí óc của mình bằng sự hiểu biết tất cả những kho tàng tri thức mà nhân loại đã tạo ra\"."},{"c":2,"q":"Theo Lênin (được Hồ Chí Minh thực hiện), muốn làm người cộng sản thì phải có điều gì?","o":["Hiểu biết sâu sắc kho tàng tri thức của nhân loại","Lòng yêu nước nhiệt thành và khát vọng cứu nước","Tinh thần lạc quan, sáng tạo, vì nghĩa thương người","Tinh thần đấu tranh anh dũng, bất khuất vì dân tộc"],"e":"Đề thi HK222."},{"c":2,"q":"Phẩm chất nào của Hồ Chí Minh được giáo trình nhấn mạnh là \"đặc biệt\"?","o":["Bản lĩnh tư duy độc lập, tự chủ, sáng tạo, giàu tính phê phán, đổi mới và cách mạng","Lý tưởng cao cả và hoài bão lớn cứu dân, cứu nước thoát khỏi cảnh lầm than","Ý chí, nghị lực to lớn, dám một mình ra đi với hai bàn tay trắng","Suốt đời tận trung với nước, tận hiếu với dân, đấu tranh vì cách mạng"],"e":""},{"c":2,"q":"Theo giáo trình, nhân tố quyết định những thành công sáng tạo của Hồ Chí Minh trong hoạt động lý luận và thực tiễn là","o":["những phẩm chất cá nhân của Người","sự giúp đỡ của Quốc tế Cộng sản","truyền thống gia đình và quê hương","vốn ngoại ngữ phong phú"],"e":"Quiz thầy PDA."},{"c":2,"q":"Việc Hồ Chí Minh một mình ra nước ngoài với hai bàn tay trắng, làm nhiều nghề, học nhiều ngoại ngữ phản ánh phẩm chất gì ở Người?","o":["Ý chí, nghị lực to lớn","Lý tưởng cao cả","Tư duy độc lập","Sự linh hoạt"],"e":"Quiz thầy PDA."},{"c":2,"q":"Phương pháp học tập của Hồ Chí Minh là","o":["kết hợp học ở nhà trường, học trong sách vở, học trong thực tế hoạt động cách mạng, học ở nhân dân","học ở tài liệu, sách báo, radio và học ở nhân dân","học từ những bài học thực tiễn, thực tế hoạt động cách mạng và học ở nhân dân","học từ quá trình sống, làm việc, nghiên cứu lý luận ở nhiều nơi trên thế giới"],"e":"Quiz thầy PDA."},{"c":2,"q":"Hồ Chí Minh có tầm nhìn chiến lược, bao quát thời đại, đã đưa cách mạng Việt Nam vào đâu?","o":["Dòng chảy chung của cách mạng thế giới","Hệ thống các nước xã hội chủ nghĩa","Phong trào cộng sản quốc tế","Quỹ đạo của Quốc tế Cộng sản"],"e":""},{"c":2,"q":"Trước khi trở thành Chủ tịch nước, Hồ Chí Minh đã sống, học tập, hoạt động ở khoảng bao nhiêu nước trên thế giới?","o":["Gần 30 nước","Gần 20 nước","Gần 40 nước","Gần 50 nước"],"e":"Quiz thầy PDA."},{"c":2,"q":"Một trong những phương pháp giúp Hồ Chí Minh hiểu sâu sắc chủ nghĩa đế quốc, chủ nghĩa thực dân là","o":["tìm hiểu qua tài liệu, sách, báo, radio","nỗ lực tổ chức đấu tranh ở các xứ thuộc địa","học tập tại Trường Quốc tế Lênin ở Liên Xô","tham gia sáng lập Đảng Cộng sản Pháp"],"e":"Đề thi HK232."},{"c":2,"q":"Việc Hồ Chí Minh xác định rõ bản chất, thủ đoạn của chủ nghĩa đế quốc, thực dân đã thể hiện điều gì ở Người?","o":["Vốn sống và thực tiễn cách mạng phong phú, phi thường","Bản lĩnh tư duy độc lập, tự chủ, sáng tạo, giàu tính phê phán","Lý tưởng cao cả, hoài bão lớn cứu nước và ý chí nghị lực to lớn","Năng lực tổng kết thực tiễn và dự báo tương lai chính xác"],"e":"Đề thi HK222. Thuộc mục \"Tài năng hoạt động, tổng kết thực tiễn phát triển lý luận\"."},{"c":2,"q":"Điều gì chứng tỏ Hồ Chí Minh là một nhà tổ chức vĩ đại của cách mạng Việt Nam?","o":["Người chuẩn bị về nhiều mặt cho sự ra đời của Đảng Cộng sản Việt Nam","Người đã đưa Việt Nam vào dòng chảy chung của cách mạng thế giới","Người đã sống, học tập, hoạt động cách mạng ở gần 30 nước trên thế giới","Người có tầm nhìn chiến lược, bao quát thời đại, dự báo tương lai chính xác"],"e":"Đề thi HK232. Người còn sáng lập Mặt trận dân tộc thống nhất, Quân đội nhân dân, khai sinh Nhà nước kiểu mới."},{"c":2,"q":"Ngày sinh của Chủ tịch Hồ Chí Minh là","o":["19-5-1890","19-5-1889","3-2-1890","2-9-1890"],"e":"Quiz thầy PDA."},{"c":2,"q":"Chủ tịch Hồ Chí Minh từ trần vào ngày nào?","o":["2-9-1969","3-9-1969","2-9-196
