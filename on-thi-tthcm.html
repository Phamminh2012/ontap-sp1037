Hồ Chí Minh tìm thấy con đường cứu nước theo cách mạng vô sản"],"e":""},{"c":2,"q":"Tháng 7-1920, Hồ Chí Minh đọc văn kiện nào của Lênin và tìm thấy con đường cứu nước?","o":["Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa","Nhà nước và cách mạng","Làm gì?","Chủ nghĩa đế quốc, giai đoạn tột cùng của chủ nghĩa tư bản"],"e":""},{"c":2,"q":"Tại Đại hội Tua (12-1920), Hồ Chí Minh bỏ phiếu tán thành Quốc tế Cộng sản, tham gia sáng lập Đảng Cộng sản Pháp. Sự kiện này đánh dấu","o":["bước ngoặt: chủ nghĩa yêu nước kết hợp với lập trường cách mạng vô sản","lần đầu tiên Hồ Chí Minh tiếp xúc với chủ nghĩa Mác - Lênin","sự ra đời của tổ chức cộng sản đầu tiên ở Việt Nam","Hồ Chí Minh hoàn thành việc chuẩn bị thành lập Đảng"],"e":""},{"c":2,"q":"Chọn câu đúng về các giai đoạn hình thành TTHCM","o":["Từ 1911 - 1920: tìm thấy con đường cứu nước giải phóng dân tộc","Từ 1890 - 1911: TTHCM được hình thành về cơ bản","Từ 1921 - 1930: vượt qua thử thách, kiên trì giữ vững lập trường cách mạng","Từ 1930 - 1945: TTHCM tiếp tục phát triển, hoàn thiện"],"e":"Câu hỏi BKEL. 1920-1930: hình thành nội dung cơ bản; 1930-1941: vượt qua thử thách; 1941-1969: tiếp tục phát triển."},{"c":2,"q":"Thời kỳ từ cuối năm 1920 đến đầu năm 1930 là thời kỳ","o":["hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam","dần dần hình thành tư tưởng cứu nước theo con đường cách mạng vô sản","vượt qua thử thách, giữ vững đường lối, phương pháp cách mạng","tư tưởng Hồ Chí Minh tiếp tục phát triển, hoàn thiện"],"e":""},{"c":2,"q":"Năm 1921, Hồ Chí Minh tham gia sáng lập tổ chức nào ở Pháp?","o":["Hội liên hiệp thuộc địa","Hội Việt Nam Cách mạng Thanh niên","Hội Liên hiệp các dân tộc bị áp bức","Đảng Cộng sản Pháp"],"e":""},{"c":2,"q":"Năm 1922, Hồ Chí Minh sáng lập tờ báo nào bằng tiếng Pháp, làm chủ bút, tổng biên tập và tổ chức phát hành?","o":["Le Paria (Người cùng khổ)","L'Humanité (Nhân đạo)","Thanh niên","Việt Nam độc lập"],"e":""},{"c":2,"q":"Tác phẩm Bản án chế độ thực dân Pháp được xuất bản ở đâu, năm nào?","o":["Pari, năm 1925 (bằng tiếng Pháp)","Quảng Châu, năm 1927","Mátxcơva, năm 1924","Pari, năm 1922"],"e":""},{"c":2,"q":"Tổ chức tiền thân của Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập tháng 6-1925 là","o":["Hội Việt Nam Cách mạng Thanh niên","Hội liên hiệp thuộc địa","Tân Việt Cách mạng đảng","Đông Dương Cộng sản đảng"],"e":""},{"c":2,"q":"Tác phẩm nào của Hồ Chí Minh là sự chuẩn bị mọi mặt về chính trị, tư tưởng, tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam?","o":["Đường cách mệnh (1927)","Bản án chế độ thực dân Pháp (1925)","Chánh cương vắn tắt (1930)","Con đường giải phóng (1941)"],"e":""},{"c":2,"q":"Cương lĩnh chính trị đầu tiên của Đảng (đầu năm 1930) xác định con đường cách mạng Việt Nam là","o":["làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản","làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội chủ nghĩa","làm cách mạng dân tộc dân chủ nhân dân, tiến dần lên chủ nghĩa xã hội","làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội tư bản"],"e":""},{"c":2,"q":"Cương lĩnh chính trị đầu tiên của Đảng thể hiện sự vận dụng sáng tạo chủ nghĩa Mác - Lênin trong việc giải quyết mối quan hệ nào?","o":["Giai cấp - dân tộc - quốc tế","Dân tộc - dân chủ - xã hội chủ nghĩa","Đảng - Nhà nước - nhân dân","Công nhân - nông dân - trí thức"],"e":""},{"c":2,"q":"Ý nghĩa của việc Hồ Chí Minh thành lập Đảng Cộng sản Việt Nam với Cương lĩnh đúng đắn đầu năm 1930 là","o":["chấm dứt cuộc khủng hoảng về đường lối và tổ chức lãnh đạo cách mạng Việt Nam","đánh dấu Việt Nam chính thức giành được độc lập dân tộc","đánh dấu Hồ Chí Minh từ người yêu nước trở thành người cộng sản","mở ra thời kỳ quá độ lên chủ nghĩa xã hội trên cả nước"],"e":""},{"c":2,"q":"Trong thời kỳ 1930-1941, Hồ Chí Minh bị một số người trong Quốc tế Cộng sản và trong Đảng phê phán là \"hữu khuynh\", \"dân tộc chủ nghĩa\" do họ chịu ảnh hưởng của","o":["quan điểm giáo điều tả khuynh của Đại hội VI Quốc tế Cộng sản (1928)","quan điểm hữu khuynh, cơ hội của Quốc tế II (Quốc tế xã hội chủ nghĩa)","quan điểm của Đại hội II Quốc tế Cộng sản (1920) về vấn đề thuộc địa","quan điểm dân tộc chủ nghĩa của chủ nghĩa Tam dân Tôn Trung Sơn"],"e":""},{"c":2,"q":"Hội nghị Trung ương Đảng tháng 10-1930 đã phê phán Hội nghị hợp nhất do Nguyễn Ái Quốc chủ trì là","o":["\"chỉ lo đến việc phản đế mà quên mất lợi ích giai cấp tranh đấu\"","chỉ lo đấu tranh giai cấp mà quên nhiệm vụ dân tộc","đánh giá quá cao vai trò của giai cấp nông dân","không thành lập Mặt trận dân tộc thống nhất"],"e":""},{"c":2,"q":"Năm 1934, sau khi thoát khỏi nhà tù thực dân Anh ở Hồng Kông, Hồ Chí Minh làm gì?","o":["Trở lại Liên Xô, vào học Trường Quốc tế Lênin","Trở về nước lãnh đạo cách mạng","Sang Pháp hoạt động trong Đảng Cộng sản Pháp","Sang Thái Lan tổ chức Việt kiều"],"e":""},{"c":2,"q":"Tháng 1-1941, trước khi về nước, Hồ Chí Minh viết sách gì nêu ra phương pháp cách mạng giành chính quyền?","o":["Con đường giải phóng","Đường cách mệnh","Lịch sử nước ta","Thường thức chính trị"],"e":""},{"c":2,"q":"Năm 1941, Hồ Chí Minh viết \"Dân ta phải biết sử ta / Cho tường gốc tích nước nhà Việt Nam\" trong tác phẩm nào?","o":["Lịch sử nước ta","Đường cách mệnh","Kèn gọi lính","Bài ca du kích"],"e":"Quiz BKEL chương 2."},{"c":2,"q":"TTHCM được Đảng Cộng sản Đông Dương khẳng định, trở thành yếu tố chỉ đạo cách mạng Việt Nam từ sự kiện nào?","o":["Hội nghị Trung ương Đảng tháng 5-1941 (Pác Bó)","Hội nghị Trung ương tháng 10-1930","Hội nghị Trung ương tháng 11-1939","Đại hội II của Đảng (2-1951)"],"e":""},{"c":2,"q":"Tại Hội nghị Trung ương tháng 5-1941, Hồ Chí Minh khẳng định: \"Trong lúc này quyền lợi ... cao hơn hết thảy\"","o":["dân tộc giải phóng","giai cấp công nhân","của nông dân","của Tổ quốc"],"e":""},{"c":2,"q":"Hội nghị Trung ương tháng 5-1941 đã có chủ trương nào sau đây?","o":["Tạm gác khẩu hiệu cách mạng điền địa, thành lập Mặt trận Việt Minh","Thủ tiêu chánh cương, sách lược vắn tắt","Đổi tên Đảng thành Đảng Cộng sản Đông Dương","Thành lập Chính phủ Liên bang Cộng hòa dân chủ Đông Dương"],"e":""},{"c":2,"q":"Sự chuyển hướng chiến lược tại các Hội nghị Trung ương tháng 11-1939 và tháng 5-1941 thực chất là","o":["sự trở về với quan điểm của Hồ Chí Minh trong Cương lĩnh chính trị đầu tiên của Đảng","sự tiếp thu đường lối tả khuynh của Đại hội VI Quốc tế Cộng sản","sự thay đổi hoàn toàn mục tiêu và con đường của cách mạng Việt Nam","sự từ bỏ vĩnh viễn nhiệm vụ chống phong kiến, giải quyết ruộng đất"],"e":""},{"c":2,"q":"Ngày 22-12-1944, Hồ Chí Minh sáng lập tổ chức nào?","o":["Việt Nam tuyên truyền giải phóng quân","Mặt trận Việt Minh","Hội Việt Nam Cách mạng Thanh niên","Mặt trận Liên Việt"],"e":""},{"c":2,"q":"Cách mạng Tháng Tám năm 1945 thành công có ý nghĩa","o":["là thắng lợi to lớn đầu tiên của chủ nghĩa Mác - Lênin và TTHCM ở Việt Nam","chấm dứt cuộc khủng hoảng về đường lối cứu nước đầu thế kỷ XX","mở ra thời kỳ sụp đổ của hệ thống thuộc địa kiểu cũ trên thế giới","đánh dấu miền Bắc bước vào thời kỳ quá độ lên chủ nghĩa xã hội"],"e":"CMT8 lật đổ chế độ phong kiến hơn ngàn năm, ách thống trị của Pháp hơn 80 năm, giành độc lập trực tiếp từ tay phát xít Nhật."},{"c":2,"q":"Nước Việt Nam Dân chủ Cộng hoà ra đời (2-9-1945) đã mở ra kỷ nguyên nào?","o":["Kỷ nguyên độc lập dân tộc gắn liền với chủ nghĩa xã hội","Kỷ nguyên đổi mới và hội nhập","Kỷ nguyên cách mạng dân tộc dân chủ nhân dân","Kỷ nguyên quá độ lên chủ nghĩa tư bản"],"e":""},{"c":2,"q":"Giai đoạn 2-9-1945 đến 19-12-1946, Hồ Chí Minh chỉ đạo sách lược hòa hoãn với Tưởng, rồi với Pháp theo phương châm nào?","o":["Dĩ bất biến, ứng vạn biến","Vừa đánh vừa đàm","Lấy nhỏ thắng lớn","Tự lực cánh sinh"],"e":""},{"c":2,"q":"Đường lối kháng chiến chống thực dân Pháp (1946-1954) do Đảng và Hồ Chí Minh đề ra là","o":["kháng chiến lâu dài, toàn dân, toàn diện, tự lực cánh sinh","đánh nhanh, thắng nhanh, dựa vào quân chủ lực là chủ yếu","dựa vào viện trợ quốc tế, nhất là Liên Xô, Trung Quốc là chính","vừa kháng chiến vừa hòa hoãn lâu dài với thực dân Pháp"],"e":""},{"c":2,"q":"Thắng lợi của cuộc kháng chiến chống Pháp năm 1954 có ý nghĩa quốc tế gì?","o":["Mở ra thời kỳ sụp đổ của hệ thống thuộc địa kiểu cũ trên phạm vi toàn thế giới","Mở ra thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội","Làm sụp đổ hoàn toàn chủ nghĩa đế quốc trên phạm vi thế giới","Đánh dấu sự ra đời của hệ thống xã hội chủ nghĩa thế giới"],"e":""},{"c":2,"q":"Từ năm 1954 đến năm 1969, Hồ Chí Minh lãnh đạo thực hiện đồng thời hai nhiệm vụ chiến lược nào?","o":["Xây dựng CNXH ở miền Bắc; tiếp tục cách mạng dân tộc dân chủ nhân dân ở miền Nam","Kháng chiến chống thực dân Pháp và xây dựng chế độ dân chủ nhân dân","Chống giặc đói, giặc dốt và giặc ngoại xâm trên cả nước","Cải cách ruộng đất ở miền Bắc và hợp tác hóa nông nghiệp ở miền Nam"],"e":""},{"c":2,"q":"Chân lý \"Không có gì quý hơn độc lập, tự do\" được Hồ Chí Minh nêu lên trong bối cảnh nào?","o":["Đế quốc Mỹ ồ ạt đưa quân viễn chinh vào miền Nam và gây chiến tranh phá hoại miền Bắc (Lời kêu gọi 17-7-1966)","Thực dân Pháp quay lại xâm lược, cách mạng rơi vào tình thế \"ngàn cân treo sợi tóc\"","Thực dân Pháp hoàn thành căn bản việc bình định Việt Nam","Phần lớn các nước châu Á, châu Phi, Mỹ Latinh trở thành thuộc địa"],"e":"Đề thi HK222."},{"c":2,"q":"Theo giáo trình, cống hiến lý luận lớn đầu tiên của Hồ Chí Minh là về","o":["cách mạng giải phóng dân tộc","xây dựng chủ nghĩa xã hội","xây dựng Đảng cầm quyền","văn hóa, đạo đức"],"e":""},{"c":2,"q":"Giá trị của TTHCM đối với cách mạng Việt Nam được giáo trình nêu: \"Lần đầu tiên trong lịch sử tư tưởng Việt Nam, tư tưởng định hướng, soi đường, chỉ đạo sự phát triển của cách mạng Việt Nam là của ...\"","o":["chính người Việt Nam","giai cấp công nhân quốc tế","Quốc tế Cộng sản","các nhà kinh điển Mác - Lênin"],"e":""},{"c":2,"q":"Hồ Chí Minh là người Việt Nam đầu tiên khẳng định điều gì về quan hệ quốc tế?","o":["Hợp tác quốc tế là xu thế tất yếu của thời đại","Việt Nam phải đi theo con đường cách mạng vô sản","Cách mạng Việt Nam là một bộ phận của cách mạng thế giới","Phải đoàn kết với giai cấp vô sản chính quốc"],"e":""},{"c":2,"q":"Quan điểm đối ngoại nổi tiếng của Hồ Chí Minh là","o":["\"Làm bạn với tất cả mọi nước dân chủ và không gây thù oán với một ai\"","\"Thêm bạn, bớt thù, Việt Nam muốn là bạn với mọi quốc gia\"","\"Việt Nam sẵn sàng là bạn, là đối tác tin cậy của các nước\"","\"Dĩ bất biến, ứng vạn biến trong mọi quan hệ quốc tế\""],"e":""},{"c":3,"q":"Bản Yêu sách của nhân dân An Nam gửi Hội nghị Vécxây (1919) gồm hai nội dung chính là","o":["đòi quyền bình đẳng về mặt pháp lý và đòi các quyền tự do, dân chủ","đòi độc lập hoàn toàn và quyền tự quyết dân tộc","đòi quyền tự do, dân chủ và quyền có quân đội riêng","đòi quyền bình đẳng về kinh tế và quyền tự do đi lại"],"e":"Đề thi HK232. Bản yêu sách không được Hội nghị chấp nhận."},{"c":3,"q":"Một trong những nội dung chính trong bản Yêu sách của nhân dân An Nam là đòi quyền","o":["bình đẳng về mặt pháp lý cho người dân Đông Dương","độc lập về mặt pháp lý cho người dân Đông Dương","độc lập, dân tộc dân chủ cho người dân Đông Dương","tự do, công bằng cho người dân Đông Dương"],"e":"Đề thi HK232."},{"c":3,"q":"Bản Yêu sách của nhân dân An Nam cho thấy lần đầu tiên Hồ Chí Minh hình thành tư tưởng về","o":["quyền tự do, bình đẳng của các dân tộc thuộc địa","quyền độc lập, tự do của các dân tộc thuộc địa","quyền sống bình đẳng của các dân tộc thuộc địa","quyền độc lập, toàn vẹn của các dân tộc thuộc địa"],"e":"Đề thi HK222. GT: \"lần đầu tiên, tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa mà trước hết là quyền bình đẳng và tự do đã hình thành\"."},{"c":3,"q":"Tư tưởng Hồ Chí Minh về quyền của các dân tộc thuộc địa, mà trước hết là quyền bình đẳng và tự do, được thể hiện đầu tiên trong văn kiện nào?","o":["Yêu sách của nhân dân An Nam","Tuyên ngôn độc lập","Đường cách mệnh","Bản án chế độ thực dân Pháp"],"e":"Đề thi HK231."},{"c":3,"q":"Tại Hội nghị Vécxây năm 1919, ai đã kêu gọi trao quyền tự quyết cho các dân tộc trên thế giới?","o":["Tổng thống Mỹ V. Wilson","Lênin","Thủ tướng Anh Lloyd George","Thủ tướng Pháp Clemenceau"],"e":""},{"c":3,"q":"Hồ Chí Minh khẳng định quan điểm \"Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng; dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do\" là","o":["những lẽ phải không ai chối cãi được","những sự thật không ai chối cãi được","những giá trị cần có của mỗi dân tộc","những quyền cơ bản của mỗi dân tộc"],"e":"Đề thi HK232."},{"c":3,"q":"Câu \"Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do\" được Hồ Chí Minh nêu trong văn kiện nào?","o":["Tuyên ngôn Độc lập (1945)","Yêu sách của nhân dân An Nam (1919)","Chánh cương vắn tắt (1930)","Lời kêu gọi toàn quốc kháng chiến (1946)"],"e":"Được phát triển từ Tuyên ngôn Độc lập 1776 của Mỹ và Tuyên ngôn Nhân quyền và Dân quyền 1791 của Pháp."},{"c":3,"q":"Trong Chánh cương vắn tắt (1930), Hồ Chí Minh xác định mục tiêu chính trị của Đảng là","o":["đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến; làm cho nước Nam được hoàn toàn độc lập","đánh đổ địa chủ phong kiến, thực hiện khẩu hiệu người cày có ruộng","xây dựng chủ nghĩa xã hội và chủ nghĩa cộng sản ở Việt Nam","thành lập Chính phủ Liên bang Cộng hòa dân chủ Đông Dương"],"e":""},{"c":3,"q":"Trong Thư gửi Liên hợp quốc năm 1946, Hồ Chí Minh khẳng định nhân dân Việt Nam kiên quyết chiến đấu đến cùng để bảo vệ những quyền thiêng liêng nhất, đó là","o":["toàn vẹn lãnh thổ cho Tổ quốc và độc lập cho đất nước","tự do, hạnh phúc và ấm no cho nhân dân Việt Nam","hòa bình, hữu nghị và hợp tác với các dân tộc","dân chủ, bình đẳng và công lý cho mọi công dân"],"e":""},{"c":3,"q":"Câu \"Không! Chúng ta thà hy sinh tất cả, chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ\" nằm trong văn kiện nào?","o":["Lời kêu gọi toàn quốc kháng chiến (19-12-1946)","Tuyên ngôn Độc lập (2-9-1945)","Lời kêu gọi đồng bào và chiến sĩ cả nước (17-7-1966)","Thư gửi đồng bào Nam Bộ (1946)"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, độc lập, tự do là","o":["quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc","quyền dành cho tất cả các dân tộc bị áp bức ở Á Đông","quyền bất khả xâm phạm của tất cả các cộng đồng trên thế giới","quyền thiêng liêng nhất của các dân tộc ở Đông Dương"],"e":"Đề thi HK203."},{"c":3,"q":"Năm 1965, trong hoàn cảnh đế quốc Mỹ tiến hành chiến lược \"Chiến tranh cục bộ\" ở miền Nam và chiến tranh phá hoại miền Bắc, Hồ Chí Minh nêu lên chân lý thời đại nào?","o":["Không có gì quý hơn độc lập, tự do","Nước Việt Nam là một, dân tộc Việt Nam là một","Dĩ bất biến, ứng vạn biến","Đoàn kết, đoàn kết, đại đoàn kết"],"e":""},{"c":3,"q":"Hồ Chí Minh đánh giá cao học thuyết \"Tam dân\" của Tôn Trung Sơn với nội dung","o":["dân tộc độc lập, dân quyền tự do, dân sinh hạnh phúc","dân tộc tự quyết, dân quyền bình đẳng, dân sinh ấm no","dân tộc độc lập, dân chủ tự do, dân sinh bác ái","dân tộc thống nhất, dân quyền tự do, dân sinh phát triển"],"e":""},{"c":3,"q":"Câu \"Người ta sinh ra tự do và bình đẳng về quyền lợi, và phải luôn được tự do và bình đẳng về quyền lợi\" mà Hồ Chí Minh viện dẫn là của văn kiện nào?","o":["Tuyên ngôn Nhân quyền và Dân quyền của Pháp","Tuyên ngôn Độc lập năm 1776 của Mỹ","Tuyên ngôn của Đảng Cộng sản năm 1848","Hiến chương Liên hợp quốc năm 1945"],"e":""},{"c":3,"q":"Chủ trương \"Bỏ sưu thuế cho dân cày nghèo\" được Hồ Chí Minh xác định rõ trong văn kiện nào?","o":["Chánh cương vắn tắt của Đảng","Sách lược vắn tắt của Đảng","Chương trình tóm tắt của Đảng","Điều lệ vắn tắt của Đảng"],"e":"Đề thi HK232."},{"c":3,"q":"Mục tiêu \"Thâu hết ruộng đất của đế quốc chủ nghĩa làm của công chia cho dân cày nghèo\" được Hồ Chí Minh thể hiện trong văn kiện nào?","o":["Chánh cương vắn tắt của Đảng","Sách lược vắn tắt của Đảng","Chương trình tóm tắt của Đảng","Điều lệ vắn tắt của Đảng"],"e":"Đề thi HK222."},{"c":3,"q":"Theo Hồ Chí Minh, một trong những nhiệm vụ của cách mạng giải phóng dân tộc (nêu trong Chánh cương vắn tắt) là","o":["thâu hết ruộng đất của đế quốc chủ nghĩa làm của công, chia cho dân cày nghèo","thâu hết ruộng đất của đế quốc chủ nghĩa, làm cho người cày có ruộng","thâu hết ruộng đất của địa chủ và đế quốc chủ nghĩa, làm cho người cày có ruộng","thâu hết ruộng đất của địa chủ và tay sai phản động, chia cho dân cày nghèo"],"e":"Đề thi HK231."},{"c":3,"q":"Hồ Chí Minh nói: \"Nước độc lập mà dân không hưởng hạnh phúc tự do, thì ... cũng chẳng có nghĩa lý gì\"","o":["độc lập","tự do","hạnh phúc","chính quyền"],"e":""},{"c":3,"q":"Ngay sau thắng lợi của Cách mạng Tháng Tám 1945, Hồ Chí Minh yêu cầu phải làm cho dân có","o":["ăn, mặc, chỗ ở, học hành","mặc, ở, ăn, học hành","độc lập, tự do, hạnh phúc","tự do, độc lập, hạnh phúc"],"e":"Đề thi HK232. \"Làm cho dân có ăn. Làm cho dân có mặc. Làm cho dân có chỗ ở. Làm cho dân có học hành\"."},{"c":3,"q":"Câu \"Tôi chỉ có một sự ham muốn, ham muốn tột bậc, là làm sao cho nước ta được hoàn toàn độc lập, dân ta được hoàn toàn tự do, đồng bào ai cũng có cơm ăn áo mặc, ai cũng được học hành\" thể hiện quan điểm nào của Hồ Chí Minh?","o":["Độc lập dân tộc phải gắn liền với tự do, cơm no, áo ấm và hạnh phúc của nhân dân","Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để","Độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ","Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của các dân tộc"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, để che đậy bản chất \"ăn cướp\" và \"giết người\", bọn thực dân đế quốc thường","o":["dùng chiêu bài mị dân, lập chính phủ bù nhìn, tuyên truyền \"độc lập tự do\" giả hiệu","dùng bạo lực, quân đội và nhà tù để đàn áp các phong trào yêu nước","thực hiện chính sách ngu dân, đồng hóa dân tộc, xóa bỏ văn hóa bản xứ","sử dụng báo chí, truyền thông để tuyên truyền về \"khai hóa văn minh\""],"e":"Đề thi HK232."},{"c":3,"q":"Theo Hồ Chí Minh, một quốc gia có quyền tự quyết về ngoại giao là một trong những biểu hiện của","o":["độc lập dân tộc thật sự","năng lực đối ngoại của Nhà nước","mục tiêu chính trị của Đảng","giá trị của dân tộc tự do"],"e":"Đề thi HK231. Độc lập mà không có quyền tự quyết về ngoại giao, quân đội riêng, tài chính riêng thì chẳng có ý nghĩa gì."},{"c":3,"q":"Hiệp định Sơ bộ ngày 6-3-1946: \"Chính phủ Pháp công nhận nước Việt Nam Dân chủ Cộng hòa là một quốc gia tự do có Chính phủ của mình, Nghị viện của mình, quân đội của mình, tài chính của mình\" thể hiện quan điểm nào của Hồ Chí Minh?","o":["Độc lập dân tộc phải là nền độc lập thật sự, hoàn toàn và triệt để","Độc lập dân tộc gắn liền với thống nhất, toàn vẹn lãnh thổ","Độc lập dân tộc gắn liền với cơm no, áo ấm","Độc lập dân tộc gắn liền với chủ nghĩa xã hội"],"e":""},{"c":3,"q":"Quan điểm nào được Hồ Chí Minh khẳng định là một \"chân lý\" không bao giờ thay đổi?","o":["\"Đồng bào Nam Bộ là dân nước Việt Nam\"","\"Dân tộc cách mệnh thì chưa phân giai cấp\"","\"Đảng có vững cách mệnh mới thành công\"","\"Đế quốc Mỹ nhất định phải cút khỏi nước ta\""],"e":"Đề thi HK232. Thư gửi đồng bào Nam Bộ (1946): \"Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi\"."},{"c":3,"q":"Tư tưởng về độc lập dân tộc gắn liền với thống nhất và toàn vẹn lãnh thổ được Hồ Chí Minh thể hiện qua những văn kiện nào?","o":["Thư gửi đồng bào Nam Bộ (1946) và Di chúc","Tuyên ngôn độc lập và Di chúc","Lời kêu gọi toàn quốc kháng chiến","Cương lĩnh chính trị đầu tiên của Đảng"],"e":"Đề thi HK222."},{"c":3,"q":"Tháng 2-1958, khi đất nước tạm thời bị chia cắt, Hồ Chí Minh khẳng định","o":["\"Nước Việt Nam là một, dân tộc Việt Nam là một\"","\"Không có gì quý hơn độc lập, tự do\"","\"Đồng bào Nam Bộ là dân nước Việt Nam\"","\"Tổ quốc ta nhất định sẽ thống nhất\""],"e":""},{"c":3,"q":"Câu \"Đế quốc Mỹ nhất định phải cút khỏi nước ta. Tổ quốc ta nhất định sẽ thống nhất. Đồng bào Nam Bắc nhất định sẽ sum họp một nhà\" nằm trong văn kiện nào?","o":["Di chúc","Lời kêu gọi 17-7-1966","Thư chúc Tết Xuân 1969","Thư gửi đồng bào Nam Bộ"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường nào?","o":["Con đường cách mạng vô sản","Con đường cách mạng tư sản Pháp, Mỹ","Con đường của các bậc tiền bối Việt Nam","Con đường chủ nghĩa Tam dân của Tôn Trung Sơn"],"e":"Câu hỏi BKEL, đề HK203. \"Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường cách mạng vô sản\"."},{"c":3,"q":"Lý do Hồ Chí Minh không lựa chọn con đường cách mạng tư sản là","o":["cách mạng tư sản là \"cách mệnh không đến nơi\", vẫn áp bức công nông và thuộc địa","tư sản Việt Nam nhỏ bé về số lượng, non kém về chất lượng, không đủ sức lãnh đạo","Việt Nam có quá ít nhà tư sản để có thể tiến hành một cuộc cách mạng tư sản","cách mạng tư sản ít người biết đến và không được Quốc tế Cộng sản ủng hộ"],"e":"Đề thi HK203."},{"c":3,"q":"\"Cách mệnh đã 4 lần rồi, mà nay công nông ... hằng còn phải mưu cách mệnh lần nữa mới hòng thoát khỏi vòng áp bức\" là nhận định của Hồ Chí Minh về cuộc cách mạng nào?","o":["Cách mạng tư sản Pháp","Cách mạng tư sản Anh","Cách mạng tư sản Mỹ","Cách mạng tư sản Đức"],"e":"Đề thi HK231."},{"c":3,"q":"\"Trong thế giới bây giờ chỉ có cách mệnh ... là đã thành công, và thành công đến nơi, nghĩa là dân chúng được hưởng cái hạnh phúc tự do, bình đẳng thật\"","o":["Nga","Pháp","Mỹ","Trung Quốc"],"e":"Đường cách mệnh (1927)."},{"c":3,"q":"Theo Hồ Chí Minh, dân chúng được hưởng cái hạnh phúc tự do, bình đẳng thật sự là kết quả của","o":["cuộc cách mạng thành công đến nơi","ý chí đấu tranh triệt để của giai cấp công nhân","đường lối chính trị của Đảng Cộng sản","các cuộc cách mạng tư sản trên thế giới"],"e":"Đề thi HK231."},{"c":3,"q":"Theo Hồ Chí Minh, những điều giả dối mà thực dân Pháp \"khoe khoang bên An Nam\" là","o":["tự do và bình đẳng","dân chủ và độc lập","ấm no và hạnh phúc","độc lập và tự do"],"e":"Đề thi HK232. \"...không phải tự do và bình đẳng giả dối như đế quốc chủ nghĩa Pháp khoe khoang bên An Nam\"."},{"c":3,"q":"Theo Hồ Chí Minh, các giá trị tự do và bình đẳng mà thực dân Pháp rêu rao ở thuộc địa An Nam mang tính chất","o":["giả hiệu (giả dối)","phổ biến","đại chúng","tư sản"],"e":"Quiz thầy PDA."},{"c":3,"q":"Trong Đường cách mệnh (1927), chủ nghĩa Mác được phiên âm Hán - Việt là","o":["chủ nghĩa Mã Khắc Tư","chủ nghĩa Mã Liệt","chủ nghĩa Mạc Tư","chủ nghĩa Mã Lăng"],"e":""},{"c":3,"q":"Câu \"Hỡi đồng bào bị đọa đày đau khổ! Đây là cái cần thiết cho chúng ta, đây là con đường giải phóng chúng ta\" được Hồ Chí Minh kể lại trong bài viết nào?","o":["Con đường dẫn tôi đến chủ nghĩa Lênin","Đường cách mệnh","Bản án chế độ thực dân Pháp","Cách mạng Tháng Mười và con đường giải phóng các dân tộc"],"e":""},{"c":3,"q":"Theo C.Mác và Ph.Ăngghen, con đường cách mạng vô sản ở châu Âu đi theo tiến trình nào?","o":["Giải phóng giai cấp - giải phóng dân tộc - giải phóng xã hội - giải phóng con người","Giải phóng dân tộc - giải phóng xã hội - giải phóng giai cấp - giải phóng con người","Giải phóng giai cấp - giải phóng xã hội - giải phóng dân tộc - giải phóng con người","Giải phóng giai cấp - giải phóng con người - giải phóng dân tộc - giải phóng xã hội"],"e":"Đề thi HK231."},{"c":3,"q":"Theo Hồ Chí Minh, ở Việt Nam và các nước thuộc địa, tiến trình giải phóng phải là","o":["giải phóng dân tộc - giải phóng xã hội - giải phóng giai cấp - giải phóng con người","giải phóng giai cấp - giải phóng dân tộc - giải phóng xã hội - giải phóng con người","giải phóng dân tộc - giải phóng giai cấp - giải phóng xã hội - giải phóng con người","giải phóng dân tộc - giải phóng giai cấp - giải phóng con người - giải phóng xã hội"],"e":"Do hoàn cảnh lịch sử - chính trị khác châu Âu; giải phóng dân tộc là trước hết, trên hết."},{"c":3,"q":"Theo Hồ Chí Minh, đâu là điều kiện để giải phóng giai cấp ở nước thuộc địa?","o":["Phải giải phóng dân tộc khỏi ách thống trị","Phải có chính đảng của giai cấp","Phải tập hợp sức mạnh của toàn dân","Phải hình thành đường lối cách mạng trong giai cấp"],"e":"Quiz thầy PDA. Giải phóng dân tộc gắn với giải phóng giai cấp, trong đó giải phóng dân tộc là trước hết, trên hết."},{"c":3,"q":"Con đường cách mạng Việt Nam mà Hồ Chí Minh xác định là","o":["độc lập dân tộc gắn liền với chủ nghĩa xã hội","độc lập dân tộc gắn liền với chủ nghĩa tư bản","độc lập dân tộc gắn liền với chủ nghĩa cộng sản","đoàn kết toàn dân đứng dậy khởi nghĩa"],"e":"Quiz thầy PDA."},{"c":3,"q":"Theo Hồ Chí Minh, phương hướng giải quyết một cách triệt để những yêu cầu khách quan, cụ thể của cách mạng Việt Nam đầu thế kỷ XX là","o":["làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản","đánh đổ đế quốc và bọn phong kiến, làm cho nước Việt Nam hoàn toàn độc lập","thâu hết ruộng đất của đế quốc chủ nghĩa làm của công, chia cho dân cày nghèo","giải phóng giai cấp - giải phóng dân tộc - giải phóng xã hội - giải phóng con người"],"e":"Đề thi HK232."},{"c":3,"q":"Hồ Chí Minh khẳng định phương hướng phát triển của dân tộc trong thời đại mới (Chánh cương vắn tắt) là đi tới","o":["xã hội cộng sản","xã hội tư bản chủ nghĩa","xã hội phong kiến","xã hội dân chủ tư sản"],"e":"Quiz thầy PDA."},{"c":3,"q":"Yếu tố nào quy định những yêu cầu và nội dung trước mắt của cuộc đấu tranh giành độc lập?","o":["Phương hướng phát triển của cách mạng","Khát khao độc lập dân tộc của nhân dân","Ước nguyện được giải phóng của con người","Sức mạnh của kẻ thù"],"e":"Quiz thầy PDA."},{"c":3,"q":"Theo Quốc tế Cộng sản, mối quan hệ giữa hai nhiệm vụ chống đế quốc và chống phong kiến ở thuộc địa là","o":["thực hiện đồng thời, khăng khít, nương tựa vào nhau","chống đế quốc trước rồi từng bước chống phong kiến","chống phong kiến trước rồi mới chống đế quốc","chống phong kiến phụ thuộc vào chống đế quốc"],"e":"Quiz thầy PDA. Hồ Chí Minh thì đặt nhiệm vụ chống đế quốc, giải phóng dân tộc lên hàng đầu, chống phong kiến từng bước thực hiện."},{"c":3,"q":"Trong văn kiện Đại hội VI Quốc tế Cộng sản, khái niệm \"cách mạng tư sản dân quyền\" có hạn chế gì?","o":["Không bao hàm đầy đủ nhiệm vụ chống đế quốc, giải phóng dân tộc ở các nước thuộc địa","Không đề cập đến nhiệm vụ chống phong kiến, đem lại ruộng đất cho nông dân","Không thừa nhận vai trò lãnh đạo của giai cấp công nhân ở thuộc địa","Không đề cập đến vai trò của đảng cộng sản trong cách mạng thuộc địa"],"e":""},{"c":3,"q":"Việc chưa nêu ra chủ trương \"người cày có ruộng\" khi sáng lập Đảng (chỉ nêu \"thâu hết ruộng đất của đế quốc chủ nghĩa...\") thể hiện tư tưởng gì ở Hồ Chí Minh?","o":["Đặt nhiệm vụ chống đế quốc, giải phóng dân tộc lên hàng đầu","Nhiệm vụ chống đế quốc và chống phong kiến phải thực hiện đồng thời","Bỏ qua nhiệm vụ chống phong kiến, mang lại ruộng đất cho nông dân","Tập trung nhấn mạnh sứ mệnh lịch sử giải phóng giai cấp công nhân"],"e":"Đề thi HK222. Đây là nét độc đáo, sáng tạo của Hồ Chí Minh."},{"c":3,"q":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc muốn thắng lợi phải có gì?","o":["Có Đảng của giai cấp công nhân lãnh đạo","Có tổ chức đoàn thể lãnh đạo","Có một cá nhân xuất sắc lãnh đạo","Có một giai cấp lãnh đạo"],"e":"Quiz BKEL chương 3."},{"c":3,"q":"Theo Hồ Chí Minh, Đảng Cộng sản có vai trò như thế nào trong cách mạng giải phóng dân tộc?","o":["Là lực lượng lãnh đạo, đảm bảo thắng lợi của cách mạng","Là lực lượng nòng cốt, đảm bảo thắng lợi của cách mạng","Là một trong những lực lượng không thể thiếu đảm bảo thắng lợi","Là lực lượng lãnh đạo, giữ vai trò quan trọng cho thắng lợi của cách mạng"],"e":"Quiz BKEL chương 3."},{"c":3,"q":"Theo Đường cách mệnh (1927): \"Cách mệnh trước hết phải có cái gì? Trước hết phải có ..., để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi\"","o":["đảng cách mệnh","lực lượng vũ trang","mặt trận dân tộc thống nhất","đường lối đúng đắn"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, trong hoàn cảnh nước thuộc địa - phong kiến, Đảng Cộng sản Việt Nam là","o":["đội tiên phong của giai cấp công nhân, đồng thời của nhân dân lao động và dân tộc","chỉ là đội tiên phong của giai cấp công nhân Việt Nam","đảng của liên minh giai cấp công nhân và giai cấp nông dân","đảng của toàn dân tộc, không mang bản chất giai cấp"],"e":""},{"c":3,"q":"Quan điểm \"Đảng Lao động Việt Nam là Đảng của giai cấp công nhân và nhân dân lao động, cho nên nó phải là Đảng của dân tộc Việt Nam\" được Hồ Chí Minh nêu vào năm nào, trong văn kiện nào?","o":["Năm 1951, Báo cáo chính trị tại Đại hội II của Đảng","Năm 1930, Chánh cương vắn tắt","Năm 1960, Diễn văn kỷ niệm 30 năm thành lập Đảng","Năm 1945, Tuyên ngôn Độc lập"],"e":"Quiz thầy PDA. Đây là luận điểm bổ sung, phát triển lý luận mácxít về đảng cộng sản."},{"c":3,"q":"Theo Hồ Chí Minh, \"Kiên quyết nhất, hăng hái nhất, trong sạch nhất, tận tâm tận lực phụng sự Tổ quốc\" là nhận xét về","o":["đảng viên","thanh niên","công nhân","nông dân"],"e":"Đề thi HK222."},{"c":3,"q":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc phải dựa trên lực lượng nào?","o":["Đại đoàn kết toàn dân tộc, lấy liên minh công - nông làm nền tảng","Giai cấp công nhân là chủ yếu, nông dân là lực lượng hỗ trợ","Lực lượng vũ trang nhân dân là chủ yếu và quyết định","Liên minh công - nông - trí thức, không cần các tầng lớp khác"],"e":""},{"c":3,"q":"Câu \"Cách mệnh là việc chung cả dân chúng chứ không phải việc một hai người\" thể hiện quan điểm gì của Hồ Chí Minh?","o":["Cách mạng là sự nghiệp của quần chúng nhân dân","Cách mạng phải do Đảng Cộng sản lãnh đạo","Cách mạng phải đi theo con đường vô sản","Cách mạng phải dùng bạo lực"],"e":""},{"c":3,"q":"Nhận định \"dân tộc cách mệnh thì chưa phân giai cấp, nghĩa là sĩ, nông, công, thương đều nhất trí chống lại cường quyền\" của Hồ Chí Minh muốn nói gì?","o":["Trong cách mạng dân tộc chưa phân chia giai cấp, phải đoàn kết toàn dân","Chưa nên đề cao đấu tranh giai cấp trong cách mạng dân tộc","Chưa đặt nhiệm vụ giải phóng giai cấp trong cách mạng dân tộc","Đã đặt nhiệm vụ giải phóng giai cấp trong cách mạng dân tộc"],"e":"Quiz thầy PDA."},{"c":3,"q":"Theo Sách lược vắn tắt (1930), đối với tiểu tư sản, trí thức, trung nông, Đảng phải","o":["liên lạc để lôi kéo họ về phía vô sản giai cấp","lợi dụng, ít ra cũng làm cho họ trung lập","đánh đổ họ","thu phục đại bộ phận họ"],"e":"Đề thi HK222."},{"c":3,"q":"Theo Sách lược vắn tắt (1930), đối với bộ phận nào chưa rõ mặt phản cách mạng thì Đảng phải lợi dụng, ít ra cũng làm cho họ trung lập?","o":["Phú nông, trung, tiểu địa chủ và tư bản Việt Nam","Tiểu tư sản, trí thức, trung nông","Đại địa chủ và tư sản mại bản","Địa chủ, phú nông, tiểu tư sản"],"e":"Đề thi HK232."},{"c":3,"q":"Theo Hồ Chí Minh, đối với bộ phận chưa rõ mặt phản cách mạng trong xã hội thì Đảng Cộng sản phải làm gì?","o":["Lợi dụng hoặc làm cho họ trung lập","Triệt tiêu tận gốc địa vị xã hội của họ","Lôi kéo họ về phía giai cấp vô sản","Mua chuộc họ về phía giai cấp vô sản"],"e":"Đề thi HK231."},{"c":3,"q":"Theo Sách lược vắn tắt, Đảng phải thu phục đại bộ phận giai cấp ..., tập hợp đại bộ phận dân cày và dựa vào dân cày nghèo làm thổ địa cách mạng","o":["công nhân","nông dân","tiểu tư sản","tư sản dân tộc"],"e":""},{"c":3,"q":"Trong khi xác định lực lượng cách mạng là toàn dân, Hồ Chí Minh lưu ý không được quên","o":["\"công nông là chủ cách mệnh... là gốc cách mệnh\"","trí thức là lực lượng quyết định","tư sản dân tộc là bạn đồng minh","thanh niên là lực lượng xung kích"],"e":""},{"c":3,"q":"Hồ Chí Minh nhận xét \"lòng cách mệnh càng bền, chí cách mệnh càng quyết\" là nói về","o":["công nhân và nông dân","trí thức yêu nước","tiểu tư sản thành thị","tư sản dân tộc"],"e":"Quiz thầy PDA. \"Công nông là tay không chân rồi, nếu thua thì chỉ mất một cái kiếp khổ, nếu được thì được cả thế giới\"."},{"c":3,"q":"Theo Hồ Chí Minh, do giai cấp công nhân và nông dân bị bóc lột nặng nề nhất nên họ","o":["có ý chí cách mạng kiên quyết nhất","có khả năng tiếp thu lý luận cách mạng nhất","có tinh thần yêu nước lớn nhất","có sức mạnh cách mạng lớn nhất"],"e":""},{"c":3,"q":"Đại hội VI Quốc tế Cộng sản (1928) cho rằng chỉ có thể thực hiện hoàn toàn công cuộc giải phóng các nước thuộc địa khi giai cấp vô sản giành được thắng lợi ở các nước tư bản tiên tiến. Quan điểm này dẫn tới điều gì?","o":["Làm giảm đi tính chủ động, sáng tạo của nhân dân các nước thuộc địa","Đề cao quá mức vai trò của giai cấp vô sản ở các nước chính quốc","Thúc đẩy tinh thần chờ đợi, ỷ lại của nhân dân các nước chính quốc","Xem nhẹ vai trò của giai cấp nông dân trong cách mạng thuộc địa"],"e":"Đề thi HK222, HK231."},{"c":3,"q":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc cần được tiến hành như thế nào?","o":["Chủ động, sáng tạo và có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc","Bị động và phải lệ thuộc vào kết quả của cách mạng vô sản ở chính quốc","Chủ động, sáng tạo và có khả năng giành thắng lợi trước cách mạng vô sản thế giới","Đồng thời và giành thắng lợi cùng lúc với cách mạng vô sản ở chính quốc"],"e":"Quiz BKEL chương 3."},{"c":3,"q":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc ở thuộc địa và cách mạng vô sản ở chính quốc có mối quan hệ","o":["bình đẳng, khăng khít, tác động qua lại, không lệ thuộc nhau","quan hệ chính - phụ, cách mạng chính quốc là chính","quan hệ phụ thuộc, thuộc địa phụ thuộc vào chính quốc","hoàn toàn độc lập, không có liên quan với nhau"],"e":""},{"c":3,"q":"\"Vận mệnh của giai cấp vô sản thế giới và đặc biệt là vận mệnh của giai cấp vô sản ở các nước đi xâm lược thuộc địa gắn chặt với vận mệnh của giai cấp bị áp bức ở các thuộc địa\" là câu nói của ai?","o":["Hồ Chí Minh","Lênin","C. Mác","Ph. Ăngghen"],"e":"Đề thi HK232."},{"c":3,"q":"Hồ Chí Minh dùng hình ảnh nào để chỉ chủ nghĩa tư bản, đòi hỏi phải đồng thời cắt cả hai vòi?","o":["Con đỉa hai vòi","Con rắn độc","Con bạch tuộc","Con hổ dữ"],"e":"Bản án chế độ thực dân Pháp (1925)."},{"c":3,"q":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc ở thuộc địa có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc là vì","o":["nọc độc và sức sống của chủ nghĩa tư bản tập trung ở thuộc địa hơn ở chính quốc","vô sản ở chính quốc không có khả năng làm cách mạng triệt để","lực lượng cách mạng ở thuộc địa đông đảo và mạnh hơn ở chính quốc","kẻ thù ở thuộc địa yếu hơn kẻ thù của giai cấp vô sản ở chính quốc"],"e":"Đề thi HK203. Cơ sở thứ hai: tinh thần đấu tranh quyết liệt của các dân tộc thuộc địa sẽ thành \"lực lượng khổng lồ\"."},{"c":3,"q":"Hồ Chí Minh cảnh báo: nếu thờ ơ về vấn đề cách mạng ở thuộc địa thì như","o":["\"đánh chết rắn đằng đuôi\"","\"đuổi hổ cửa trước, rước beo cửa sau\"","\"khoét chân cho vừa giày\"","\"nước đổ đầu vịt\""],"e":""},{"c":3,"q":"\"Công cuộc giải phóng anh em chỉ có thể thực hiện được bằng sự nỗ lực của bản thân anh em\" là lời kêu gọi Hồ Chí Minh viết trong","o":["Tuyên ngôn của Hội liên hiệp thuộc địa","Đường cách mệnh","Bản án chế độ thực dân Pháp","Lời kêu gọi toàn quốc kháng chiến"],"e":"Vận dụng luận điểm của C.Mác về khả năng tự giải phóng của giai cấp công nhân."},{"c":3,"q":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc phải được tiến hành bằng phương pháp nào?","o":["Bạo lực cách mạng","Đấu tranh nghị trường","Cải cách ôn hòa","Thương lượng ngoại giao"],"e":"Đề HK241 (tham khảo)."},{"c":3,"q":"\"Bạo lực là bà đỡ của một chế độ xã hội cũ đang thai nghén một chế độ mới\" là câu nói của ai?","o":["C. Mác (trong bộ Tư bản)","Ph. Ăngghen (trong Chống Đuyrinh)","V.I. Lênin","Hồ Chí Minh"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, \"Chế độ thực dân, tự bản thân nó, đã là một hành động ... của kẻ mạnh đối với kẻ yếu rồi\"","o":["bạo lực","xâm lược","bóc lột","áp bức"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, bạo lực cách mạng trong cách mạng giải phóng dân tộc phải dựa vào","o":["lực lượng chính trị của quần chúng và lực lượng vũ trang nhân dân","một quân đội chính quy có đủ các quân chủng, binh chủng hiện đại","ba thứ quân: bộ đội chủ lực, bộ đội địa phương và dân quân du kích","lực lượng vũ trang cách mạng được tổ chức và giác ngộ chính trị"],"e":"Đề thi HK203."},{"c":3,"q":"Trong hai hình thức đấu tranh của bạo lực cách mạng, đấu tranh chính trị của quần chúng có vai trò","o":["là cơ sở, nền tảng cho việc xây dựng lực lượng vũ trang và đấu tranh vũ trang","có ý nghĩa quyết định tiêu diệt lực lượng quân sự của địch","là hình thức duy nhất trong cách mạng Tháng Tám","chỉ là hình thức hỗ trợ cho đấu tranh vũ trang"],"e":""},{"c":3,"q":"Trong hai hình thức đấu tranh của bạo lực cách mạng, đấu tranh vũ trang có vai trò","o":["có ý nghĩa quyết định trong việc tiêu diệt lực lượng quân sự của địch, kết thúc chiến tranh","là cơ sở, nền tảng cho việc xây dựng lực lượng chính trị và đấu tranh chính trị","là hình thức chủ yếu và duy nhất trong mọi giai đoạn của cách mạng","chỉ được sử dụng khi các hình thức đấu tranh chính trị đã thất bại"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, việc lựa chọn hình thức đấu tranh cách mạng phải căn cứ vào","o":["hoàn cảnh lịch sử, tình hình cụ thể","chỉ thị của Quốc tế Cộng sản","sức mạnh quân sự của ta","ý muốn của Đảng"],"e":""},{"c":3,"q":"Trong tác phẩm của mình, Hồ Chí Minh có để lại một định nghĩa cố định về chủ nghĩa xã hội không?","o":["Không, Người tiếp cận chủ nghĩa xã hội ở nhiều góc độ khác nhau","Có, định nghĩa trong tác phẩm Đường cách mệnh (1927)","Có, định nghĩa trong tác phẩm Thường thức chính trị (1953)","Có, định nghĩa trong bản Di chúc của Người (1969)"],"e":""},{"c":3,"q":"\"Nói một cách tóm tắt, mộc mạc, chủ nghĩa xã hội trước hết nhằm làm cho nhân dân lao động thoát nạn bần cùng, làm cho mọi người có công ăn việc làm, được ấm no và sống một đời hạnh phúc\". Câu này thể hiện điều gì?","o":["Mục tiêu cơ bản của chủ nghĩa xã hội","Định nghĩa cố định về chủ nghĩa xã hội","Đặc trưng chính trị của chủ nghĩa xã hội","Nhiệm vụ của thời kỳ quá độ lên CNXH"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, chỉ có chủ nghĩa xã hội mới chú ý xem xét những lợi ích cá nhân đúng đắn và bảo đảm cho nó được","o":["thỏa mãn","tôn trọng","đáp ứng","đầy đủ"],"e":"Quiz thầy PDA."},{"c":3,"q":"Theo Hồ Chí Minh, trong xã hội xã hội chủ nghĩa, để lợi ích cá nhân là một bộ phận của lợi ích tập thể thì mỗi cá nhân phải","o":["giữ một vị trí nhất định và đóng góp một phần công lao trong xã hội","triệt tiêu hoàn toàn các biểu hiện của chủ nghĩa cá nhân trong mình","nỗ lực phấn đấu cải tạo nền kinh tế - xã hội cũ, xây dựng cái mới","phát huy ý thức làm chủ, xây dựng xã hội xã hội chủ nghĩa"],"e":"Đề thi HK231."},{"c":3,"q":"Theo Hồ Chí Minh, điểm giống nhau giữa chủ nghĩa xã hội và chủ nghĩa cộng sản là","o":["tư liệu sản xuất là của chung, không có giai cấp áp bức bóc lột","không còn sự quản lý của Nhà nước đối với xã hội","không còn sự lãnh đạo của Đảng Cộng sản đối với xã hội","không còn vết tích gì của chế độ xã hội cũ để lại"],"e":"Quiz thầy PDA."},{"c":3,"q":"Theo Hồ Chí Minh, điểm khác nhau giữa chủ nghĩa xã hội và chủ nghĩa cộng sản là","o":["chủ nghĩa xã hội vẫn còn chút ít vết tích của xã hội cũ","chủ nghĩa xã hội vẫn còn giai cấp áp bức, bóc lột","chủ nghĩa xã hội chưa có chế độ công hữu tư liệu sản xuất","chủ nghĩa xã hội chưa có sự lãnh đạo của Đảng Cộng sản"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, chủ nghĩa xã hội là","o":["giai đoạn đầu (giai đoạn thấp) của chủ nghĩa cộng sản","giai đoạn cao của chủ nghĩa cộng sản","giai đoạn quá độ từ chủ nghĩa tư bản lên chủ nghĩa cộng sản","một hình thái kinh tế - xã hội độc lập với chủ nghĩa cộng sản"],"e":""},{"c":3,"q":"Học thuyết nào của C.Mác khẳng định sự phát triển của xã hội loài người là quá trình lịch sử - tự nhiên, làm cơ sở cho quan điểm \"tiến lên CNXH là tất yếu khách quan\"?","o":["Học thuyết về hình thái kinh tế - xã hội","Học thuyết giá trị thặng dư","Học thuyết về đấu tranh giai cấp","Học thuyết về nhà nước và cách mạng"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh (năm 1953), nước nào \"đi thẳng\" đến chủ nghĩa xã hội?","o":["Liên Xô","Trung Quốc","Việt Nam","Các nước Đông Âu"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, những nước phải kinh qua chế độ dân chủ mới rồi tiến lên chủ nghĩa xã hội là","o":["các nước Đông Âu, Trung Quốc, Việt Nam","Liên Xô, Trung Quốc, Việt Nam","Việt Nam, Liên Xô, các nước Đông Âu","các nước Đông Âu, Liên Xô, Trung Quốc"],"e":"Quiz thầy PDA."},{"c":3,"q":"Theo Hồ Chí Minh, một trong những điều kiện để các nước chưa qua giai đoạn phát triển tư bản chủ nghĩa có thể đi lên chủ nghĩa xã hội là","o":["được tư tưởng Mác - Lênin dẫn đường","tất cả mọi quyền lực đều thuộc về nhân dân","nền kinh tế phát triển cao gắn với công hữu","có sự giúp đỡ trực tiếp của Liên Xô"],"e":"Đề thi HK231."},{"c":3,"q":"Theo Hồ Chí Minh, chỉ có chủ nghĩa xã hội mới là nguồn gốc của","o":["tự do, bình đẳng, bác ái","độc lập, tự do, hạnh phúc","dân chủ, công bằng, văn minh","ấm no, tự do, hạnh phúc"],"e":"Đề thi HK231."},{"c":3,"q":"Đặc trưng về chính trị của xã hội xã hội chủ nghĩa theo Hồ Chí Minh là","o":["xã hội có chế độ dân chủ, do nhân dân làm chủ","xã hội do giai cấp công nhân làm chủ","xã hội do Nhà nước pháp quyền làm chủ","xã hội không còn Nhà nước và pháp luật"],"e":"Quan điểm thuộc bản chất CNXH: \"chế độ chính trị do nhân dân làm chủ\" (đề HK203)."},{"c":3,"q":"Chọn phương án SAI: Đặc trưng bản chất tổng quát của chủ nghĩa xã hội ở Việt Nam theo Hồ Chí Minh là","o":["Chủ nghĩa xã hội là một chế độ chính trị do giai cấp công nhân làm chủ","Chủ nghĩa xã hội là chế độ không còn người bóc lột người","Chủ nghĩa xã hội là một xã hội phát triển cao về văn hóa, đạo đức","Chủ nghĩa xã hội có nền kinh tế phát triển cao gắn liền với sự phát triển của khoa học - kỹ thuật"],"e":"Đề thi HK203. Đúng phải là \"do nhân dân làm chủ\"."},{"c":3,"q":"Trong tư tưởng Hồ Chí Minh, ai có vị trí cao nhất (tối thượng) trong xã hội xã hội chủ nghĩa?","o":["Nhân dân","Giai cấp công nhân","Đảng Cộng sản","Nhà nước"],"e":"Quiz thầy PDA. \"Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ\"."},{"c":3,"q":"Đặc trưng về kinh tế của xã hội xã hội chủ nghĩa theo Hồ Chí Minh là","o":["kinh tế phát triển cao, dựa trên lực lượng sản xuất hiện đại và công hữu tư liệu sản xuất chủ yếu","kinh tế thị trường tự do cạnh tranh, dựa trên nhiều hình thức sở hữu tư nhân là chủ đạo","kinh tế nông nghiệp tự cung tự cấp, dựa trên lao động thủ công và hợp tác xã","kinh tế dựa trên chế độ tư hữu là chủ yếu, Nhà nước chỉ giữ vai trò điều tiết"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, công cụ lao động chủ yếu trong chủ nghĩa xã hội là","o":["máy móc","tri thức","ruộng đất","vật nuôi"],"e":"Đề thi HK231. Công cụ lao động \"đã phát triển dần đến máy móc, sức điện, sức nguyên tử\"."},{"c":3,"q":"Hồ Chí Minh diễn đạt quan hệ sản xuất trong xã hội xã hội chủ nghĩa là","o":["lấy nhà máy, xe lửa, ngân hàng... làm của chung","tư liệu sản xuất thuộc về Nhà nước và tập thể","tư liệu sản xuất thuộc về giai cấp công nhân","tư liệu sản xuất thuộc về người lao động giỏi"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, chủ nghĩa xã hội là một xã hội phát triển cao về","o":["văn hóa, đạo đức","văn hóa, giáo dục","giáo dục, chính trị","chính trị, đạo đức"],"e":"Quiz BKEL chương 3, đề HK203."},{"c":3,"q":"Trong tư tưởng Hồ Chí Minh, chủ nghĩa xã hội sẽ đảm bảo các giá trị nào trong quan hệ xã hội?","o":["Công bằng và hợp lý","Ấm no và hạnh phúc","Tự do và bình đẳng","Độc lập và tự do"],"e":"Đề thi HK231."},{"c":3,"q":"Theo Hồ Chí Minh, đâu là cơ sở để mọi cộng đồng người đoàn kết chặt chẽ trong chủ nghĩa xã hội?","o":["Bình đẳng về quyền lợi và nghĩa vụ","Đảm bảo vững chắc độc lập dân tộc","Tự do thể hiện mong muốn của mình","Quyền lợi được bảo vệ bởi pháp luật"],"e":"Đề thi HK231."},{"c":3,"q":"Theo Hồ Chí Minh, trong chủ nghĩa xã hội, \"làm nhiều thì hưởng nhiều, làm ít thì hưởng ít, không làm thì không hưởng\" là nguyên tắc","o":["phân chia thành quả lao động","phân biệt với tư bản chủ nghĩa","đánh giá năng suất lao động","khẳng định tính ưu việt xã hội"],"e":"Đề thi HK231. Trừ những người chưa có hoặc không còn khả năng lao động."},{"c":3,"q":"Đặc trưng về chủ thể xây dựng chủ nghĩa xã hội theo Hồ Chí Minh là","o":["công trình tập thể của nhân dân dưới sự lãnh đạo của Đảng","công trình riêng của giai cấp công nhân Việt Nam","công trình của Nhà nước và bộ máy chính quyền các cấp","công trình của đội ngũ cán bộ, đảng viên ưu tú"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, nhân dân là chủ thể, là lực lượng quyết định","o":["tốc độ xây dựng và sự vững mạnh của chủ nghĩa xã hội","thời gian và lộ trình xây dựng chủ nghĩa xã hội","tính ưu việt và bản chất của chủ nghĩa xã hội","đường hướng và mục tiêu của chủ nghĩa xã hội"],"e":"Đề thi HK231 (đáp án: sự vững mạnh); bài tập HK221 (đáp án: tốc độ)."},{"c":3,"q":"Theo Hồ Chí Minh, để xây dựng thành công chủ nghĩa xã hội cần có sự lãnh đạo của một đảng","o":["cách mạng chân chính của giai cấp công nhân, toàn tâm toàn ý phục vụ nhân dân","cách mạng của giai cấp công nhân, toàn tâm toàn ý phục vụ giai cấp","chân chính của dân tộc Việt Nam, toàn tâm toàn ý phục vụ cách mạng","cách mạng của dân tộc Việt Nam, toàn tâm toàn ý phục vụ Tổ quốc"],"e":"Đề thi HK231."},{"c":3,"q":"Mục tiêu về chính trị của chủ nghĩa xã hội ở Việt Nam theo Hồ Chí Minh là","o":["xây dựng được chế độ dân chủ, tức là nhân dân làm chủ","xây dựng được Nhà nước pháp quyền tam quyền phân lập","xây dựng được nền chuyên chính vô sản kiểu Xôviết","xây dựng được hệ thống chính trị đa đảng, đối lập"],"e":""},{"c":3,"q":"Khi khẳng định \"dân làm chủ\" và \"dân là chủ\", Hồ Chí Minh đã khẳng định","o":["quyền lợi và quyền hạn, trách nhiệm và địa vị của nhân dân","vai trò lãnh đạo tuyệt đối, toàn diện của Đảng Cộng sản","quyền lực tuyệt đối, không bị kiểm soát của Nhà nước","vai trò tập hợp, đoàn kết của Mặt trận Tổ quốc"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, mục tiêu kinh tế của chủ nghĩa xã hội ở Việt Nam là nền kinh tế phát triển cao với","o":["công nghiệp và nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến","công nghiệp và dịch vụ hiện đại, khoa học kỹ thuật tiên tiến","công nghiệp nặng là chủ yếu","nông nghiệp là mặt trận hàng đầu"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, các ngành kinh tế trọng điểm (\"hai chân\") của nền kinh tế xã hội chủ nghĩa là","o":["công nghiệp và nông nghiệp","công nghiệp và thương nghiệp","nông nghiệp và dịch vụ","nông nghiệp và thương nghiệp"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, thành phần kinh tế nào lãnh đạo nền kinh tế quốc dân?","o":["Kinh tế quốc doanh","Kinh tế hợp tác xã","Kinh tế tư bản nhà nước","Kinh tế tư nhân"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, hình thức sở hữu tập thể của nhân dân lao động trong chủ nghĩa xã hội là","o":["kinh tế hợp tác xã","kinh tế quốc doanh","kinh tế gia đình","kinh tế tư nhân"],"e":"Quiz thầy PDA. Nhà nước phải ưu tiên kinh tế quốc doanh và khuyến khích, giúp đỡ kinh tế hợp tác xã."},{"c":3,"q":"Theo Hồ Chí Minh, mục tiêu về văn hóa của chủ nghĩa xã hội ở Việt Nam là xây dựng nền văn hóa mang tính","o":["dân tộc, khoa học, đại chúng","cách mạng, khoa học, đại chúng","dân tộc, cách mạng, nhân văn","tiên tiến, đậm đà bản sắc dân tộc"],"e":"Quiz thầy PDA."},{"c":3,"q":"\"Muốn tiến lên chủ nghĩa xã hội phải phát triển kinh tế và văn hóa. Vì sao không nói phát triển văn hóa và kinh tế?\" Hồ Chí Minh giải thích bằng câu tục ngữ nào?","o":["Có thực mới vực được đạo","Ăn quả nhớ kẻ trồng cây","Uống nước nhớ nguồn","Muốn đi nhanh hãy đi một mình"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, để phục vụ sự nghiệp cách mạng XHCN thì văn hóa phải","o":["xã hội chủ nghĩa về nội dung và dân tộc về hình thức","dân tộc về nội dung và xã hội chủ nghĩa về hình thức","khoa học về nội dung và đại chúng về hình thức","cách mạng về nội dung và hiện đại về hình thức"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, mối quan hệ giữa văn hóa với chính trị, kinh tế là","o":["chính trị và kinh tế là nền tảng, quyết định văn hóa; văn hóa phục vụ mục tiêu chính trị, kinh tế","văn hóa là nền tảng, quyết định tính chất của chế độ chính trị và kinh tế","văn hóa hoàn toàn độc lập, không chịu tác động của chính trị và kinh tế","kinh tế quyết định văn hóa, còn chính trị không có liên quan đến văn hóa"],"e":""},{"c":3,"q":"Mục tiêu về quan hệ xã hội của chủ nghĩa xã hội ở Việt Nam theo Hồ Chí Minh là","o":["bảo đảm dân chủ, công bằng, văn minh","bảo đảm ấm no, tự do, hạnh phúc","bảo đảm dân giàu, nước mạnh","bảo đảm hòa bình, hữu nghị"],"e":""},{"c":3,"q":"Trong hệ thống động lực của chủ nghĩa xã hội, theo Hồ Chí Minh, động lực giữ vai trò quyết định là","o":["nội lực dân tộc, là nhân dân","sự giúp đỡ của các nước XHCN anh em","khoa học - kỹ thuật","nguồn vốn đầu tư nước ngoài"],"e":"Quiz thầy PDA: nguồn động lực giữ vai trò quyết định là nhân dân."},{"c":3,"q":"Chọn phương án đúng nhất: Theo Hồ Chí Minh, hệ thống động lực của chủ nghĩa xã hội gồm","o":["động lực vật chất và tinh thần, nội lực và ngoại lực","động lực tinh thần và động lực bên ngoài","động lực vật chất và động lực bên trong","động lực tinh thần và động lực nội sinh"],"e":"Đề thi HK203."},{"c":3,"q":"Theo Hồ Chí Minh, những động lực hàng đầu của chủ nghĩa xã hội là","o":["lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân","khoa học, công nghệ và giáo dục đào tạo","vốn đầu tư, kỹ thuật hiện đại và thị trường","sự lãnh đạo của Đảng, quản lý của Nhà nước"],"e":""},{"c":3,"q":"\"Việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức tránh\" thể hiện động lực nào của chủ nghĩa xã hội theo Hồ Chí Minh?","o":["Lợi ích của dân","Dân chủ của dân","Sức mạnh đoàn kết toàn dân","Sự lãnh đạo của Đảng"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, dân chủ trong chủ nghĩa xã hội là","o":["dân chủ của nhân dân, là của quý báu nhất của nhân dân","dân chủ của giai cấp công nhân","dân chủ của Đảng Cộng sản","dân chủ của những người lao động trí óc"],"e":""},{"c":3,"q":"Ngày 3-3-1951, Hồ Chí Minh nêu mục đích của Đảng Lao động Việt Nam gồm trong 8 chữ là","o":["Đoàn kết toàn dân, phụng sự Tổ quốc","Độc lập dân tộc, chủ nghĩa xã hội","Trung với nước, hiếu với dân","Cần, kiệm, liêm, chính, chí công vô tư"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, trong hoạt động của các tổ chức thúc đẩy chủ nghĩa xã hội, tổ chức nào giữ vai trò quyết định?","o":["Đảng Cộng sản (như người cầm lái)","Nhà nước","Mặt trận Tổ quốc","Các tổ chức chính trị - xã hội"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, các tổ chức chính trị - xã hội trong xây dựng chủ nghĩa xã hội có điểm tương đồng là","o":["đều nhất quán về chính trị, tư tưởng dưới sự lãnh đạo của Đảng","đều hoạt động vì lợi ích riêng của tổ chức và thành viên","đều có nội dung và phương thức hoạt động giống hệt nhau","đều hoạt động độc lập, không chịu sự quản lý của Nhà nước"],"e":"Bài tập HK221."},{"c":3,"q":"Theo Hồ Chí Minh, \"Muốn xây dựng chủ nghĩa xã hội, trước hết cần có ...\"","o":["những con người xã hội chủ nghĩa","nền công nghiệp hiện đại","sự lãnh đạo của Đảng","nền kinh tế phát triển cao"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, \"có ý thức làm chủ nhà nước, có tinh thần tập thể XHCN và tư tưởng 'mình vì mọi người, mọi người vì mình'\" là biểu hiện của","o":["tư tưởng và tác phong mới","đạo đức và trí tuệ mới","văn hóa và đạo đức mới","tri thức và văn hóa mới"],"e":"Bài tập HK221."},{"c":3,"q":"Những tư tưởng, tác phong xấu mà Hồ Chí Minh yêu cầu phải chống lại khi xây dựng con người XHCN là","o":["chủ nghĩa cá nhân; quan liêu, mệnh lệnh; tham ô, lãng phí; bảo thủ, rụt rè","ích kỷ, hẹp hòi; tham lam, lười biếng; dối trá, gian lận","tham ô, lãng phí, quan liêu; tư túng, chia rẽ, kiêu ngạo","kiêu ngạo, hách dịch; cửa quyền, bè phái; cục bộ, địa phương"],"e":""},{"c":3,"q":"Theo giáo trình, quan điểm nào là một trong những quan điểm xuyên suốt, nét đặc sắc của tư tưởng Hồ Chí Minh trong cách mạng XHCN?","o":["\"Xây\" đi đôi với \"chống\"","Học đi đôi với hành","Nói đi đôi với làm","Kháng chiến đi đôi với kiến quốc"],"e":""},{"c":3,"q":"Tính chất của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam theo Hồ Chí Minh là","o":["thời kỳ cải biến sâu sắc nhất nhưng phức tạp, lâu dài, khó khăn","thời kỳ phát triển nhanh chóng, ngắn hạn, thuận lợi","thời kỳ đấu tranh giai cấp gay gắt, quyết liệt nhất","thời kỳ xây dựng nền tảng kinh tế thị trường tự do"],"e":"Đề HK241 (tham khảo). Thậm chí còn khó khăn, phức tạp hơn cả việc đánh giặc."},{"c":3,"q":"Theo Hồ Chí Minh, \"Chủ nghĩa xã hội không thể làm mau được mà phải làm ...\"","o":["dần dần","từng bước vững chắc","triệt để","khẩn trương"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, đặc điểm lớn nhất (\"đặc điểm to nhất\") của thời kỳ quá độ ở Việt Nam là","o":["từ nước nông nghiệp lạc hậu tiến thẳng lên CNXH, không kinh qua phát triển TBCN","sự tồn tại đan xen giữa các yếu tố của xã hội cũ và xã hội mới","đất nước bị chia cắt làm hai miền với hai chế độ chính trị khác nhau","có sự giúp đỡ to lớn của Liên Xô và các nước xã hội chủ nghĩa anh em"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, con đường quá độ lên chủ nghĩa xã hội ở Việt Nam là","o":["quá độ lên chủ nghĩa xã hội không qua giai đoạn phát triển tư bản chủ nghĩa","quá độ lên chủ nghĩa xã hội không qua giai đoạn phát triển xã hội dân chủ","quá độ lên chủ nghĩa xã hội không qua giai đoạn phát triển phong kiến","quá độ lên chủ nghĩa xã hội không qua giai đoạn phát triển cộng sản chủ nghĩa"],"e":"Quiz BKEL chương 3."},{"c":3,"q":"Lên chủ nghĩa xã hội không qua giai đoạn phát triển tư bản chủ nghĩa, theo Hồ Chí Minh, là","o":["con đường quá độ lên CNXH ở Việt Nam","con đường trực tiếp lên CNXH ở Việt Nam","con đường tiến thẳng lên CNXH ở Việt Nam","con đường lên CNXH của mọi quốc gia"],"e":"Đề thi HK203."},{"c":3,"q":"Nhiệm vụ của thời kỳ quá độ theo Hồ Chí Minh là","o":["cải tạo, xóa bỏ tàn tích xã hội cũ, xây dựng các yếu tố mới tiến lên CNXH","chỉ tập trung phát triển kinh tế, chưa đặt ra vấn đề chính trị, văn hóa","xóa bỏ ngay lập tức mọi thành phần kinh tế phi xã hội chủ nghĩa","tiếp tục hoàn thành cách mạng dân tộc dân chủ nhân dân trên cả nước"],"e":""},{"c":3,"q":"Theo Hồ Chí Minh, muốn xây dựng được chế độ dân chủ trong thời kỳ quá độ thì trước hết phải","o":["chống tất cả các biểu hiện của chủ nghĩa cá nhân, trước hết ở trong Đảng","tăng cường sự lãnh đạo tuyệt đối của Đảng đối với Nhà nước","xây dựng và ban hành Hiến pháp, hệ thống pháp luật dân chủ","nâng cao tri thức, trình độ học vấn của toàn thể nhân dân"],"e":"Quiz thầy PDA, đề thi HK231."},{"c":3,"q":"Theo Hồ Chí Minh, nhiệm vụ quan trọng nhất về kinh tế của thời kỳ quá độ là","o":["cải tạo nền kinh tế cũ, xây dựng nền kinh tế mới có công, nông nghiệp hiện đại","xóa bỏ ngay các thành phần kinh tế tư nhân, cá thể trong nền kinh tế","phát triển kinh tế thị trường tự do theo mô hình các nước phát triển","tập trung toàn lực phát triển công nghiệp nặng, ưu tiên công nghiệp quốc phòng"],"e":"Đề HK241 (tham khảo)."},{"c":3,"q":"Theo Hồ Chí Minh, giữa cải tạo và xây dựng trong thời kỳ quá độ thì","o":["xây dựng là nhiệm vụ chủ chốt và lâu dài","cải tạo là nhiệm vụ chủ chốt và lâu dài","cải tạo và xây dựng quan trọng ngang nhau","cải tạo phải hoàn thành trước rồi mới xây dựng"],"e":""},{"c":3,"q":"Về văn hóa trong thời kỳ quá độ, Hồ Chí Minh yêu cầu phải","o":["triệt để tẩy trừ mọi di tích thuộc địa, ảnh hưởng nô dịch của văn hóa đế quốc","chọn lọc để bảo tồn những yếu tố văn hóa do thực dân Pháp để lại","tiếp thu toàn bộ văn hóa phương Tây để nhanh chóng hiện đại hóa đất nước","xóa bỏ hoàn toàn văn hóa truyền thống để xây dựng nền văn hóa mới"],"e":""},{"c":3,"q":"Trong tư tưởng Hồ Chí Minh, đối với những tàn dư (nếp sống, thói quen, thành kiến) của xã hội cũ thì phải","o":["thay đổi thật triệt để","chọn lọc để bảo tồn","hoàn toàn xóa bỏ ngay lập tức","chọn lọc để xóa bỏ"],"e":"Bài tập HK221."},{"c":3,"q":"Nguyên tắc đầu tiên trong xây dựng CNXH thời kỳ quá độ theo Hồ Chí Minh là","o":["mọi tư tưởng, hành động phải trên nền tảng chủ nghĩa Mác - Lênin","phải giữ vững độc lập dân tộc, không để bị lệ thuộc nước ngoài","phải đoàn kết, học tập kinh nghiệm của các nước anh em","xây phải đi đôi với chống, lấy xây làm chính"],"e":""},{"c":3,"q":"Hồ Chí Minh đánh giá chủ nghĩa Mác - Lênin là","o":["khoa học về cách mạng của quần chúng bị áp bức, về thắng lợi của CNXH","học thuyết cách mạng phù hợp nhất với dân tộc Việt Nam","lý luận tiến bộ nhất của thời đại mới mở ra từ năm 1917","nền tảng tư tưởng của những con người cộng sản chân chính"],"e":"Quiz thầy PDA."},{"c":3,"q":"Theo Hồ Chí Minh, độc lập dân tộc có vai trò gì đối với chủ nghĩa xã hội?","o":["Là tiền đề, điều kiện tiên quyết để thực hiện chủ nghĩa xã hội","Là mục tiêu cuối cùng, cao nhất của cách mạng Việt Nam","Là kết quả tất yếu sau khi xây dựng xong chủ nghĩa xã hội","Là vấn đề độc lập, không liên quan đến chủ nghĩa xã hội"],"e":"Quiz thầy PDA: \"độc lập dân tộc thật sự\" là tiền đề, điều kiện tiên quyết."},{"c":3,"q":"Khi đánh giá cao thành tựu của Liên Xô, Hồ Chí Minh vẫn khẳng định \"Ta không thể giống Liên Xô, vì Liên Xô có phong tục tập quán khác, có lịch sử địa lý khác...\". Điều này thuộc nguyên tắc nào?","o":["Học tập kinh nghiệm các nước anh em nhưng vận dụng sáng tạo","Giữ vững độc lập dân tộc trong mọi hoàn cảnh","Xây phải đi đôi với chống trong mọi lĩnh vực","Mọi hành động trên nền tảng chủ nghĩa Mác - Lênin"],"e":""},{"c":3,"q":"Nguyên tắc xây dựng CNXH trong thời kỳ quá độ được nhắc trong đề HK241 là","o":["xây phải đi đôi với chống","nói phải đi đôi với làm","học phải đi đôi với hành","kháng chiến phải đi đôi với kiến quốc"],"e":"Đề HK241 (tham khảo)."},{"c":3,"q":"Theo Hồ Chí Minh, đối với mỗi người, phải đánh thắng kẻ địch bên trong là","o":["chủ nghĩa cá nhân","chủ nghĩa đế quốc","bệnh quan liêu","chủ nghĩa giáo điều"],"e":"Chủ nghĩa cá nhân như vi trùng độc hại, sinh ra bệnh tham lam, kiêu ngạo, háo danh, vô tổ chức, vô kỷ luật."},{"c":3,"q":"Hồ Chí Minh phê phán \"căn bệnh\": \"Nghe những lời bình luận không đúng cũng làm thinh, không ... Ai nói sao, ai làm gì cũng mặc kệ\"","o":["biện bác","đấu tranh","phê bình","tìm hiểu"],"e":""},{"c":3,"q":"Trong mối quan hệ giữa độc lập dân tộc và CNXH, độc lập dân tộc là","o":["cơ sở, tiền đề để tiến lên chủ nghĩa xã hội","điều kiện để bảo đảm chủ nghĩa xã hội vững chắc","mục tiêu cuối cùng của cách mạng","kết quả của chủ nghĩa xã hội"],"e":""},{"c":3,"q":"Trong mối quan hệ giữa độc lập dân tộc và CNXH, chủ nghĩa xã hội là","o":["điều kiện để bảo đảm nền độc lập dân tộc vững chắc","cơ sở, tiền đề để giành độc lập dân tộc","mục tiêu trước mắt của cách mạng","phương tiện để giành chính quyền"],"e":""},{"c":3,"q":"Ba điều kiện để bảo đảm độc lập dân tộc gắn liền với chủ nghĩa xã hội theo Hồ Chí Minh là","o":["Đảng lãnh đạo tuyệt đối; củng cố đại đoàn kết dân tộc; đoàn kết với cách mạng thế giới","Phát triển kinh tế; xây dựng văn hóa; tăng cường quốc phòng, an ninh","Xây dựng Đảng; xây dựng Nhà nước; xây dựng Mặt trận Tổ quốc","Độc lập về chính trị; tự chủ về kinh tế; tự lực cánh sinh về quân sự"],"e":""},{"c":3,"q":"Vận dụng tư tưởng Hồ Chí Minh hiện nay, bài học đầu tiên Cương lĩnh của Đảng rút ra là","o":["nắm vững ngọn cờ độc lập dân tộc và chủ nghĩa xã hội","đổi mới toàn diện, đồng bộ mọi lĩnh vực","lấy phát triển kinh tế làm nhiệm vụ trung tâm","xây dựng Đảng là nhiệm vụ then chốt"],"e":""},{"c":3,"q":"Phương châm thực hiện dân chủ xã hội chủ nghĩa hiện nay để nhân dân tham gia vào các quyết định liên quan đến lợi ích của mình là","o":["\"dân biết, dân bàn, dân làm, dân kiểm tra\"","\"dân giàu, nước mạnh, dân chủ, công bằng, văn minh\"","\"Đảng lãnh đạo, Nhà nước quản lý, nhân dân làm chủ\"","\"dân là gốc, dân là chủ\""],"e":""},{"c":3,"q":"Đặc điểm của hệ thống chính trị ở Việt Nam là","o":["tính nhất nguyên và tính thống nhất","tính đa nguyên và tính độc lập","tính tam quyền phân lập","tính đa đảng và đối lập"],"e":""},{"c":3,"q":"Kiên trì con đường Hồ Chí Minh đã lựa chọn trong cách mạng Việt Nam nghĩa là","o":["thực hiện mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội","giữ vững nền độc lập dân tộc","thực hiện triệt để cách mạng dân tộc dân chủ nhân dân","hội nhập với thế giới"],"e":"Đề thi HK203."},{"c":3,"q":"Theo tư tưởng Hồ Chí Minh, đặc điểm xã hội nào quy định tính chất, nhiệm vụ hàng đầu của cách mạng giải phóng dân tộc?","o":["Mâu thuẫn sâu sắc giữa dân tộc bị áp bức với chủ nghĩa thực dân","Giai cấp công nhân và nông dân bị áp bức, bóc lột nặng nề nhất","Chế độ phong kiến chấp nhận nền bảo hộ, hệ tư tưởng phong kiến lỗi thời","Các phong trào yêu nước đều bị thực dân Pháp dìm trong biển máu"],"e":"Đề thi HK203."},{"c":3,"q":"Theo Hồ Chí Minh, mục đích của cách mạng Việt Nam là tiến đến","o":["chủ nghĩa xã hội rồi đến chủ nghĩa cộng sản","chủ nghĩa tư bản rồi đến chủ nghĩa xã hội","chế độ dân chủ nhân dân","chế độ dân chủ tư sản"],"e":""},{"c":4,"q":"Câu \"Đảng có vững, cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy\" trích từ tác phẩm nào?","o":["Đường cách mệnh (1927)","Chánh cương vắn tắt (1930)","Sửa đổi lối làm việc (1947)","Di chúc (1969)"],"e":"Câu hỏi BKEL."},{"c":4,"q":"Hình ảnh Đảng \"như người cầm lái\" thể hiện quan điểm nhất quán nào của Hồ Chí Minh?","o":["Vai trò lãnh đạo của Đảng trong suốt cả quá trình cách mạng","Vai trò của Đảng chỉ trong cách mạng giải phóng dân tộc","Đảng chỉ là một thành viên bình đẳng như các tổ chức khác","Đảng đứng trên Nhà nước và đứng trên dân tộc"],"e":""},{"c":4,"q":"Trong tư tưởng Hồ Chí Minh, vai trò lãnh đạo của Đảng Cộng sản Việt Nam là một tất yếu xuất phát từ","o":["yêu cầu phát triển của dân tộc Việt Nam","lý luận của Lênin về đảng cộng sản kiểu mới","phong trào đấu tranh của giai cấp công nhân","sự chỉ đạo của Quốc tế Cộng sản"],"e":"Đề thi HK232."},{"c":4,"q":"Theo Hồ Chí Minh, việc bảo đảm, phát huy vai trò lãnh đạo của Đảng trong suốt tiến trình phát triển đất nước theo mục tiêu CNXH là một","o":["nguyên tắc vận hành của xã hội Việt Nam từ khi có Đảng","nguyên tắc vận hành của chính trị Việt Nam từ khi có Đảng","đặc trưng chính trị của xã hội Việt Nam kể từ khi có Đảng","đặc trưng nổi bật của xã hội Việt Nam kể từ khi có Đảng"],"e":"Đề thi HK231, HK232."},{"c":4,"q":"Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập tồn tại và phát triển theo quan điểm của ai về đảng kiểu mới của giai cấp vô sản?","o":["V.I. Lênin","C. Mác","Ph. Ăngghen","Quốc tế Cộng sản"],"e":""},{"c":4,"q":"Theo chủ nghĩa Mác - Lênin, nói chung sự ra đời của một đảng cộng sản là sản phẩm của sự kết hợp","o":["chủ nghĩa xã hội khoa học với phong trào công nhân","chủ nghĩa Mác - Lênin với phong trào yêu nước","chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước","phong trào công nhân với phong trào nông dân"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Đảng Cộng sản Việt Nam ra đời là kết quả của sự kết hợp","o":["chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước","chủ nghĩa Mác - Lênin với phong trào công nhân","chủ nghĩa xã hội khoa học với phong trào công nhân và phong trào nông dân","chủ nghĩa Mác - Lênin với phong trào yêu nước và phong trào trí thức"],"e":""},{"c":4,"q":"Hồ Chí Minh đã bổ sung thêm yếu tố nào khi nói về sự ra đời của Đảng Cộng sản Việt Nam?","o":["Phong trào yêu nước","Phong trào công nhân","Phong trào nông dân","Phong trào trí thức"],"e":"Quiz BKEL chương 4."},{"c":4,"q":"Quan điểm \"ĐCSVN ra đời là kết quả kết hợp CN Mác - Lênin với phong trào công nhân và phong trào yêu nước\" phù hợp với xã hội Việt Nam vì trong xã hội thuộc địa và phong kiến","o":["mọi giai cấp, tầng lớp, trừ tư sản mại bản và đại địa chủ, đều có mâu thuẫn dân tộc","giai cấp công nhân Việt Nam chiếm đa số trong dân cư và có tổ chức chặt chẽ","phong trào yêu nước chỉ do giai cấp nông dân lãnh đạo nên cần được bổ sung","mâu thuẫn giai cấp ở Việt Nam gay gắt hơn mâu thuẫn dân tộc"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, trong xã hội thuộc địa và phong kiến Việt Nam, điểm giống nhau của tư sản mại bản và đại địa chủ là","o":["không có mâu thuẫn dân tộc","không có mâu thuẫn giai cấp","không bị thực dân áp bức bóc lột","không phải đối tượng cách mạng"],"e":"Đề thi HK232."},{"c":4,"q":"Theo Hồ Chí Minh, trong xã hội thuộc địa và phong kiến Việt Nam, những lực lượng nào không có mâu thuẫn dân tộc?","o":["Tư sản mại bản, đại địa chủ","Đại địa chủ, tư sản dân tộc","Tư sản dân tộc, tiểu tư sản","Tư sản, địa chủ, tiểu tư sản"],"e":"Đề thi HK231."},{"c":4,"q":"Trong cuộc đấu tranh giải phóng dân tộc, điều gì đã khiến một số người yêu nước ban đầu đi theo xu hướng dân chủ tư sản dần chuyển sang xu hướng cộng sản?","o":["Sự tác động, ảnh hưởng của chủ nghĩa Mác - Lênin","Sự thất bại của xu hướng dân chủ tư sản","Sự thiếu vắng một lực lượng lãnh đạo đúng","Sự đàn áp của thực dân Pháp"],"e":"Đề thi HK231, HK232. Rõ nhất là từ năm 1925 trở đi."},{"c":4,"q":"Theo Hồ Chí Minh, điều gì tạo ra sự khác biệt giữa phong trào đấu tranh giai cấp và phong trào đấu tranh dân tộc?","o":["Lực lượng, phương thức, khẩu hiệu đấu tranh","Mục tiêu, phương thức, lực lượng đấu tranh","Khẩu hiệu, lực lượng, mục tiêu đấu tranh","Phương thức, mục tiêu, khẩu hiệu đấu tranh"],"e":"Đề thi HK222, HK231, HK232 (câu \"kinh điển\"!). Mục tiêu chung là giành độc lập, tự do cho dân tộc."},{"c":4,"q":"Theo Hồ Chí Minh, phong trào đấu tranh giai cấp và phong trào đấu tranh dân tộc ở Việt Nam có mục tiêu chung là","o":["giành độc lập, tự do cho dân tộc","giành ruộng đất cho nông dân","giải phóng giai cấp công nhân","xây dựng chủ nghĩa cộng sản"],"e":""},{"c":4,"q":"Chọn phương án đúng với tư tưởng Hồ Chí Minh","o":["Phong trào yêu nước có trước phong trào công nhân","Phong trào yêu nước phụ thuộc vào phong trào công nhân","Phong trào yêu nước là phong trào đấu tranh của nông dân","Phong trào yêu nước có sau phong trào đấu tranh của trí thức"],"e":"Bài tập HK221."},{"c":4,"q":"Hồ Chí Minh nói \"Đảng ta là đạo đức, là văn minh\" vào dịp nào?","o":["Lễ kỷ niệm 30 năm thành lập Đảng (1960)","Đại hội II của Đảng (2-1951)","Đại hội III của Đảng (9-1960)","Trong bản Di chúc (1969)"],"e":"Câu hỏi ôn tập."},{"c":4,"q":"Quan điểm \"Đảng là đạo đức, là văn minh\" thể hiện điều gì ở Hồ Chí Minh?","o":["Sự phát triển sáng tạo lý luận về đảng cộng sản kiểu mới của Lênin","Sự tiếp thu sáng tạo lý luận về đảng chính trị kiểu mới của Lênin","Sự phát triển lý luận về đảng chính trị của chủ nghĩa Mác - Lênin","Sự tiếp thu lý luận về đảng cộng sản của chủ nghĩa Mác - Lênin"],"e":"Đề thi HK231. Đây là nội dung đặc sắc trong TTHCM về Đảng."},{"c":4,"q":"Theo Hồ Chí Minh, đạo đức của Đảng thể hiện ở mục đích hoạt động của Đảng là","o":["lãnh đạo giải phóng dân tộc, giải phóng xã hội, giải phóng giai cấp, giải phóng con người","giành và giữ chính quyền, bảo vệ quyền lợi riêng cho giai cấp công nhân","lãnh đạo xây dựng nền kinh tế phát triển cao, hiện đại như các nước tiên tiến","đấu tranh cho lợi ích của giai cấp vô sản và phong trào cộng sản quốc tế"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Đảng phải luôn trung thành với lợi ích toàn dân tộc vì","o":["Đảng không có mục đích riêng","Đảng là đại biểu của giai cấp công nhân","Đảng đứng trên dân tộc","Đảng là tổ chức tự thân"],"e":""},{"c":4,"q":"Hồ Chí Minh mô tả Đảng là Đảng của những người \"Giàu sang không thể quyến rũ, Nghèo khó không thể chuyển lay, Uy lực không thể khuất phục\" và là những người","o":["kiên quyết nhất, hăng hái nhất, trong sạch nhất, tận tâm tận lực phụng sự Tổ quốc","rất trung thành, rất hăng hái, được chọn lựa làm nhóm trung kiên lãnh đạo","giàu tình cảm cách mạng, có trình độ lý luận và chuyên môn cao","xuất thân từ giai cấp công nhân, có ý thức tổ chức kỷ luật cao"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Đảng phải \"sẵn sàng vui vẻ làm ..., làm tôi tớ trung thành của nhân dân\"","o":["trâu ngựa","người lãnh đạo","người cầm lái","công bộc"],"e":""},{"c":4,"q":"Nội dung nào thể hiện Đảng \"văn minh\" theo Hồ Chí Minh?","o":["Đảng tiêu biểu cho lương tâm, trí tuệ và danh dự của dân tộc","Đảng có số lượng đảng viên đông nhất","Đảng có trình độ khoa học kỹ thuật cao","Đảng chỉ đại diện lợi ích của giai cấp công nhân"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"Đảng không phải là tổ chức đứng trên dân tộc\", hoạt động trong khuôn khổ Hiến pháp và pháp luật là biểu hiện của một đảng","o":["văn minh","đạo đức","cách mạng","liêm chính"],"e":"Đề thi HK231."},{"c":4,"q":"Theo Hồ Chí Minh, Đảng văn minh phải có quan hệ quốc tế như thế nào?","o":["Trong sáng, vì lợi ích dân tộc mình và vì độc lập, hòa bình của các dân tộc khác","Chỉ quan hệ với các đảng cộng sản và công nhân trên thế giới","Phụ thuộc vào đường lối của Quốc tế Cộng sản và các đảng lớn","Không can dự vào các vấn đề quốc tế, chỉ lo việc trong nước"],"e":""},{"c":4,"q":"Trong tư tưởng Hồ Chí Minh, nếu Đảng không đạo đức, văn minh thì Đảng sẽ","o":["mất quyền lãnh đạo","mất lòng tin của dân","mất sức hấp dẫn lớn","mất sự vững mạnh"],"e":"Đề thi HK231."},{"c":4,"q":"Theo Hồ Chí Minh, nếu người đảng viên sa vào chủ nghĩa cá nhân, lòng dạ không trong sáng nữa sẽ dẫn đến","o":["làm tiêu tan mọi thành quả của cách mạng Việt Nam","mất đi lòng nhân ái, tình đồng chí yêu thương nhau","hoạt động của Đảng không còn phù hợp với dân tộc","đi chệch hướng đường lối cách mạng giải phóng dân tộc"],"e":"Đề thi HK222."},{"c":4,"q":"\"Một dân tộc, một đảng và mỗi con người, ngày hôm qua là vĩ đại, có sức hấp dẫn lớn, không nhất định hôm nay và ngày mai vẫn được mọi người yêu mến và ca ngợi, nếu lòng dạ không trong sáng nữa, nếu sa vào ...\"","o":["chủ nghĩa cá nhân","chủ nghĩa cơ hội","chủ nghĩa quan liêu","chủ nghĩa giáo điều"],"e":""},{"c":4,"q":"Nguyên tắc đầu tiên trong hoạt động của Đảng theo Hồ Chí Minh là","o":["lấy chủ nghĩa Mác - Lênin làm nền tảng tư tưởng, kim chỉ nam","tập trung dân chủ, tập thể lãnh đạo, cá nhân phụ trách","tự phê bình và phê bình thường xuyên như rửa mặt","kỷ luật nghiêm minh, tự giác từ trên xuống dưới"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"Đảng muốn vững thì phải có ... làm cốt\"","o":["chủ nghĩa","kỷ luật","đạo đức","cán bộ"],"e":"Đề HK241 (tham khảo)."},{"c":4,"q":"Theo Hồ Chí Minh, \"Đảng mà không có chủ nghĩa cũng như người không có ..., tàu không có bàn chỉ nam\"","o":["trí khôn","học vấn","của cải","sức mạnh"],"e":"Bài tập HK221."},{"c":4,"q":"Theo Hồ Chí Minh, khi vận dụng chủ nghĩa Mác - Lênin phải tránh điều gì?","o":["Giáo điều","Sáng tạo","Linh hoạt","Cụ thể hóa"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, tính dân chủ trong Đảng được thể hiện ở","o":["khơi dậy tinh thần trách nhiệm và tính tích cực chủ động của tất cả đảng viên","tất cả đảng viên đều được tự do thảo luận, tự do hành động theo ý mình","mỗi đảng viên, mỗi chi bộ đều ra sức làm tròn nhiệm vụ được giao","ý chí thống nhất, hành động thống nhất, tạo ra quyền phục tùng chân lý"],"e":"Đề thi HK222. Phương án cuối là biểu hiện của tập trung."},{"c":4,"q":"Theo Hồ Chí Minh, khi tất cả đảng viên thống nhất ý chí và hành động (tập trung) thì Đảng sẽ có","o":["sức mạnh","tập trung","kỷ cương","dân chủ"],"e":"Đề thi HK232."},{"c":4,"q":"Theo Hồ Chí Minh, khi đã thảo luận, bày tỏ ý kiến rồi đi đến tập trung thì quyền tự do của đảng viên trở thành","o":["quyền phục tùng chân lý","quyền tự do ngôn luận","quyền phục tùng cấp trên","quyền bảo lưu ý kiến"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, điều kiện tiên quyết khi thực hiện nguyên tắc tập trung dân chủ trong Đảng là","o":["tổ chức Đảng phải trong sạch, vững mạnh","kỷ luật nghiêm minh","mọi đảng viên phải có đạo đức cách mạng","thực hiện tốt tự phê bình và phê bình"],"e":"Đề thi HK231, HK232."},{"c":4,"q":"Luận đề của Hồ Chí Minh về nguyên tắc tập trung dân chủ là","o":["tập trung trên nền tảng dân chủ, dân chủ phải đi đến tập trung","dân chủ trên nền tảng tập trung, tập trung phải đi đến dân chủ","tập trung là chủ yếu, dân chủ là thứ yếu","dân chủ là mục tiêu, tập trung là phương tiện"],"e":""},{"c":4,"q":"Đối với nguyên tắc tập thể lãnh đạo, cá nhân phụ trách, có lúc Hồ Chí Minh coi","o":["tập thể lãnh đạo là dân chủ, cá nhân phụ trách là tập trung","tập thể lãnh đạo là tập trung, cá nhân phụ trách là dân chủ","tập thể lãnh đạo và cá nhân phụ trách đều là dân chủ","tập thể lãnh đạo và cá nhân phụ trách đều là tập trung"],"e":""},{"c":4,"q":"Hồ Chí Minh lưu ý hai điều cần tránh trong hoạt động của Đảng khi thực hiện tập thể lãnh đạo, cá nhân phụ trách là","o":["độc đoán, chuyên quyền, coi thường tập thể; dựa dẫm tập thể, không dám quyết đoán","quan liêu, mệnh lệnh, xa rời quần chúng; tham ô, lãng phí, xa hoa của công","chủ quan, duy ý chí, nóng vội; bảo thủ, trì trệ, ngại đổi mới","bè phái, cục bộ, địa phương chủ nghĩa; kiêu ngạo, tự mãn, tự cao tự đại"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, khi thực hiện nguyên tắc tập trung dân chủ, đảng viên cần phải tránh","o":["dựa dẫm tập thể, không dám quyết đoán","tư tưởng và hành động không nhất trí","không trung thực, không kiên quyết","phê bình sai người, phê bình sai việc"],"e":"Đề thi HK232."},{"c":4,"q":"Hồ Chí Minh coi tự phê bình và phê bình là việc làm thường xuyên, \"như mỗi ngày phải ...\"","o":["rửa mặt","ăn cơm","tập thể dục","đọc báo"],"e":"Đề HK241 (tham khảo)."},{"c":4,"q":"Trong Di chúc, Hồ Chí Minh viết: \"Trong Đảng thực hành dân chủ rộng rãi, thường xuyên và nghiêm chỉnh tự phê bình và phê bình là cách tốt nhất để ...\"","o":["củng cố và phát triển sự đoàn kết, thống nhất của Đảng","nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng","chống chủ nghĩa cá nhân trong cán bộ, đảng viên","làm cho Đảng luôn trong sạch, vững mạnh, văn minh"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, tự phê bình và phê bình là \"thang thuốc\" tốt nhất để","o":["làm cho phần tốt nảy nở như hoa mùa xuân và phần xấu bị mất dần đi","loại bỏ những đảng viên thoái hóa, biến chất ra khỏi Đảng","tăng cường kỷ luật sắt và sự thống nhất của Đảng","nâng cao trình độ lý luận chính trị cho đảng viên"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, sức mạnh của một đảng cộng sản bắt nguồn từ","o":["kỷ luật","số lượng đảng viên đông đảo","sự ủng hộ của quốc tế","tiềm lực kinh tế"],"e":"Đề HK241 (tham khảo): kỷ luật nghiêm minh, tự giác của đảng viên."},{"c":4,"q":"Theo Hồ Chí Minh, kỷ luật của Đảng là kỷ luật tự giác. Điều kiện để kỷ luật trong Đảng luôn nghiêm minh và bền lâu là","o":["lòng tự giác của đảng viên","lợi ích lâu dài của đảng viên","tính đoàn kết của đảng viên","sự kiểm tra của cấp trên"],"e":"Đề thi HK222."},{"c":4,"q":"Theo Hồ Chí Minh, \"Đảng phải giữ kỷ luật rất nghiêm từ trên xuống dưới. Kỷ luật này là ...\"","o":["tư tưởng phải nhất trí, hành động phải nhất trí","cấp dưới phục tùng cấp trên, toàn Đảng phục tùng Trung ương","thiểu số phục tùng đa số, cá nhân phục tùng tổ chức","đảng viên phục tùng mọi chỉ thị của bí thư chi bộ"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, đảng viên phải nghiêm chỉnh chấp hành điều gì của Đảng: \"Đảng đã
