,"đẩy mạnh cảm hóa","tăng cường giáo dục"],"e":"Quiz thầy PDA."},{"c":4,"q":"Theo Hồ Chí Minh, \"Đảng phải luôn luôn tẩy bỏ những phần tử hủ hóa ra ngoài\" sẽ giúp Đảng","o":["luôn luôn lớn mạnh cả về số lượng và chất lượng","tạo ra không khí dân chủ trong Đảng","cùng một ý chí, muôn người như một","giữ được tính kỷ luật sắt trong Đảng"],"e":"Đề thi HK222."},{"c":4,"q":"Theo Hồ Chí Minh, đoàn kết thống nhất trong Đảng trước hết được thể hiện ở sự đoàn kết của","o":["cấp ủy, những cán bộ lãnh đạo chủ chốt","tất cả mọi cán bộ, đảng viên","Ban Chấp hành Trung ương Đảng","Bộ Chính trị, Ban Bí thư Trung ương"],"e":"Đề thi HK222."},{"c":4,"q":"Theo Hồ Chí Minh, đoàn kết trong Đảng có vai trò","o":["là điều kiện để xây dựng khối đại đoàn kết toàn dân tộc","là kết quả của khối đại đoàn kết toàn dân tộc","chỉ có ý nghĩa nội bộ Đảng","là mục tiêu cuối cùng của công tác xây dựng Đảng"],"e":""},{"c":4,"q":"Theo Di chúc của Hồ Chí Minh, các đồng chí từ Trung ương đến các chi bộ cần phải giữ gìn sự đoàn kết nhất trí của Đảng như","o":["giữ gìn con ngươi của mắt mình","giữ gìn báu vật của dân tộc","giữ gìn sinh mạng của mình","giữ gìn ngọn cờ của Đảng"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"Một Đảng mà giấu giếm khuyết điểm của mình là một Đảng ...\"","o":["hỏng","yếu","lạc hậu","thoái hóa"],"e":"Quiz thầy PDA: Đảng sẽ \"hỏng\" khi che giấu những khuyết điểm của mình."},{"c":4,"q":"Theo Hồ Chí Minh, Đảng \"học hỏi quần chúng nhưng không ...\"","o":["theo đuôi quần chúng","tin tưởng quần chúng","lãnh đạo quần chúng","xa rời quần chúng"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, cách xa dân chúng, không liên hệ chặt chẽ với dân chúng thì cũng như","o":["lơ lửng giữa trời","cây không có gốc","sông không có nguồn","thuyền không có lái"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Đảng viên không được \"cứ ăn cỗ đi trước, lội nước đi sau\" mà phải coi trọng chữ nào trong quan hệ với dân?","o":["TÍN","NGHĨA","TRUNG","HIẾU"],"e":""},{"c":4,"q":"Câu \"Ngoài lợi ích của dân tộc, của Tổ quốc, thì Đảng không có lợi ích gì khác\" thể hiện điều gì?","o":["Đảng là đảng vì dân, vì nước","Đảng là một tổ chức tự thân","Đảng là tổ chức đứng trên dân tộc","Đảng chỉ vì lợi ích giai cấp công nhân"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"Đảng không phải làm quan, sai khiến quần chúng, mà phải làm ... cho quần chúng\"","o":["đầy tớ","người lãnh đạo","thầy giáo","người bảo vệ"],"e":""},{"c":4,"q":"Nguyên tắc \"Đoàn kết quốc tế\" trong hoạt động của Đảng xuất phát từ","o":["tính chất quốc tế của giai cấp công nhân","yêu cầu của Quốc tế Cộng sản","lợi ích kinh tế đối ngoại","truyền thống hòa hiếu của dân tộc"],"e":""},{"c":4,"q":"Yêu cầu đầu tiên Hồ Chí Minh đặt ra đối với đội ngũ cán bộ, đảng viên là","o":["phải tuyệt đối trung thành với Đảng","phải luôn luôn học tập nâng cao trình độ","phải có mối liên hệ mật thiết với nhân dân","phải luôn luôn năng động, sáng tạo"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, đảng viên phải kiên quyết hy sinh lợi ích của cá nhân khi lợi ích đó","o":["mâu thuẫn với lợi ích chung của Đảng","mâu thuẫn với lợi ích chung của dân","thống nhất với lợi ích chung của Đảng","thống nhất với lợi ích chung của dân"],"e":"Quiz thầy PDA."},{"c":4,"q":"Theo Hồ Chí Minh, một trong những biểu hiện về lòng tuyệt đối trung thành với Đảng của cán bộ, đảng viên là lúc nào cũng","o":["đặt lợi ích của Đảng (tức lợi ích dân tộc) lên trên lợi ích cá nhân","tôn trọng và phát huy quyền làm chủ của quần chúng nhân dân","ra sức tu dưỡng, rèn luyện, trau dồi đạo đức cách mạng","nghiêm chỉnh thực hiện đường lối, nghị quyết của Đảng"],"e":"Đề thi HK222."},{"c":4,"q":"Theo Hồ Chí Minh, cán bộ, đảng viên phải \"thắng không kiêu, bại không nản\" thuộc yêu cầu nào?","o":["Phải luôn luôn chịu trách nhiệm, năng động, sáng tạo","Phải tuyệt đối trung thành với Đảng","Phải luôn luôn học tập nâng cao trình độ","Phải luôn luôn phòng và chống các tiêu cực"],"e":""},{"c":4,"q":"Hồ Chí Minh gọi tham ô, lãng phí, quan liêu là","o":["giặc nội xâm","giặc ngoại xâm","giặc đói","giặc dốt"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, vì sao \"địch bên trong\" đáng sợ hơn địch bên ngoài?","o":["Vì nó phá hoại từ trong phá ra, là bạn đồng minh của địch bên ngoài","Vì nó có vũ khí và phương tiện hiện đại hơn kẻ địch bên ngoài","Vì nó được các thế lực quốc tế công khai ủng hộ, giúp đỡ","Vì nó đông đảo hơn và có tổ chức chặt chẽ hơn địch bên ngoài"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"Tham ô, lãng phí và bệnh quan liêu, dù cố ý hay không, cũng là ... của thực dân và phong kiến\"","o":["bạn đồng minh","công cụ","tay sai","nạn nhân"],"e":""},{"c":4,"q":"Hồ Chí Minh viết bài \"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân\" vào thời gian nào?","o":["3-2-1969","12-1958","10-1947","5-1969"],"e":""},{"c":4,"q":"Theo Di chúc, Đảng cần chăm lo giáo dục đạo đức cách mạng cho đoàn viên, thanh niên, đào tạo họ thành những người thừa kế xây dựng CNXH vừa","o":["\"hồng\" vừa \"chuyên\"","có đức vừa có tài","trung thành vừa sáng tạo","dũng cảm vừa thông minh"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, cán bộ là gốc của mọi công việc: \"muôn việc thành công hoặc thất bại đều do ...\"","o":["cán bộ tốt hoặc kém","đường lối đúng hoặc sai","nhân dân ủng hộ hoặc không","kỷ luật nghiêm hoặc lỏng lẻo"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, cán bộ là những người","o":["đem chính sách giải thích cho dân thi hành; đem tình hình của dân báo cáo cho Đảng","chỉ huy, ra lệnh cho nhân dân thực hiện mọi chủ trương của cấp trên","thay mặt nhân dân quyết định mọi việc lớn nhỏ ở địa phương","chỉ làm công tác chuyên môn, nghiệp vụ trong bộ máy nhà nước"],"e":""},{"c":4,"q":"Yêu cầu nào KHÔNG thuộc yêu cầu của Hồ Chí Minh trong công tác cán bộ?","o":["Chỉ sử dụng cán bộ trẻ, loại bỏ cán bộ cũ","Phải hiểu và đánh giá đúng cán bộ","Phải kết hợp cán bộ cấp trên phái đến và cán bộ địa phương","Phải chống bệnh địa phương cục bộ"],"e":"Hồ Chí Minh yêu cầu kết hợp cán bộ trẻ với cán bộ cũ."},{"c":4,"q":"Theo Hồ Chí Minh, Nhà nước Việt Nam mới là nhà nước dân chủ nhưng","o":["không phải \"Nhà nước toàn dân\" phi giai cấp; nó mang bản chất giai cấp công nhân","là nhà nước phi giai cấp, đứng trên mọi giai cấp trong xã hội","mang bản chất của giai cấp nông dân vì nông dân chiếm đa số","mang bản chất của toàn dân, hoàn toàn không mang tính giai cấp"],"e":""},{"c":4,"q":"Bản chất giai cấp công nhân của Nhà nước Việt Nam theo Hồ Chí Minh được thể hiện trước tiên ở","o":["Đảng Cộng sản Việt Nam giữ vị trí và vai trò cầm quyền","tính định hướng xã hội chủ nghĩa trong sự phát triển","nguyên tắc tập trung dân chủ","số lượng công nhân trong bộ máy nhà nước"],"e":""},{"c":4,"q":"Bản chất giai cấp công nhân của Nhà nước Việt Nam thể hiện trên mấy phương diện nào?","o":["Đảng cầm quyền; định hướng XHCN; nguyên tắc tập trung dân chủ","Đảng cầm quyền; Nhà nước pháp quyền; tam quyền phân lập","Do dân lập nên; vì dân phục vụ; dân kiểm soát quyền lực","Công nhân chiếm đa số Quốc hội; kinh tế quốc doanh; văn hóa XHCN"],"e":""},{"c":4,"q":"Lời nói đầu Hiến pháp năm nào khẳng định: \"Nhà nước của ta là Nhà nước dân chủ nhân dân, dựa trên nền tảng liên minh công nông, do giai cấp công nhân lãnh đạo\"?","o":["Hiến pháp năm 1959","Hiến pháp năm 1946","Hiến pháp năm 1980","Hiến pháp năm 1992"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Đảng cầm quyền (lãnh đạo Nhà nước) bằng những phương thức nào?","o":["Bằng đường lối, chủ trương; bằng tổ chức đảng và đảng viên trong bộ máy; bằng kiểm tra","Bằng mệnh lệnh hành chính trực tiếp đối với các cơ quan nhà nước","Bằng việc thay thế Nhà nước trực tiếp quản lý mọi mặt xã hội","Bằng nguyên tắc tập trung dân chủ và chế độ thủ trưởng"],"e":""},{"c":4,"q":"Chọn phương án SAI về phương thức lãnh đạo của Đảng đối với Nhà nước theo tư tưởng Hồ Chí Minh","o":["Đảng trực tiếp ra quyết định thay cho Nhà nước","Bằng đường lối, quan điểm, chủ trương","Bằng hoạt động của tổ chức đảng và đảng viên trong bộ máy nhà nước","Bằng công tác kiểm tra"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, nòng cốt của nhân dân trong Nhà nước dân chủ là","o":["liên minh công - nông - trí thức","giai cấp công nhân","liên minh công - nông","đội ngũ cán bộ, công chức"],"e":""},{"c":4,"q":"Nguyên tắc tổ chức và hoạt động cơ bản nhất của Nhà nước theo Hồ Chí Minh là","o":["tập trung dân chủ","tam quyền phân lập","pháp chế xã hội chủ nghĩa","hiệp thương dân chủ"],"e":"Đề HK241 (tham khảo)."},{"c":4,"q":"Theo tư tưởng Hồ Chí Minh, bản chất giai cấp công nhân thống nhất với tính nhân dân, tính dân tộc của Nhà nước thể hiện ở điểm nào?","o":["Nhà nước ra đời là kết quả đấu tranh lâu dài của nhiều thế hệ, của toàn dân tộc","Nhà nước do giai cấp công nhân tự mình lập nên sau Cách mạng Tháng Tám","Nhà nước chỉ đại diện và bảo vệ lợi ích của riêng giai cấp công nhân","Nhà nước hoạt động độc lập, không có sự lãnh đạo của Đảng Cộng sản"],"e":""},{"c":4,"q":"Nhà nước Việt Nam Dân chủ Cộng hòa là","o":["Nhà nước dân chủ nhân dân đầu tiên ở Đông Nam châu Á","Nhà nước XHCN đầu tiên ở châu Á","Nhà nước dân chủ nhân dân đầu tiên trên thế giới","Nhà nước công nông đầu tiên ở Đông Nam Á"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Nhà nước Việt Nam lấy quyền lợi của ... làm nền tảng","o":["dân tộc","giai cấp công nhân","Đảng","nhân dân lao động"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Nhà nước của nhân dân là nhà nước","o":["mà tất cả mọi quyền lực đều thuộc về nhân dân","do nhân dân trực tiếp bầu ra và tổ chức nên","phục vụ lợi ích và nguyện vọng của nhân dân","do Đảng Cộng sản lãnh đạo toàn diện"],"e":""},{"c":4,"q":"Theo quan niệm của Hồ Chí Minh, \"dân là chủ\" nghĩa là xác định điều gì?","o":["Vị thế của dân","Quyền hạn của dân","Nghĩa vụ của dân","Trách nhiệm của dân"],"e":"Quiz BKEL chương 4."},{"c":4,"q":"Theo quan niệm của Hồ Chí Minh, \"dân làm chủ\" nghĩa là nhấn mạnh điều gì?","o":["Quyền lợi và nghĩa vụ của nhân dân với tư cách là người chủ","Vị thế của nhân dân đối với quyền lực nhà nước","Địa vị cao nhất của nhân dân","Nhân dân là nguồn gốc quyền lực"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, nguồn gốc và lực lượng tạo ra quyền hành của xã hội là","o":["nhân dân","giai cấp lãnh đạo","công nhân","liên minh công - nông - trí"],"e":"Quiz BKEL chương 4."},{"c":4,"q":"Theo Hồ Chí Minh, hình thức dân chủ nào là \"hoàn bị nhất\"?","o":["Dân chủ trực tiếp","Dân chủ gián tiếp (đại diện)","Dân chủ tập trung","Dân chủ đại nghị"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, trong hình thức dân chủ gián tiếp, quyền lực nhà nước là","o":["\"thừa ủy quyền\" của nhân dân","quyền lực tự thân của Nhà nước","quyền lực của Đảng giao cho","quyền lực tuyệt đối không bị kiểm soát"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, chức vụ, quyền hạn của cán bộ trong bộ máy nhà nước là do","o":["nhân dân ủy thác, ủy quyền","Đảng phân công","cấp trên bổ nhiệm","năng lực bản thân mang lại"],"e":""},{"c":4,"q":"Hồ Chí Minh dùng những từ nào để chỉ vị trí của cán bộ nhà nước đối với nhân dân?","o":["Công bộc, đầy tớ","Quan cách mạng","Người lãnh đạo tối cao","Người cai trị"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, công bộc của dân nghĩa là","o":["gánh vác việc chung cho dân, chứ không phải để đè đầu dân","làm quan cách mạng để quản lý, cai trị dân","thay dân quyết định mọi việc lớn nhỏ của đất nước","phục vụ lợi ích của cấp trên và của tổ chức"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"Nước ta là nước dân chủ, địa vị cao nhất là dân... Trong bộ máy cách mạng, từ người quét nhà, nấu ăn cho đến Chủ tịch một nước đều là phân công làm ... cho dân\"","o":["đầy tớ","người lãnh đạo","công chức","quan cách mạng"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, nhân dân có quyền gì đối với đại biểu mà mình đã bầu ra?","o":["Quyền bãi miễn nếu đại biểu không xứng đáng với sự tín nhiệm","Không còn quyền gì sau khi đã bỏ phiếu bầu đại biểu","Chỉ có quyền góp ý kiến thông qua Mặt trận Tổ quốc","Chỉ có quyền khen thưởng khi đại biểu làm tốt"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"nếu Chính phủ làm hại dân thì dân có quyền ...\"","o":["đuổi Chính phủ","phê bình Chính phủ","kiện Chính phủ","góp ý với Chính phủ"],"e":""},{"c":4,"q":"Trong tư tưởng Hồ Chí Minh, đâu là công cụ quyền lực của nhân dân?","o":["Luật pháp (pháp luật)","Quân đội","Công an","Tài chính"],"e":"Quiz thầy PDA."},{"c":4,"q":"Theo Hồ Chí Minh, sự khác biệt căn bản của luật pháp trong Nhà nước Việt Nam mới với luật pháp của chế độ tư sản, phong kiến là","o":["phản ánh ý nguyện và bảo vệ quyền lợi của dân chúng","được ban hành nhiều hơn, đầy đủ hơn trước","nghiêm khắc hơn, xử phạt nặng hơn trước","do Quốc hội và Chính phủ cùng ban hành"],"e":""},{"c":4,"q":"Theo tư tưởng Hồ Chí Minh, Nhà nước do nhân dân trước hết là","o":["nhà nước do nhân dân lập nên, cử ra, tổ chức nên","nhà nước phục vụ lợi ích của nhân dân","nhà nước mà mọi quyền lực thuộc về nhân dân","nhà nước không có đặc quyền đặc lợi"],"e":""},{"c":4,"q":"Câu \"Nước ta là nước dân chủ, nghĩa là ... do nhân dân làm chủ\"","o":["nước nhà","chính quyền","Nhà nước","xã hội"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"nhân dân có quyền lợi làm chủ, thì phải có nghĩa vụ làm tròn bổn phận công dân, giữ đúng ...\"","o":["đạo đức công dân","trách nhiệm công dân","năng lực công dân","quyền hạn công dân"],"e":"Quiz thầy PDA."},{"c":4,"q":"Theo Hồ Chí Minh: \"Chúng ta là những người lao động làm chủ nước nhà. Muốn làm chủ được tốt, phải có ...\"","o":["năng lực làm chủ","quyền làm chủ","ý thức làm chủ","tinh thần làm chủ"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, Nhà nước vì nhân dân là nhà nước","o":["phục vụ lợi ích, nguyện vọng của nhân dân, không có đặc quyền đặc lợi","do nhân dân trực tiếp bầu ra và trực tiếp kiểm soát","mà mọi quyền lực trong xã hội đều thuộc về nhân dân","do nhân dân làm chủ, cử ra và tổ chức nên"],"e":""},{"c":4,"q":"Chọn phương án SAI: Theo tư tưởng Hồ Chí Minh, Nhà nước vì dân là nhà nước","o":["do dân làm chủ, tổ chức nên","trong sạch, không có đặc quyền đặc lợi","chăm lo mọi mặt đời sống nhân dân","phục vụ nhân dân, đem lại lợi ích cho dân"],"e":"Câu hỏi BKEL. \"Do dân tổ chức nên\" là nội dung Nhà nước do dân."},{"c":4,"q":"Theo Hồ Chí Minh, Nhà nước vì dân là nhà nước lấy lợi ích chính đáng của nhân dân làm","o":["mục tiêu","động lực","kế hoạch","đòn bẩy"],"e":"Câu hỏi BKEL."},{"c":4,"q":"Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là","o":["phải được lòng dân","phải có pháp luật nghiêm minh","phải có kinh tế phát triển","phải có bộ máy tinh gọn"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, để làm việc vì lợi ích toàn cục, lâu dài của nhân dân (đôi khi làm những việc \"mới xem qua như là hại đến dân\"), người cán bộ lãnh đạo phải","o":["vừa hiền lại vừa minh","cần, kiệm, liêm, chính","chí công vô tư","trung thành, tận tụy"],"e":"Quiz thầy PDA."},{"c":4,"q":"Trong bản Yêu sách của nhân dân An Nam (1919), Hồ Chí Minh đề nghị thay thế chế độ nào để hình thành nhà nước hợp hiến, hợp pháp?","o":["Thay thế chế độ ra các sắc lệnh bằng chế độ ra các đạo luật","Thay thế chế độ quân chủ bằng chế độ cộng hòa","Thay thế chế độ hành chính quan liêu","Thay thế chế độ tập trung bao cấp"],"e":"Quiz thầy PDA."},{"c":4,"q":"Chỉ một ngày sau khi đọc Tuyên ngôn Độc lập, trong phiên họp đầu tiên của Chính phủ lâm thời (3-9-1945), Hồ Chí Minh đề nghị","o":["tổ chức càng sớm càng hay cuộc Tổng tuyển cử với chế độ phổ thông đầu phiếu","mở ngay chiến dịch chống nạn mù chữ (diệt giặc dốt) trong toàn quốc","phát động \"Tuần lễ vàng\" để xây dựng quỹ độc lập cho Chính phủ","bãi bỏ ngay thuế thân và các thứ thuế vô lý của chế độ cũ"],"e":""},{"c":4,"q":"Cuộc Tổng tuyển cử đầu tiên bầu Quốc hội nước Việt Nam Dân chủ Cộng hòa được tổ chức vào ngày nào?","o":["6-1-1946","2-9-1945","2-3-1946","9-11-1946"],"e":""},{"c":4,"q":"Quốc hội khóa I họp phiên đầu tiên ngày 2-3-1946, Hồ Chí Minh được bầu làm","o":["Chủ tịch Chính phủ liên hiệp","Chủ tịch Quốc hội","Thủ tướng Chính phủ","Tổng Bí thư của Đảng"],"e":""},{"c":4,"q":"Ở cương vị Chủ tịch nước, Hồ Chí Minh đã hai lần tham gia lãnh đạo soạn thảo những bản Hiến pháp nào?","o":["Hiến pháp 1946 và Hiến pháp 1959","Hiến pháp 1946 và Hiến pháp 1980","Hiến pháp 1959 và Hiến pháp 1980","Hiến pháp 1959 và Hiến pháp 1992"],"e":""},{"c":4,"q":"Theo tư tưởng Hồ Chí Minh, Nhà nước quản lý xã hội quan trọng nhất là bằng","o":["Hiến pháp và pháp luật","đạo đức","mệnh lệnh hành chính","giáo dục"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, lẫn lộn giữa công và tội, \"thưởng có khi quá rộng, mà phạt thì không nghiêm\" thể hiện điều gì của pháp luật?","o":["Thiếu nghiêm minh","Thiếu công tâm","Thiếu khoan hồng","Thiếu răn đe"],"e":"Quiz thầy PDA."},{"c":4,"q":"Trong thư gửi Hội nghị tư pháp toàn quốc, Hồ Chí Minh yêu cầu cán bộ tư pháp phải nêu cao gương","o":["\"phụng công, thủ pháp, chí công, vô tư\"","\"cần, kiệm, liêm, chính\"","\"trung với nước, hiếu với dân\"","\"nói đi đôi với làm\""],"e":""},{"c":4,"q":"\"Pháp quyền nhân nghĩa\" trong tư tưởng Hồ Chí Minh trước hết là","o":["tôn trọng, bảo đảm đầy đủ các quyền con người, chăm lo lợi ích của mọi người","xử phạt thật nặng mọi hành vi vi phạm để răn đe toàn xã hội","dùng đạo đức thay thế hoàn toàn cho pháp luật trong quản lý","khoan hồng tuyệt đối với mọi tội phạm, không xử phạt ai"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, trong các quyền tự nhiên của con người, quyền cao nhất là","o":["quyền sống","quyền tự do","quyền bình đẳng","quyền mưu cầu hạnh phúc"],"e":""},{"c":4,"q":"Pháp luật trong Nhà nước pháp quyền nhân nghĩa theo Hồ Chí Minh có tính chất gì?","o":["Nhân văn, khuyến thiện, lấy giáo dục, cảm hóa làm căn bản","Hà khắc, nghiêm ngặt, lấy răn đe, trừng phạt làm chủ yếu","Chỉ bảo vệ lợi ích của Nhà nước và giai cấp lãnh đạo","Khoan hồng vô điều kiện, không phân biệt đúng sai"],"e":""},{"c":4,"q":"Ba nội dung của Nhà nước pháp quyền theo tư tưởng Hồ Chí Minh là","o":["Hợp hiến, hợp pháp; thượng tôn pháp luật; pháp quyền nhân nghĩa","Nhà nước của dân; Nhà nước do dân; Nhà nước vì dân","Nhà nước dân chủ; pháp quyền; trong sạch, vững mạnh","Quyền lập pháp; quyền hành pháp; quyền tư pháp"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, kiểm soát quyền lực nhà nước là","o":["tất yếu, vì người nắm quyền đều có thể trở nên lạm quyền","không cần thiết, vì quyền lực đã do chính dân ủy thác","chỉ cần thiết trong thời chiến, khi tình hình phức tạp","chỉ là việc riêng của các cơ quan thanh tra, kiểm tra"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, nguyên nhân dẫn đến tình trạng \"ngông nghênh, cậy thế, cậy quyền\" của cán bộ là","o":["khi nắm được chút quyền trong tay thì hay lạm dụng","do pháp luật chưa có tính răn đe đủ mạnh","do quán tính, thói quen có từ thời phong kiến","do trình độ học vấn của cán bộ còn thấp"],"e":"Quiz thầy PDA."},{"c":4,"q":"Theo Hồ Chí Minh, chủ thể có quyền và trách nhiệm kiểm soát quyền lực nhà nước trước hết là","o":["Đảng Cộng sản Việt Nam và nhân dân","Quốc hội và Hội đồng nhân dân","Tòa án nhân dân và Viện kiểm sát","Mặt trận Tổ quốc và các đoàn thể"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, để có thể kiểm soát quyền lực nhà nước có hiệu quả cần","o":["huy động sự giúp đỡ, giám sát của quần chúng nhân dân","chỉ dựa vào công tác thanh tra","chỉ nâng cao chất lượng kiểm tra nội bộ","tăng cường kiểm soát của nghị viện"],"e":"Quiz thầy PDA."},{"c":4,"q":"Theo Hồ Chí Minh, muốn kiểm soát có kết quả tốt cần hai điều kiện nào?","o":["Việc kiểm soát phải có hệ thống; người đi kiểm soát phải là người rất có uy tín","Kiểm soát phải bí mật; người kiểm soát phải có chức vụ cao","Kiểm soát phải thường xuyên; người kiểm soát phải là người ngoài Đảng","Kiểm soát phải theo pháp luật; người kiểm soát phải là cán bộ tư pháp"],"e":"\"Sửa đổi lối làm việc\". (Phần kiểm soát quyền lực ở GT trang 92-93 bị thiếu trong bản scan.)"},{"c":4,"q":"Hồ Chí Minh xác định \"căn bệnh mẹ\" sinh ra các tiêu cực trong bộ máy nhà nước là","o":["chủ nghĩa cá nhân","bệnh quan liêu","bệnh tham ô","bệnh hình thức"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, những căn bệnh nào trong bộ máy nhà nước được gọi là \"giặc nội xâm\"?","o":["Tham ô, lãng phí, quan liêu","Cậy thế, hủ hóa, tư túng","Trái phép, chia rẽ, kiêu ngạo","Đặc quyền, đặc lợi"],"e":"Đề HK241 (tham khảo): thứ \"giặc\" nguy hiểm hơn giặc ngoại xâm."},{"c":4,"q":"Thói cậy mình là người trong cơ quan chính quyền để cửa quyền, hách dịch với dân, lợi dụng chức quyền vơ vét, theo Hồ Chí Minh đó là căn bệnh gì?","o":["Đặc quyền, đặc lợi","Quan liêu","Tư túng","Kiêu ngạo"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, tiêu cực nào đều có trong hoạt động của bộ máy Nhà nước từ trung ương đến cơ sở?","o":["Quan liêu","Chia rẽ","Tham ô","Kiêu ngạo"],"e":"Bài tập HK212."},{"c":4,"q":"Theo Hồ Chí Minh, cán bộ, công chức sẽ bị xử tội tử hình khi phạm tội gì?","o":["Tham ô","Lãng phí","Quan liêu","Đặc lợi"],"e":"Bài tập HK212, Đề HK241 (tham khảo)."},{"c":4,"q":"Theo Hồ Chí Minh, trong hoạt động của Nhà nước, cán bộ, công chức phải tiết kiệm","o":["sức lao động, thời giờ, tiền của","giấy in, mực viết, máy móc","vật chất và tinh thần","sức lực và tiền của"],"e":"Bài tập HK212. Lãng phí là phung phí sức lao động, thời giờ, tiền của."},{"c":4,"q":"Theo Hồ Chí Minh, muốn trừ sạch tham ô, lãng phí thì trước hết phải tẩy sạch bệnh nào?","o":["Quan liêu","Chủ nghĩa cá nhân","Kiêu ngạo","Tư túng"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, \"bênh vực lớp này, chống lại lớp khác\" là biểu hiện của tiêu cực nào?","o":["Chia rẽ","Tư túng","Kiêu ngạo","Lợi ích nhóm"],"e":"Bài tập HK212, đề HK203."},{"c":4,"q":"Theo Hồ Chí Minh, nếu cán bộ, công chức có các biểu hiện tư túng, chia rẽ, kiêu ngạo trong công việc Nhà nước sẽ dẫn đến","o":["mất đoàn kết, gây rối cho công tác","sa vào chủ nghĩa cá nhân","tình trạng đặc quyền, đặc lợi càng nặng nề","tình trạng tham ô, lãng phí càng gia tăng"],"e":"Bài tập HK212, đề HK203."},{"c":4,"q":"Trong \"Thư gửi Ủy ban nhân dân các kỳ, tỉnh, huyện và làng\" (10-1945), Hồ Chí Minh chỉ ra những căn bệnh cần đề phòng trong hoạt động của Nhà nước là","o":["trái phép, cậy thế, hủ hóa, tư túng, chia rẽ, kiêu ngạo","lên mặt, hách dịch, bè phái, chia rẽ, địa phương cục bộ","lên mặt, hách dịch, tư túng, bè phái, kiêu ngạo, cục bộ","trái phép, lên mặt, tư túng, kiêu ngạo, bè phái, chia rẽ"],"e":"Bài tập HK212."},{"c":4,"q":"Theo Hồ Chí Minh, biện pháp căn bản và có ý nghĩa lâu dài để phòng, chống tiêu cực trong Nhà nước là","o":["nâng cao trình độ dân chủ trong xã hội, phát huy quyền làm chủ của nhân dân","nâng cao trình độ dân trí, học vấn, hiểu biết pháp luật của toàn xã hội","nâng cao trình độ văn hóa, lý luận chính trị cho cán bộ trong Đảng","nâng cao trình độ dân chủ trong nội bộ Đảng, mở rộng tự phê bình"],"e":"Quiz thầy PDA."},{"c":4,"q":"Theo Hồ Chí Minh, đối với những kẻ thoái hóa, biến chất, pháp luật phải","o":["\"thẳng tay trừng trị\", bất kể địa vị, nghề nghiệp","khoan hồng tuyệt đối để họ tự sửa chữa","xử lý nội bộ, không công khai ra ngoài","chỉ xử lý khi đã gây hậu quả nghiêm trọng"],"e":""},{"c":4,"q":"Câu thơ \"Bảy xin hiến pháp ban hành / Trăm điều phải có thần linh pháp quyền\" thể hiện điều gì trong phòng chống tiêu cực?","o":["Trong Nhà nước pháp quyền không có bất cứ vùng cấm nào","Pháp luật phải luôn khoan hồng với người phạm tội","Phải lấy đạo đức thay thế hoàn toàn pháp luật","Hiến pháp chỉ áp dụng cho nhân dân, không cho cán bộ"],"e":"Trích \"Việt Nam yêu cầu ca\"."},{"c":4,"q":"Theo Hồ Chí Minh, trong xử lý vi phạm, việc gì cũng xử phạt thì không đúng mà cần","o":["lấy giáo dục, cảm hóa làm chủ yếu","tăng nặng hình phạt để răn đe","chỉ nhắc nhở, tuyệt đối không xử phạt","giao cho nhân dân tự xử lý"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh: \"cán bộ ... cấp cao thì quyền to, cấp thấp thì quyền nhỏ. Dù to hay nhỏ, có quyền mà thiếu ... là có dịp đục khoét, có dịp ăn của đút, có dịp dĩ công vi tư\"","o":["lương tâm","trình độ","kỷ luật","kiểm soát"],"e":""},{"c":4,"q":"Theo Hồ Chí Minh, cán bộ giữ chức vụ càng cao thì","o":["trách nhiệm nêu gương càng lớn","quyền lợi càng nhiều","càng ít bị kiểm soát","càng được ưu tiên"],"e":""},{"c":4,"q":"Biện pháp nào KHÔNG thuộc hệ thống biện pháp phòng, chống tiêu cực trong Nhà nước của Hồ Chí Minh?","o":["Tập trung toàn bộ quyền lực vào một cá nhân để dễ kiểm soát","Nâng cao trình độ dân chủ trong xã hội","Pháp luật của Nhà nước, kỷ luật của Đảng phải nghiêm minh","Huy động sức mạnh của chủ nghĩa yêu nước v c":5,"q":"Theo Hồ Chí Minh, nguyên tắc hoạt động của Mặt trận dân tộc thống nhất là","o":["hiệp thương dân chủ","tập trung dân chủ","thiểu số phục tùng đa số","tự do, tự nguyện tuyệt đối"],"e":"Hiệp thương dân chủ: mọi vấn đề đem ra bàn bạc công khai để đi đến nhất trí, loại trừ áp đặt hoặc dân chủ hình thức."},{"c":5,"q":"Theo Hồ Chí Minh, đoàn kết trong Mặt trận phải là","o":["lâu dài, chặt chẽ, thật sự, chân thành, thân ái giúp đỡ nhau cùng tiến bộ","tạm thời, linh hoạt, chỉ nhằm đánh đổ kẻ thù chung trước mắt","rộng rãi về hình thức, không cần thống nhất về mục đích, lập trường","theo mệnh lệnh của Đảng, các thành viên phải tuyệt đối phục tùng"],"e":""},{"c":5,"q":"Phương châm Hồ Chí Minh nhấn mạnh để xử lý các điểm khác biệt giữa các thành viên trong Mặt trận là","o":["\"cầu đồng tồn dị\"","\"dĩ bất biến, ứng vạn biến\"","\"thêm bạn, bớt thù\"","\"lạt mềm buộc chặt\""],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, đoàn kết thực sự nghĩa là","o":["nhất trí mục đích và lập trường; vừa đoàn kết vừa đấu tranh, phê bình vì nước, vì dân","tránh mọi sự phê bình lẫn nhau để giữ hòa khí, không làm mất lòng nhau","tuyệt đối không có khác biệt nào về lợi ích, quan điểm giữa các thành viên","chỉ đoàn kết với những người cùng giai cấp, cùng lập trường chính trị"],"e":""},{"c":5,"q":"Trong tư tưởng Hồ Chí Minh, đoàn kết phải gắn liền với","o":["đấu tranh","thỏa hiệp","hy sinh","tiến bộ"],"e":"Quiz thầy PDA."},{"c":5,"q":"Tìm phương án SAI: Theo Hồ Chí Minh, đoàn kết thực sự được biểu hiện ở","o":["nền tảng liên minh công - nông - trí","nhất trí ở mục đích và lập trường","vừa đoàn kết vừa đấu tranh","phê bình trên lập trường vì nước, vì dân"],"e":"Đề thi HK222."},{"c":5,"q":"Theo Hồ Chí Minh, khối đại đoàn kết dân tộc chỉ có thể thực hiện bền chặt và lâu dài khi","o":["toàn dân có sự thống nhất cao độ về mục tiêu và lợi ích","toàn dân giác ngộ con đường cách mạng vô sản","toàn dân phát huy lòng yêu nước","toàn dân có sự lãnh đạo của Đảng"],"e":"Quiz thầy PDA."},{"c":5,"q":"Phương thức đầu tiên để xây dựng khối đại đoàn kết dân tộc theo Hồ Chí Minh là","o":["làm tốt công tác vận động quần chúng (dân vận)","thành lập đoàn thể, tổ chức quần chúng","tập hợp các đoàn thể vào Mặt trận","tăng cường sự lãnh đạo của Đảng"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, kết quả của việc làm tốt công tác giáo dục, tuyên truyền, hướng dẫn, giúp đỡ, vận động quần chúng là","o":["phát huy đầy đủ vai trò, trí tuệ, khả năng to lớn của quần chúng","mở rộng được khối đại đoàn kết trong Mặt trận","nâng cao lòng yêu nước và tinh thần đấu tranh của quần chúng","tạo ra sự đoàn kết lâu dài giữa các thành viên Mặt trận"],"e":"Đề thi HK222."},{"c":5,"q":"Theo Hồ Chí Minh, để giúp nhân dân tích cực, tự giác phấn đấu và cống hiến cho sự nghiệp cách mạng, Đảng cần phải","o":["làm tốt công tác dân vận","đẩy mạnh nền dân chủ","ra sức tập hợp nhân dân","tăng cường đại đoàn kết"],"e":"Đề thi HK231."},{"c":5,"q":"Theo Hồ Chí Minh, yêu cầu cần phải có của mọi phương pháp tiếp cận và vận động quần chúng là","o":["phù hợp với tâm tư, nguyện vọng của quần chúng","chấp hành theo đường lối của Đảng","đáp ứng được yêu cầu của thực tiễn cách mạng","thực hiện đúng chủ trương của Mặt trận"],"e":"Đề thi HK222."},{"c":5,"q":"Tìm phương án SAI: Theo Hồ Chí Minh, yếu tố quy định phương pháp tiếp cận và vận động quần chúng là","o":["đường lối cách mạng của Đảng","phong tục tập quán địa phương","thực tế trình độ dân trí, văn hóa","nguyện vọng của quần chúng"],"e":"Đề thi HK222."},{"c":5,"q":"Theo Hồ Chí Minh, khi vận động quần chúng \"cần phải chịu khó tìm đủ cách giải thích cho họ hiểu rằng: những việc đó là vì ... của họ mà phải làm\"","o":["ích lợi","trách nhiệm","nghĩa vụ","danh dự"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, tổ chức đoàn thể, tổ chức quần chúng là phương thức để","o":["tập hợp nhân dân một cách có hiệu quả","thực hiện vai trò lãnh đạo của Đảng","rèn luyện và dẫn dắt quần chúng","giác ngộ và giáo dục quần chúng"],"e":"Đề thi HK231, HK232 (xuất hiện 2 lần trong 1 đề!)."},{"c":5,"q":"Theo Hồ Chí Minh, các đoàn thể, tổ chức quần chúng có nhiệm vụ","o":["tuyên truyền, giáo dục, giác ngộ, vận động, tập hợp nhân dân tham gia cách mạng","thay thế Nhà nước trực tiếp quản lý mọi mặt của đời sống xã hội","lãnh đạo Mặt trận dân tộc thống nhất và các tổ chức chính trị khác","chỉ bảo vệ lợi ích riêng của các hội viên trong tổ chức mình"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, các đoàn thể nhân dân là","o":["tổ chức của dân, phấn đấu cho dân, bênh vực quyền của dân","cơ quan của Nhà nước, thực hiện chức năng quản lý xã hội","tổ chức trực thuộc Đảng, thay Đảng lãnh đạo quần chúng","tổ chức tự quản, không có liên quan gì đến chính quyền"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, các đoàn thể, tổ chức quần chúng và Mặt trận dân tộc thống nhất là","o":["sợi dây gắn kết Đảng với nhân dân","công cụ quyền lực của Nhà nước","lực lượng lãnh đạo xã hội","tổ chức đối lập với Đảng"],"e":""},{"c":5,"q":"Phương thức thứ ba xây dựng khối đại đoàn kết theo Hồ Chí Minh là","o":["tập hợp, đoàn kết các đoàn thể trong Mặt trận dân tộc thống nhất","làm tốt công tác vận động quần chúng (dân vận)","thành lập các đoàn thể phù hợp với từng đối tượng","xây dựng vững chắc liên minh công - nông - trí thức"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, trước khi đưa quần chúng ra đấu tranh, Đảng cần phải","o":["giác ngộ, tập hợp, huấn luyện họ","thuyết phục, đoàn kết, giác ngộ họ","tập hợp, đoàn kết, huấn luyện họ","giác ngộ, huấn luyện, đoàn kết họ"],"e":"Đề thi HK222. Đảng phải thuyết phục, giác ngộ, tập hợp, huấn luyện quần chúng rồi đưa quần chúng ra đấu tranh."},{"c":5,"q":"Theo Hồ Chí Minh, để thực hiện đại đoàn kết toàn dân tộc, không để sót một người dân nào, Đảng và Nhà nước cần khơi dậy yếu tố nào của mỗi người Việt Nam?","o":["Lòng yêu nước","Lòng hăng hái","Sự nhiệt tình","Lòng nhân đạo"],"e":"Quiz BKEL chương 5, đề HK203."},{"c":5,"q":"Chọn phương án đúng nhất: Theo tư tưởng Hồ Chí Minh, sức mạnh dân tộc Việt Nam là","o":["sức mạnh tổng hợp của các yếu tố vật chất và tinh thần (trước hết là chủ nghĩa yêu nước)","sức mạnh của giai cấp công nhân dưới sự lãnh đạo của Đảng","sức mạnh của liên minh công - nông - trí dưới sự lãnh đạo của Đảng","sức mạnh tổng hợp của các yếu tố nội sinh và ngoại sinh"],"e":"Quiz thầy PDA, bài tập HK221."},{"c":5,"q":"Theo Hồ Chí Minh, sức mạnh thời đại là","o":["sức mạnh của phong trào cách mạng thế giới, của chủ nghĩa Mác - Lênin","sức mạnh kinh tế, tài chính của các nước công nghiệp phát triển","sức mạnh quân sự, quốc phòng của Liên Xô và phe xã hội chủ nghĩa","sức mạnh của cuộc cách mạng khoa học - công nghệ hiện đại"],"e":""},{"c":5,"q":"Đoàn kết quốc tế theo Hồ Chí Minh nhằm mục đích gì?","o":["Kết hợp sức mạnh dân tộc với thời đại; cùng nhân dân thế giới thực hiện mục tiêu của thời đại","Chủ yếu để nhận viện trợ kinh tế, quân sự từ các nước xã hội chủ nghĩa","Để sức mạnh quốc tế thay thế cho sức mạnh dân tộc còn non yếu","Để mở rộng ảnh hưởng và lãnh thổ của Việt Nam ra khu vực"],"e":""},{"c":5,"q":"Mối quan hệ giữa đại đoàn kết toàn dân tộc và đoàn kết quốc tế theo Hồ Chí Minh là","o":["đại đoàn kết toàn dân tộc là cơ sở cho việc thực hiện đoàn kết quốc tế","đoàn kết quốc tế là cơ sở cho đại đoàn kết toàn dân tộc","hai vấn đề hoàn toàn tách biệt","đoàn kết quốc tế quan trọng hơn đại đoàn kết dân tộc"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, chủ nghĩa yêu nước chân chính phải gắn liền với","o":["chủ nghĩa quốc tế vô sản","chủ nghĩa dân tộc vị kỷ","chủ nghĩa sôvanh nước lớn","chủ nghĩa nhân đạo trừu tượng"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, để tăng cường đoàn kết quốc tế, các đảng cộng sản phải chống lại những khuynh hướng sai lầm nào?","o":["Chủ nghĩa cơ hội, chủ nghĩa vị kỷ dân tộc, chủ nghĩa sôvanh","Chủ nghĩa yêu nước, chủ nghĩa quốc tế, chủ nghĩa nhân đạo","Chủ nghĩa giáo điều, chủ nghĩa xét lại, chủ nghĩa Mác - Lênin","Chủ nghĩa nhân văn, chủ nghĩa dân tộc chân chính, chủ nghĩa hòa bình"],"e":""},{"c":5,"q":"Lực lượng đoàn kết quốc tế trong tư tưởng Hồ Chí Minh gồm","o":["phong trào cộng sản, công nhân; phong trào giải phóng dân tộc; phong trào hòa bình, dân chủ","chỉ các nước xã hội chủ nghĩa; các đảng cộng sản cầm quyền; Liên Xô, Trung Quốc","chỉ các dân tộc thuộc địa; các dân tộc phụ thuộc ở châu Á, châu Phi, Mỹ Latinh","các nước tư bản phát triển; các tổ chức tài chính quốc tế; các nước trung lập"],"e":""},{"c":5,"q":"Tinh thần \"bốn phương vô sản đều là anh em\" thể hiện chủ trương đoàn kết với lực lượng nào?","o":["Phong trào cộng sản và công nhân quốc tế","Phong trào giải phóng dân tộc","Phong trào hòa bình, dân chủ","Các nước láng giềng"],"e":""},{"c":5,"q":"Hồ Chí Minh đề nghị Quốc tế Cộng sản làm cho các dân tộc thuộc địa đoàn kết lại để đặt cơ sở cho một liên minh phương Đông tương lai. Khối liên minh này sẽ là","o":["một trong những cái cánh của cách mạng vô sản","lực lượng thay thế cách mạng vô sản chính quốc","tổ chức đối lập với Quốc tế Cộng sản","hình thức Mặt trận dân tộc thống nhất"],"e":""},{"c":5,"q":"Năm 1924, Hồ Chí Minh đưa ra quan điểm thành lập mặt trận nào chống chủ nghĩa đế quốc?","o":["Mặt trận thống nhất của nhân dân chính quốc và thuộc địa","Mặt trận nhân dân Á - Phi đoàn kết với Việt Nam","Mặt trận nhân dân ba nước Đông Dương chống Pháp","Mặt trận Việt Nam độc lập đồng minh (Việt Minh)"],"e":""},{"c":5,"q":"Hồ Chí Minh đã tham gia sáng lập tổ chức nào tại Trung Quốc - hình thức sơ khai của mặt trận thống nhất các dân tộc bị áp bức theo xu hướng vô sản?","o":["Hội Liên hiệp các dân tộc bị áp bức","Hội Liên hiệp thuộc địa","Hội Việt Nam Cách mạng Thanh niên","Mặt trận nhân dân Á - Phi"],"e":""},{"c":5,"q":"Tư tưởng đoàn kết của Hồ Chí Minh đã định hướng hình thành bốn tầng mặt trận. Tầng nào KHÔNG thuộc bốn tầng đó?","o":["Mặt trận Liên minh các nước tư bản tiến bộ","Mặt trận đại đoàn kết dân tộc","Mặt trận đoàn kết Việt Nam - Lào - Campuchia","Mặt trận nhân dân thế giới đoàn kết với Việt Nam chống đế quốc xâm lược"],"e":"Bốn tầng: đại đoàn kết dân tộc; Việt - Lào - Campuchia; nhân dân Á - Phi đoàn kết với Việt Nam; nhân dân thế giới đoàn kết với Việt Nam."},{"c":5,"q":"Theo Hồ Chí Minh, các dân tộc ... có độc lập thì nền hòa bình thế giới mới thực hiện","o":["châu Á","châu Phi","châu Âu","Mỹ Latinh"],"e":""},{"c":5,"q":"Nguyên tắc đoàn kết quốc tế theo Hồ Chí Minh là","o":["thống nhất mục tiêu và lợi ích, có lý, có tình; độc lập, tự chủ","đoàn kết vô điều kiện với mọi lực lượng trên thế giới","đoàn kết dựa vào và phụ thuộc vào các nước lớn","chỉ đoàn kết với các đảng cộng sản anh em"],"e":""},{"c":5,"q":"Đối với phong trào cộng sản và công nhân quốc tế, Hồ Chí Minh giương cao ngọn cờ","o":["độc lập dân tộc gắn liền với chủ nghĩa xã hội","hòa bình, chống chiến tranh xâm lược","độc lập, tự do, bình đẳng giữa các dân tộc","dân chủ, nhân quyền và tiến bộ xã hội"],"e":""},{"c":5,"q":"Đối với các dân tộc trên thế giới, Hồ Chí Minh giương cao ngọn cờ","o":["độc lập, tự do và quyền bình đẳng giữa các dân tộc","độc lập dân tộc gắn liền với chủ nghĩa xã hội","hòa bình, chống chiến tranh xâm lược","chủ nghĩa quốc tế vô sản"],"e":""},{"c":5,"q":"Đối với các lực lượng tiến bộ trên thế giới, Hồ Chí Minh giương cao ngọn cờ","o":["hòa bình, chống chiến tranh xâm lược","độc lập, tự do, bình đẳng giữa các dân tộc","độc lập dân tộc gắn liền với chủ nghĩa xã hội","chủ nghĩa quốc tế vô sản"],"e":""},{"c":5,"q":"Tháng 9-1947, trả lời nhà báo Mỹ S. Êli Mâysi, Hồ Chí Minh tuyên bố chính sách đối ngoại của Việt Nam là","o":["\"làm bạn với tất cả mọi nước dân chủ và không gây thù oán với một ai\"","\"Việt Nam muốn là bạn với tất cả các nước trong cộng đồng thế giới\"","\"Việt Nam sẵn sàng là bạn, là đối tác tin cậy của các nước\"","\"thêm bạn, bớt thù, hòa hiếu với các dân tộc lân bang\""],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, nền hòa bình mà Việt Nam theo đuổi là","o":["hòa bình trong độc lập, tự do, xây trên công bình và lý tưởng dân chủ","hòa bình bằng mọi giá, kể cả phải nhân nhượng về chủ quyền","hòa bình dưới sự bảo hộ, che chở của một nước lớn","hòa bình trừu tượng, không gắn với quyền dân tộc cơ bản"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, trong đoàn kết quốc tế, nhân tố nào giữ vai trò quyết định?","o":["Nội lực (nguồn lực nội sinh)","Ngoại lực","Viện trợ quốc tế","Sự công nhận của Liên hợp quốc"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, \"Muốn người ta giúp cho, thì trước mình phải ...\"","o":["tự giúp lấy mình đã","đoàn kết với người ta","có đường lối đúng","có thực lực mạnh"],"e":""},{"c":5,"q":"Trong đấu tranh giành chính quyền, Hồ Chí Minh chủ trương \"đem sức ta mà ...\"","o":["tự giải phóng cho ta","đánh đuổi quân thù","xây dựng đất nước","giành lấy độc lập"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, \"Một dân tộc không tự lực cánh sinh mà cứ ngồi chờ dân tộc khác giúp đỡ thì ...\"","o":["không xứng đáng được độc lập","sẽ mãi mãi nghèo nàn","sẽ bị các nước khác coi thường","không thể đoàn kết quốc tế"],"e":""},{"c":5,"q":"Trong quan hệ quốc tế, Hồ Chí Minh ví: \"thực lực là cái ..., ngoại giao là cái tiếng, ... có to tiếng mới lớn\"","o":["chiêng","trống","đàn","kèn"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh: \"Độc lập nghĩa là chúng tôi điều khiển lấy mọi công việc của chúng tôi, không có ...\"","o":["sự can thiệp ở ngoài vào","sự giúp đỡ của nước ngoài","sự lãnh đạo của Quốc tế Cộng sản","quan hệ với nước khác"],"e":""},{"c":5,"q":"Theo Hồ Chí Minh, trong quan hệ giữa các đảng thuộc phong trào cộng sản quốc tế thì","o":["dù lớn dù nhỏ đều độc lập, bình đẳng, đoàn kết giúp đỡ lẫn nhau","đảng lớn có quyền lãnh đạo, chỉ đạo các đảng nhỏ hơn","các đảng phải phục tùng tuyệt đối Quốc tế Cộng sản","các đảng hoạt động hoàn toàn riêng rẽ, không can thiệp nhau"],"e":""},{"c":5,"q":"Ngày 2-11-1993, Bộ Chính trị khóa VII ra Nghị quyết số 07/NQ-TW về vấn đề gì?","o":["Đại đoàn kết dân tộc và tăng cường Mặt trận dân tộc thống nhất","Một số vấn đề cấp bách về xây dựng, chỉnh đốn Đảng hiện nay","Xây dựng và phát triển nền văn hóa tiên tiến, đậm đà bản sắc","Đổi mới và kiện toàn hệ thống chính trị ở cơ sở"],"e":""},{"c":5,"q":"Đại hội XII (2016) khẳng định: \"Đại đoàn kết dân tộc là ... của cách mạng Việt Nam, là động lực và nguồn lực to lớn trong xây dựng và bảo vệ Tổ quốc\"","o":["đường lối chiến lược","nhiệm vụ trước mắt","sách lược lâu dài","mục tiêu cuối cùng"],"e":""},{"c":5,"q":"Quan điểm đối ngoại \"muốn là bạn\" với các nước được nêu tại Đại hội nào của Đảng?","o":["Đại hội VII","Đại hội VI","Đại hội VIII","Đại hội IX"],"e":"Tiến trình: \"muốn là bạn\" (ĐH VII) → \"sẵn sàng là bạn\" (ĐH VIII) → \"là bạn và đối tác tin cậy\" (ĐH IX)."},{"c":5,"q":"Quan điểm đối ngoại \"sẵn sàng là bạn\" với các nước được nêu tại Đại hội nào của Đảng?","o":["Đại hội VIII","Đại hội VI","Đại hội VII","Đại hội IX"],"e":""},{"c":5,"q":"Quan điểm \"là bạn và đối tác tin cậy\" được nêu tại Đại hội nào của Đảng?","o":["Đại hội IX","Đại hội VII","Đại hội VIII","Đại hội XII"],"e":""},{"c":5,"q":"Hiện nay, sức mạnh của khối đại đoàn kết toàn dân tộc phải là sức mạnh để","o":["chiến thắng nghèo nàn và lạc hậu","chiến thắng giặc ngoại xâm","chống lại các nước lớn","giành độc lập dân tộc"],"e":""},{"c":6,"q":"UNESCO ghi nhận Hồ Chí Minh là \"Anh hùng giải phóng dân tộc, Nhà văn hóa kiệt xuất Việt Nam\" trong Nghị quyết số nào?","o":["24C/18.6.5 (Khóa họp 24 Đại Hội đồng, 1987)","18C/4.351 (Khóa họp 18)","24C/18.5.6 (Khóa họp 25)","25C/18.6.5 (Khóa họp 25, 1989)"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, văn hóa phải sửa đổi được những thói xấu nào?","o":["Tham nhũng, lười biếng, phù hoa, xa xỉ","Quan liêu, mệnh lệnh, hách dịch","Tham ô, lãng phí, quan liêu","Kiêu ngạo, tự mãn, bè phái"],"e":""},{"c":6,"q":"Hồ Chí Minh có mấy cách tiếp cận chủ yếu về văn hóa?","o":["Bốn","Hai","Ba","Năm"],"e":""},{"c":6,"q":"Tìm phương án SAI: Hồ Chí Minh tiếp cận văn hóa từ góc độ","o":["đời sống vật chất của xã hội, thuộc cơ sở hạ tầng","đời sống tinh thần của xã hội, thuộc kiến trúc thượng tầng","phương thức sử dụng các công cụ sinh hoạt","tổng hợp mọi phương thức sinh hoạt của con người"],"e":"Đề thi HK222. Cách tiếp cận thứ ba (hẹp hơn): trường học, số người đi học, xóa mù chữ."},{"c":6,"q":"Hồ Chí Minh đưa ra quan niệm về văn hóa duy nhất theo nghĩa rộng (\"Vì lẽ sinh tồn cũng như mục đích của cuộc sống...\") trong bối cảnh nào?","o":["Tháng 8-1943, khi bị tù đày trong nhà lao của Tưởng Giới Thạch","Khi lãnh đạo nhân dân làm Cách mạng Tháng Tám","Trên cương vị Chủ tịch nước, Chủ tịch Đảng","Khi chuẩn bị thành lập Đảng Cộng sản Việt Nam"],"e":"Đề thi HK222. Lúc đó UNESCO chưa thành lập."},{"c":6,"q":"Theo quan niệm của Hồ Chí Minh năm 1943: \"Văn hóa là sự tổng hợp của mọi ... cùng với biểu hiện của nó mà loài người đã sản sinh ra nhằm thích ứng những nhu cầu đời sống và đòi hỏi của sự sinh tồn\"","o":["phương thức sinh hoạt","giá trị vật chất và tinh thần","sáng tạo nghệ thuật","công cụ lao động"],"e":""},{"c":6,"q":"Từ sau Cách mạng Tháng Tám, Hồ Chí Minh bàn đến văn hóa chủ yếu theo nghĩa nào?","o":["Nghĩa hẹp: đời sống tinh thần của xã hội, thuộc kiến trúc thượng tầng","Nghĩa rộng: tổng hợp mọi phương thức sinh hoạt của con người","Nghĩa hẹp hơn: trường học, số người đi học, xóa nạn mù chữ","Theo phương thức sử dụng các công cụ sinh hoạt hằng ngày"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, trong đời sống có bốn vấn đề phải được coi là quan trọng ngang nhau, đó là","o":["chính trị, kinh tế, văn hóa, xã hội","chính trị, quân sự, kinh tế, ngoại giao","kinh tế, văn hóa, giáo dục, y tế","chính trị, kinh tế, quốc phòng, an ninh"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, quan hệ giữa văn hóa với chính trị là","o":["giải phóng chính trị mở đường cho văn hóa; văn hóa phải ở trong chính trị","văn hóa quyết định chính trị; chính trị phải phục vụ văn hóa","văn hóa hoàn toàn độc lập, đứng ngoài chính trị","chính trị và văn hóa không có tác động qua lại"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, quan hệ giữa văn hóa với kinh tế là","o":["văn hóa là kiến trúc thượng tầng, nhưng phải ở trong kinh tế, tác động trở lại kinh tế","văn hóa hoàn toàn phụ thuộc vào kinh tế, không có tác động trở lại","văn hóa quyết định sự phát triển của kinh tế và cơ sở hạ tầng","văn hóa và kinh tế là hai lĩnh vực không có liên quan đến nhau"],"e":""},{"c":6,"q":"\"Xã hội thế nào, văn nghệ thế ấy\" thể hiện mối quan hệ nào trong tư tưởng Hồ Chí Minh?","o":["Văn hóa với xã hội","Văn hóa với kinh tế","Văn hóa với chính trị","Văn hóa với đạo đức"],"e":""},{"c":6,"q":"Bản sắc văn hóa dân tộc về mặt nội dung theo Hồ Chí Minh là","o":["lòng yêu nước, thương nòi; tinh thần độc lập, tự cường","ngôn ngữ, phong tục, tập quán, lễ hội truyền thống","cách cảm, cách nghĩ và lối ứng xử của người Việt","các di tích lịch sử, danh lam thắng cảnh, văn hóa"],"e":""},{"c":6,"q":"Bản sắc văn hóa dân tộc về mặt hình thức (cốt cách văn hóa dân tộc) biểu hiện ở","o":["ngôn ngữ, phong tục, tập quán, lễ hội, cách cảm và nghĩ","lòng yêu nước, thương nòi, tinh thần đoàn kết","tinh thần độc lập, tự cường, tự lực của dân tộc","tinh thần tự tôn dân tộc và ý chí bất khuất"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, đồng thời với việc chăm lo cốt cách dân tộc, nền văn hóa Việt Nam cần phải","o":["triệt để tẩy trừ mọi di hại thuộc địa","thúc đẩy sản xuất phát triển kinh tế","tiếp thu tinh hoa văn hóa nhân loại","xây dựng tinh thần xã hội chủ nghĩa"],"e":"Đề thi HK222."},{"c":6,"q":"Theo Hồ Chí Minh, \"càng thấm nhuần chủ nghĩa Mác - Lênin càng phải coi trọng ...\"","o":["truyền thống tốt đẹp của cha ông","văn hóa phương Tây hiện đại","văn hóa Xôviết tiên tiến","khoa học kỹ thuật thế giới"],"e":""},{"c":6,"q":"Theo giáo trình, quy luật của văn hóa là","o":["tiếp biến văn hóa","đồng hóa văn hóa","bảo tồn nguyên vẹn","xóa bỏ văn hóa cũ"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, mục đích tiếp thu văn hóa nhân loại là","o":["làm giàu cho văn hóa Việt Nam, hợp với tinh thần dân chủ","thay thế dần văn hóa dân tộc bằng văn hóa tiến bộ","hội nhập hoàn toàn với văn hóa phương Tây hiện đại","bắt chước mô hình văn hóa Xôviết tiên tiến"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, tiêu chí tiếp thu văn hóa nhân loại là","o":["có cái gì hay, cái gì tốt là ta học lấy","chỉ tiếp thu văn hóa các nước XHCN","chỉ tiếp thu văn hóa phương Đông","tiếp thu toàn bộ, không chọn lọc"],"e":""},{"c":6,"q":"Trong mối quan hệ giữa giữ gìn cốt cách văn hóa dân tộc và tiếp thu văn hóa nhân loại, Hồ Chí Minh chủ trương","o":["lấy văn hóa dân tộc làm gốc để tiếp thu văn hóa nhân loại","lấy văn hóa nhân loại làm gốc để cải tạo văn hóa dân tộc","coi trọng ngang nhau, không bên nào là gốc","chỉ giữ gìn văn hóa dân tộc, không tiếp thu bên ngoài"],"e":""},{"c":6,"q":"Trong trao đổi với một nhà văn Liên Xô, Hồ Chí Minh nhấn mạnh khi mở rộng kiến thức về văn hóa thế giới cần tránh nguy cơ","o":["trở thành kẻ bắt chước","đánh mất ngôn ngữ dân tộc","bị đồng hóa về chính trị","xa rời chủ nghĩa Mác - Lênin"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, văn hóa là mục tiêu, nhìn một cách tổng quát là","o":["quyền sống, sung sướng, tự do, mưu cầu hạnh phúc; khát vọng chân, thiện, mỹ","phát triển kinh tế cao, đời sống vật chất đầy đủ, dư thừa","xóa nạn mù chữ cho toàn dân, ai cũng biết đọc biết viết","xây dựng nhiều công trình văn hóa, nghệ thuật hiện đại"],"e":""},{"c":6,"q":"Trong tư tưởng Hồ Chí Minh, văn hóa là mục tiêu được thể hiện ở","o":["khát vọng của nhân dân về các giá trị chân, thiện, mỹ","giúp con người hiểu biết quy luật phát triển của xã hội","nâng cao lòng yêu nước, lý tưởng cách mạng","lãnh đạo nhân dân thực hiện độc lập, tự cường, tự chủ"],"e":"Đề thi HK222. Ba phương án còn lại là biểu hiện văn hóa là động lực."},{"c":6,"q":"Hồ Chí Minh đặt cơ sở cho một xã hội phát triển bền vững với ba trụ cột nào?","o":["Bền vững về kinh tế, xã hội và môi trường","Bền vững về chính trị, kinh tế, văn hóa","Bền vững về dân số, tài nguyên, môi trường","Bền vững về quốc phòng, an ninh, đối ngoại"],"e":""},{"c":6,"q":"Trong các động lực văn hóa, động lực có ý nghĩa \"soi đường cho quốc dân đi\", lãnh đạo quốc dân thực hiện độc lập, tự cường, tự chủ là","o":["văn hóa chính trị","văn hóa văn nghệ","văn hóa giáo dục","văn hóa pháp luật"],"e":""},{"c":6,"q":"Văn hóa văn nghệ là động lực vì nó góp phần","o":["nâng cao lòng yêu nước, lý tưởng, tình cảm cách mạng, niềm tin thắng lợi","diệt giặc dốt, xóa mù chữ, giúp con người hiểu quy luật xã hội","bảo đảm dân chủ, trật tự, kỷ cương, phép nước trong xã hội","nâng cao phẩm giá, phong cách lành mạnh, hướng tới chân thiện mỹ"],"e":""},{"c":6,"q":"Với sứ mệnh \"trồng người\", văn hóa nào đào tạo con người mới, cán bộ mới, nguồn nhân lực chất lượng cao?","o":["Văn hóa giáo dục","Văn hóa chính trị","Văn hóa văn nghệ","Văn hóa pháp luật"],"e":""},{"c":6,"q":"Văn hóa nào bảo đảm dân chủ, trật tự, kỷ cương, phép nước?","o":["Văn hóa pháp luật","Văn hóa chính trị","Văn hóa đạo đức","Văn hóa giáo dục"],"e":""},{"c":6,"q":"Hồ Chí Minh đã ví văn hóa - văn nghệ là","o":["một mặt trận","vũ khí sắc bén","đỉnh cao của văn hóa","đời sống tinh thần"],"e":"Quiz BKEL chương 6."},{"c":6,"q":"Nói \"mặt trận văn hóa\" là nói đến","o":["cuộc đấu tranh cách mạng trên lĩnh vực văn hóa - tư tưởng, cam go, quyết liệt","việc dùng hoạt động văn hóa thay thế cho đấu tranh quân sự","hoạt động văn nghệ phục vụ bộ đội ngoài mặt trận","việc xây dựng các nhà văn hóa, thư viện ở cơ sở"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, anh chị em văn nghệ sĩ là","o":["chiến sĩ trên mặt trận văn hóa","người phục vụ giải trí","người đứng ngoài chính trị","cán bộ quản lý văn hóa"],"e":""},{"c":6,"q":"Để làm tròn nhiệm vụ mà cách mạng giao phó, Hồ Chí Minh yêu cầu chiến sĩ nghệ thuật phải có","o":["lập trường tư tưởng vững vàng","tinh thần lạc quan cách mạng","trình độ chuyên môn cao","vốn sống phong phú"],"e":"Đề thi HK222. \"Ngòi bút là vũ khí sắc bén trong sự nghiệp phò chính trừ tà\"."},{"c":6,"q":"Theo Hồ Chí Minh, ngòi bút của văn nghệ sĩ là","o":["vũ khí sắc bén để \"phò chính trừ tà\"","công cụ để kiếm sống và nuôi gia đình","phương tiện giải trí cho quần chúng","một mặt trận độc lập với chính trị"],"e":""},{"c":6,"q":"\"Chất thép\" của văn nghệ theo Hồ Chí Minh gắn với tinh thần nào?","o":["\"Kháng chiến hóa văn hóa, văn hóa hóa kháng chiến\"","\"Văn hóa soi đường cho quốc dân đi\"","\"Dân tộc, khoa học, đại chúng\"","\"Phò chính trừ tà\""],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, văn hóa phục vụ quần chúng thì viết phải trả lời các câu hỏi nào?","o":["Viết cho ai? Mục đích viết? Lấy tài liệu đâu? Cách viết thế nào?","Viết gì? Viết khi nào? Viết ở đâu? Viết bao nhiêu trang?","Viết cho ai? Viết bao nhiêu? Viết để được thưởng gì?","Viết gì? Ai sẽ đọc? Ai sẽ duyệt? Đăng báo nào?"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, văn hóa phục vụ quần chúng phải","o":["từ trong quần chúng ra, về sâu trong quần chúng","từ lãnh đạo xuống quần chúng, theo chỉ thị cấp trên","từ nước ngoài về trong nước, học tập kinh nghiệm","từ thành thị về nông thôn, từ đồng bằng lên miền núi"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, quần chúng nhân dân có vai trò gì đối với văn hóa văn nghệ?","o":["Sáng tác hay, cung cấp tư liệu, thẩm định và hưởng thụ các giá trị văn hóa","Chỉ là người hưởng thụ các sản phẩm văn hóa do nghệ sĩ tạo ra","Chỉ là đối tượng để tuyên truyền, giáo dục bằng văn nghệ","Không có vai trò đáng kể vì trình độ văn hóa còn thấp"],"e":""},{"c":6,"q":"Trước Cách mạng Tháng Tám (8-1943), Hồ Chí Minh đề ra năm nội dung xây dựng nền văn hóa dân tộc. Nội dung nào sau đây thuộc năm nội dung đó?","o":["Xây dựng tâm lý","Xây dựng lối sống","Xây dựng nếp sống","Xây dựng đạo đức"],"e":"Câu hỏi BKEL. Năm nội dung: tâm lý, luân lý, xã hội, chính trị, kinh tế."},{"c":6,"q":"Trong năm nội dung xây dựng nền văn hóa dân tộc (1943), \"Xây dựng luân lý\" là","o":["biết hy sinh mình, làm lợi cho quần chúng","tinh thần độc lập tự cường","mọi sự nghiệp liên quan đến phúc lợi của nhân dân","dân quyền"],"e":""},{"c":6,"q":"Trong năm nội dung xây dựng nền văn hóa dân tộc (1943), \"Xây dựng chính trị\" là","o":["dân quyền","tinh thần độc lập tự cường","biết hy sinh mình, làm lợi cho quần chúng","phúc lợi của nhân dân"],"e":""},{"c":6,"q":"Trong năm nội dung xây dựng nền văn hóa dân tộc (1943), \"Xây dựng xã hội\" là","o":["mọi sự nghiệp liên quan đến phúc lợi của nhân dân","thực hiện quyền dân chủ, dân quyền cho nhân dân","xây dựng tinh thần độc lập, tự cường dân tộc","biết hy sinh mình, làm lợi cho quần chúng"],"e":""},{"c":6,"q":"Trong kháng chiến chống thực dân Pháp, phương châm xây dựng nền văn hóa mới (khẳng định lại Đề cương văn hóa Việt Nam 1943) là nền văn hóa có tính chất","o":["dân tộc, khoa học, đại chúng","dân tộc, cách mạng, nhân văn","tiên tiến, đậm đà bản sắc dân tộc","xã hội chủ nghĩa về nội dung, dân tộc về hình thức"],"e":""},{"c":6,"q":"Theo tư tưởng Hồ Chí Minh, nội dung nào chỉ ra tính chất của nền văn hóa mới?","o":["Tính dân tộc","Tính giai cấp","Tính thời đại","Tính Đảng"],"e":"Quiz BKEL chương 6. Ba tính chất: dân tộc, khoa học, đại chúng."},{"c":6,"q":"Trong thời kỳ xây dựng CNXH ở miền Bắc, Hồ Chí Minh chủ trương xây dựng nền văn hóa có","o":["nội dung xã hội chủ nghĩa và tính chất dân tộc","nội dung dân tộc và hình thức XHCN","tính chất dân tộc, khoa học, đại chúng","tính chất tiên tiến, hiện đại"],"e":""},{"c":6,"q":"Tóm lại, quan điểm của Hồ Chí Minh về nền văn hóa mới Việt Nam là một nền văn hóa","o":["toàn diện, giữ cốt cách dân tộc, khoa học, tiến bộ, nhân văn","thuần túy dân tộc, không tiếp thu yếu tố nước ngoài","tiếp thu hoàn toàn văn hóa nước ngoài để hiện đại hóa","chỉ phục vụ nhiệm vụ chính trị trước mắt"],"e":""},{"c":6,"q":"Hồ Chí Minh đã phê phán nền giáo dục tầm chương, trích cú, kinh viện, xa rời thực tế, bất bình đẳng, trọng nam khinh nữ. Đó là nền giáo dục nào?","o":["Nền giáo dục phong kiến","Nền giáo dục thực dân","Nền giáo dục phong kiến, thực dân","Nền giáo dục thuộc địa"],"e":"Quiz BKEL chương 6."},{"c":6,"q":"Hồ Chí Minh đã phê phán nền giáo dục ngu dân, đồi bại, xảo trá, nguy hiểm hơn cả sự dốt nát. Đó là nền giáo dục nào?","o":["Nền giáo dục thực dân","Nền giáo dục phong kiến","Nền giáo dục phong kiến, thực dân","Nền giáo dục dân chủ"],"e":"Quiz BKEL chương 6."},{"c":6,"q":"Theo Hồ Chí Minh, \"Một dân tộc dốt là một dân tộc ...\"","o":["yếu","lạc hậu","chậm phát triển","nghèo"],"e":"Câu hỏi hội thi tìm hiểu TTHCM."},{"c":6,"q":"Theo Hồ Chí Minh, đạo đức có vai trò như thế nào đối với người cách mạng?","o":["Là gốc, là nền tảng, là tiêu chuẩn hàng đầu của người cách mạng","Là yếu tố phụ, đứng sau tài năng và trình độ chuyên môn","Là điều kiện đủ để người cách mạng thành công","Chỉ thật sự quan trọng đối với cán bộ lãnh đạo cấp cao"],"e":""},{"c":6,"q":"Điền từ: \"Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có ..., không có ... thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\"","o":["đạo đức","đạo đức cách mạng","trí tuệ","nhân cách"],"e":"Quiz BKEL chương 6. Trích Sửa đổi lối làm việc (1947)."},{"c":6,"q":"Điền từ: \"Sức có mạnh mới gánh được nặng và đi được xa. Người cách mạng phải có ... làm nền tảng, mới hoàn thành được nhiệm vụ cách mạng vẻ vang\"","o":["đạo đức cách mạng","đạo đức","tài năng","ý chí"],"e":"Trích tác phẩm Đạo đức cách mạng (1958)."},{"c":6,"q":"Theo Hồ Chí Minh: \"Trước mặt quần chúng, không phải ta cứ viết lên trán chữ ... mà ta được họ yêu mến. Quần chúng chỉ quý mến những người có tư cách, đạo đức\"","o":["\"cộng sản\"","\"cán bộ\"","\"đảng viên\"","\"cách mạng\""],"e":""},{"c":6,"q":"Trong bài \"Người cán bộ cách mạng\" (1955), Hồ Chí Minh viết: \"Mọi việc thành hay là bại, chủ chốt là do cán bộ có thấm nhuần ... hay là không\"","o":["đạo đức cách mạng","chủ nghĩa Mác - Lênin","đường lối của Đảng","tinh thần dân chủ"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh: \"Việc nước lấy Đoàn thể làm cốt cán. Việc Đoàn thể lấy cán bộ làm cốt cán. Cán bộ lấy ... làm cốt cán\"","o":["đạo đức","tài năng","trí tuệ","kỷ luật"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, người cách mạng nếu không có đạo đức cách mạng thì có tài cũng","o":["vô dụng","hủ hóa","khó khăn","sợ sệt"],"e":"Đề thi HK232. \"Dạy cũng như học phải biết chú trọng cả tài lẫn đức...\""},{"c":6,"q":"Theo Hồ Chí Minh, trong mối quan hệ giữa đức và tài thì","o":["đức là gốc, tài là phương tiện; đức và tài phải thống nhất","tài quan trọng hơn đức vì tài quyết định hiệu quả công việc","đức và tài là hai mặt tách rời, có thể chỉ cần một trong hai","chỉ cần có đức là đủ, không cần quan tâm đến tài năng"],"e":""},{"c":6,"q":"Hoàn thiện quan điểm Hồ Chí Minh: \"đức là gốc của tài, hồng là gốc của chuyên, phẩm chất là gốc của ...\"","o":["năng lực","trí tuệ","hiệu quả","thành công"],"e":""},{"c":6,"q":"Trong bài Đạo đức cách mạng (1955), Hồ Chí Minh viết: \"Tuy năng lực và công việc của mỗi người khác nhau, người làm việc to, người làm việc nhỏ; nhưng ai giữ được đạo đức đều là người ...\"","o":["cao thượng","vĩ đại","có ích","tốt"],"e":""},{"c":6,"q":"Hồ Chí Minh quan tâm giáo dục toàn diện cho học sinh, sinh viên những mặt nào?","o":["Đức, Trí, Thể, Mỹ (trong đó đức là gốc)","Đức, Tài, Trí, Dũng","Nhân, Nghĩa, Lễ, Trí","Học, Hành, Lao động, Rèn luyện"],"e":""},{"c":6,"q":"Theo tư tưởng Hồ Chí Minh, sức hấp dẫn của chủ nghĩa xã hội trước hết là ở","o":["giá trị đạo đức cao đẹp, phẩm chất của người cộng sản ưu tú","mức sống vật chất dồi dào, đầy đủ của người dân","tư tưởng được tự do, giải phóng khỏi mọi ràng buộc","lý tưởng sống cao xa, tốt đẹp của chủ nghĩa cộng sản"],"e":"Câu hỏi BKEL."},{"c":6,"q":"Với Hồ Chí Minh, phẩm chất đạo đức bao trùm quan trọng nhất và chi phối các phẩm chất khác là","o":["trung với nước, hiếu với dân","cần, kiệm, liêm, chính, chí công vô tư","thương yêu con người, sống có tình có nghĩa","tinh thần quốc tế trong sáng"],"e":"Đề thi HK232."},{"c":6,"q":"\"Trung với vua, hiếu với cha mẹ\" được Hồ Chí Minh chuyển thành \"Trung với nước, hiếu với dân\" đã tạo nên","o":["một cuộc cách mạng sâu sắc trong lĩnh vực đạo đức","sự kế thừa nguyên vẹn đạo đức phong kiến","sự phủ định hoàn toàn đạo đức truyền thống","một khẩu hiệu tuyên truyền"],"e":""},{"c":6,"q":"Điền từ: \"Đạo đức cũ như người đầu ngược xuống đất chân chổng lên trời. Đạo đức mới như người hai chân ... dưới đất, đầu ngửng lên trời\"","o":["đứng vững được","bước đi","bám chặt","chạy nhanh"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Đạo đức, ngày trước thì chỉ trung với vua, hiếu với cha mẹ. Ngày nay, thời đại mới, đạo đức cũng phải mới. Phải ... với nước. Phải ... với toàn dân, với đồng bào\"","o":["trung / hiếu","hiếu / trung","yêu / thương","trung thành / kính trọng"],"e":""},{"c":6,"q":"Trong Thư gửi thanh niên (1965), Hồ Chí Minh viết: \"Phải luôn luôn nâng cao chí khí cách mạng: trung với nước, hiếu với dân, nhiệm vụ nào cũng hoàn thành, khó khăn nào cũng vượt qua, ...\"","o":["kẻ thù nào cũng đánh thắng","việc gì cũng làm được","ở đâu cũng xung phong","lúc nào cũng sẵn sàng"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"hiếu với dân\" có nghĩa là","o":["thương dân, tin dân, kính trọng dân, hết lòng phục vụ nhân dân","phục tùng mọi ý kiến, mọi yêu cầu của nhân dân","chăm lo, phụng dưỡng cha mẹ, ông bà trong gia đình","ra lệnh, chỉ đạo để nhân dân làm theo đường lối"],"e":""},{"c":6,"q":"Theo tư tưởng Hồ Chí Minh, phẩm chất đạo đức gắn liền với hoạt động hằng ngày của mỗi người, là nội dung cốt lõi của đạo đức cách mạng là","o":["cần, kiệm, liêm, chính, chí công vô tư","trung với nước, hiếu với dân","thương yêu con người, sống có tình nghĩa","tinh thần quốc tế trong sáng"],"e":"Câu hỏi BKEL."},{"c":6,"q":"Phẩm chất cần, kiệm, liêm, chính, chí công vô tư được Hồ Chí Minh đề cập trong các tác phẩm từ","o":["Đường cách mệnh đến Di chúc","Bản án chế độ thực dân Pháp đến Đạo đức cách mạng","Sửa đổi lối làm việc đến Di chúc","Tuyên ngôn Độc lập đến Di chúc"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Cần\" là","o":["siêng năng, chăm chỉ, cố gắng dẻo dai, lao động có kế hoạch","tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi","trong sạch, không tham lam địa vị, tiền tài","thẳng thắn, đứng đắn, không tà, không gian dối"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Kiệm\" là","o":["tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi","siêng năng, chăm chỉ, cố gắng dẻo dai, có kế hoạch","trong sạch, không tham lam địa vị, tiền tài","không tà, thẳng thắn, đứng đắn trong mọi việc"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, việc đáng tiêu mà không tiêu là","o":["bủn xỉn, chứ không phải là kiệm","tiết kiệm đúng đắn","liêm khiết","chí công vô tư"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Cần với kiệm phải đi đôi với nhau, như ...\"","o":["hai chân của con người","hai bàn tay","hai mắt","hai cánh chim"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Liêm\" là","o":["trong sạch, không tham lam địa vị, tiền tài, sung sướng","siêng năng, chăm chỉ, cố gắng dẻo dai, có kế hoạch","tiết kiệm, không xa xỉ, không hoang phí, không bừa bãi","thẳng thắn, đứng đắn, không tà, không gian dối"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, người có chữ \"Liêm\" chỉ có một thứ ham là","o":["ham học, ham làm, ham tiến bộ","ham địa vị, ham quyền lực","ham tiền tài, ham sung sướng","ham được khen, ham tâng bốc"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, mối quan hệ giữa Liêm và Kiệm là","o":["\"Có Kiệm mới Liêm được\"","\"Có Liêm mới Kiệm được\"","Liêm và Kiệm không liên quan","Liêm quan trọng hơn Kiệm"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Chính\" nghĩa là","o":["không tà, thẳng thắn, đứng đắn","trong sạch, không tham lam","siêng năng, chăm chỉ","tiết kiệm, không xa xỉ"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Chính\" được thể hiện rõ trong ba mối quan hệ nào?","o":["Đối với mình, đối với người, đối với việc","Đối với Đảng, đối với Nhà nước, đối với nhân dân","Đối với gia đình, đối với bạn bè, đối với xã hội","Đối với cấp trên, đối với cấp dưới, đối với đồng nghiệp"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"việc thiện thì dù nhỏ mấy cũng ..., việc ác thì dù nhỏ mấy cũng ...\"","o":["làm / tránh","tránh / làm","khen / chê","nhớ / quên"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, những người trong công sở nếu không giữ đúng cần, kiệm, liêm, chính thì dễ trở nên hủ bại, biến thành","o":["sâu mọt của dân","quan cách mạng","kẻ thù của dân","giặc nội xâm"],"e":""},{"c":6,"q":"\"Chí công vô tư\" theo Hồ Chí Minh là","o":["hoàn toàn vì lợi ích chung, không vì tư lợi, \"lo trước thiên hạ, vui sau thiên hạ\"","hoàn toàn không có bất kỳ lợi ích cá nhân nào, kể cả lợi ích chính đáng","chăm lo trước hết cho bản thân và gia đình rồi mới đến việc chung","công bằng, vô tư với những người cùng phe phái, cùng tổ chức"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Một dân tộc biết cần, kiệm, biết liêm, là một dân tộc giàu về ..., mạnh về ..., là một dân tộc văn minh tiến bộ\"","o":["vật chất / tinh thần","tinh thần / vật chất","kinh tế / quân sự","văn hóa / chính trị"],"e":""},{"c":6,"q":"Chủ tịch Hồ Chí Minh đã ví những đức tính nào của con người như trời có bốn mùa, đất có bốn phương (\"Thiếu một đức thì không thành người\")?","o":["Cần, kiệm, liêm, chính","Trung, hiếu, nhân, nghĩa","Nhân, nghĩa, trí, dũng","Chí công vô tư, khiêm tốn, giản dị, trung thực"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, phẩm chất được xác định là một trong những phẩm chất đạo đức cao đẹp nhất là","o":["thương yêu con người, sống có tình có nghĩa","trung với nước, hiếu với dân","cần, kiệm, liêm, chính","tinh thần quốc tế trong sáng"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, để đi làm cách mạng, người cách mạng phải là người","o":["giàu tình cảm cách mạng","không phô trương hình thức","siêng năng chăm chỉ","không ham tâng bốc mình"],"e":"Đề thi HK232. GT: \"người cách mạng là người giàu tình cảm, có tình cảm cách mạng mới đi làm cách mạng\"."},{"c":6,"q":"Theo Hồ Chí Minh, tình thương yêu con người phải được xây dựng trên lập trường nào?","o":["Lập trường giai cấp công nhân","Lập trường dân tộc","Lập trường nhân đạo chung","Lập trường tôn giáo"],"e":""},{"c":6,"q":"Tình yêu thương con người theo Hồ Chí Minh KHÔNG phải là thái độ nào?","o":["\"Dĩ hòa vi quý\", hạ thấp hay vùi dập con người","Chặt chẽ, nghiêm khắc với mình","Rộng rãi, độ lượng, vị tha với người khác","Nâng con người lên, kể cả người nhất thời lầm lạc"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh: \"Hiểu chủ nghĩa Mác - Lênin là phải sống với nhau có ... Nếu thuộc bao nhiêu sách mà sống không có ... thì sao gọi là hiểu chủ nghĩa Mác - Lênin được\"","o":["tình có nghĩa","kỷ luật","đoàn kết","văn hóa"],"e":""},{"c":6,"q":"Trong Di chúc, Hồ Chí Minh viết: \"Đầu tiên là công việc đối với ...\"","o":["con người","Đảng","kinh tế","quân đội"],"e":""},{"c":6,"q":"Phẩm chất \"tinh thần quốc tế trong sáng\" bắt nguồn từ đâu?","o":["Bản chất của giai cấp công nhân","Truyền thống hiếu khách của dân tộc","Yêu cầu ngoại giao","Tư tưởng đại đồng của Nho giáo"],"e":""},{"c":6,"q":"Câu thơ \"Quan sơn muôn dặm một nhà, Bốn phương vô sản đều là anh em!\" thể hiện phẩm chất đạo đức nào?","o":["Tinh thần quốc tế trong sáng","Trung với nước, hiếu với dân","Thương yêu con người","Cần, kiệm, liêm, chính"],"e":""},{"c":6,"q":"Hồ Chí Minh đã tạo ra kiểu quan hệ quốc tế mới nào?","o":["Đối thoại thay cho đối đầu, kiến tạo văn hóa hòa bình","Liên minh quân sự chặt chẽ để chống đế quốc","Phụ thuộc vào các nước lớn để được bảo vệ","Trung lập tuyệt đối, không quan hệ với ai"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, nguyên tắc quan trọng bậc nhất trong xây dựng nền đạo đức mới là","o":["nói đi đôi với làm","xây đi đôi với chống","tu dưỡng đạo đức suốt đời","nêu gương về đạo đức"],"e":""},{"c":6,"q":"\"Nói đi đôi với làm\" là đặc trưng bản chất của tư tưởng đạo đức Hồ Chí Minh, đối lập hoàn toàn với","o":["thói đạo đức giả, nói một đằng làm một nẻo","chủ nghĩa cá nhân, ích kỷ, hẹp hòi","bệnh quan liêu, xa rời quần chúng","tệ tham ô, lãng phí của công"],"e":""},{"c":6,"q":"Hồ Chí Minh yêu cầu cán bộ, đảng viên khi thực hiện nguyên tắc nêu gương về đạo đức cần làm gương trên các mặt","o":["tinh thần, vật chất và văn hóa","chính trị, văn hóa, đạo đức","tài năng, đạo đức, tinh thần","cách mạng, đạo đức, chính trị"],"e":"Đề thi HK232."},{"c":6,"q":"Theo Hồ Chí Minh, \"đối với các dân tộc phương Đông giàu tình cảm, một tấm gương sống còn có giá trị hơn ...\"","o":["một trăm bài diễn văn tuyên truyền","một nghìn cuốn sách","mười bài giảng đạo đức","một vạn lời hứa"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh: \"Lấy ... để hằng ngày giáo dục lẫn nhau là một trong những cách tốt nhất để xây dựng Đảng, xây dựng các tổ chức cách mạng, xây dựng con người mới, cuộc sống mới\"","o":["gương người tốt, việc tốt","gương sáng","gương điển hình tiên tiến","gương anh hùng"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, nguyên tắc \"xây đi đôi với chống\" trong xây dựng đạo đức nghĩa là","o":["muốn xây phải chống, chống để xây, lấy xây làm chính","muốn chống phải xây, lấy chống làm chính","chỉ cần xây dựng cái tốt, không cần chống cái xấu","xây và chống là hai việc tách rời, làm riêng rẽ"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh: \"Mỗi con người đều có thiện và ác ở trong lòng. Ta phải biết làm cho phần tốt ở trong mỗi con người nảy nở như ... và phần xấu bị mất dần đi\"","o":["hoa mùa Xuân","cây lớn lên","mặt trời mọc","ngọc được mài"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, để xây dựng đạo đức mới và chống cái vô đạo đức có kết quả, điều quan trọng là phải","o":["tạo phong trào quần chúng rộng rãi, kết hợp giáo dục với nghiêm minh pháp luật","chỉ dựa vào pháp luật nghiêm khắc để trừng trị mọi hành vi vô đạo đức","bắt buộc từng cá nhân thực hiện các chuẩn mực đạo đức bằng mệnh lệnh","chỉ động viên, khuyến khích từng cá nhân tự giác tu dưỡng"],"e":""},{"c":6,"q":"Trong bài \"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân\" (1969), Hồ Chí Minh lưu ý: đấu tranh chống chủ nghĩa cá nhân KHÔNG phải là","o":["\"giày xéo lên lợi ích cá nhân\"","quét sạch tư tưởng ích kỷ","nâng cao đạo đức cách mạng","bồi dưỡng tư tưởng tập thể"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, chủ nghĩa cá nhân là","o":["\"bệnh mẹ\", kẻ thù hung ác của đạo đức cách mạng","một biểu hiện bình thường, tự nhiên của con người","một động lực thúc đẩy xã hội phát triển","một phẩm chất cần phát huy trong kinh tế thị trường"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, chủ nghĩa cá nhân đẻ ra trăm thứ bệnh nguy hiểm như","o":["quan liêu, mệnh lệnh, bè phái, chủ quan, tham ô, lãng phí","lười biếng, tham ăn, ngủ nhiều, ham chơi, đua đòi","tự ti, nhút nhát, rụt rè, cả nể, ba phải, thụ động","khiêm tốn, giản dị, trung thực, chất phác, thật thà"],"e":"Câu hỏi hội thi tìm hiểu TTHCM."},{"c":6,"q":"\"Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong\". Câu nói thể hiện nguyên tắc nào?","o":["Tu dưỡng đạo đức suốt đời","Nói đi đôi với làm","Xây đi đôi với chống","Nêu gương về đạo đức"],"e":"Trích tác phẩm Đạo đức cách mạng (12-1958)."},{"c":6,"q":"Khi bàn về tu dưỡng đạo đức, Hồ Chí Minh nhắc lại luận điểm của Khổng Tử","o":["\"chính tâm, tu thân\", \"tề gia, trị quốc, bình thiên hạ\"","\"tiên học lễ, hậu học văn\", \"ôn cố tri tân\"","\"kỷ sở bất dục, vật thi ư nhân\", \"tiên trách kỷ\"","\"quân tử dĩ văn hội hữu\", \"dĩ hòa vi quý\""],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, \"Muốn cải tạo thế giới và cải tạo xã hội thì trước hết phải ...\"","o":["tự cải tạo bản thân chúng ta","lãnh đạo quần chúng","đánh đổ kẻ thù","phát triển kinh tế"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, việc tu dưỡng đạo đức của mỗi người phải được thực hiện trong","o":["mọi hoạt động thực tiễn, mọi mối quan hệ của mình","chỉ trong các buổi sinh hoạt Đảng, sinh hoạt đoàn thể","chỉ trong phạm vi gia đình và cuộc sống riêng tư","chỉ khi được tổ chức phân công, giao nhiệm vụ"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, con người là một chỉnh thể thống nhất về","o":["trí lực, tâm lực, thể lực","vật chất và tinh thần","lý trí và tình cảm","đức và tài"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, chữ \"người\" theo nghĩa rộng hơn nữa là","o":["cả loài người","đồng bào cả nước","gia đình, anh em, họ hàng","bạn bè, đồng chí"],"e":""},{"c":6,"q":"Theo Hồ Chí Minh, chữ \"người\" theo nghĩa hẹp là","o":["gia đình, anh em, họ hàng, bè bạn","đồng bào cả nước","cả loài người","giai cấp công nhân"],"e":""},{"c":6,"q":"Câu \"dân dĩ thực vi thiên\" (dân lấy ăn làm trời) thể hiện hiểu biết của Hồ Chí Minh về yếu tố nào của con người?","o":["Yếu tố sinh vật","Yếu tố
